<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schulapp">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Schulapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
/* =====================================================================
   Schulapp – Stylesheet
   Mobile first, optimiert für iPhone und iPad (Safari / Home-Bildschirm)
   ===================================================================== */

:root {
  --bg:        #f2f3f7;
  --surface:   #ffffff;
  --surface-2: #f7f8fb;
  --line:      #dfe2ea;
  --line-soft: #ebedf3;
  --ink:       #171a21;
  --ink-2:     #5a6170;
  --ink-3:     #8b91a0;
  --accent:    #3f5bd9;
  --accent-ink:#ffffff;
  --accent-soft:#e7ebfd;
  --good:      #1f8a53;
  --warn:      #b06a06;
  --bad:       #c0392f;
  --radius:    14px;
  --radius-sm: 10px;
  --tap:       44px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --topbar-h: 52px;
  --tabbar-h: 56px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #14171e;
    --surface:   #1c2029;
    --surface-2: #232834;
    --line:      #2f3542;
    --line-soft: #262c38;
    --ink:       #eef0f5;
    --ink-2:     #a8aebd;
    --ink-3:     #7b8293;
    --accent:    #7f95ff;
    --accent-ink:#11151f;
    --accent-soft:#242b45;
    --good:      #4cc487;
    --warn:      #e0a244;
    --bad:       #ef7b70;
  }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

[hidden] { display: none !important; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* Verhindert das automatische Hineinzoomen von iOS bei Eingabefeldern */
input, select, textarea { font-size: 16px; }

/* ---------------------------------------------------------------- Topbar */

.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 4px;
  height: calc(var(--topbar-h) + var(--sat));
  padding: var(--sat) calc(8px + var(--sar)) 0 calc(8px + var(--sal));
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line-soft);
}

.topbar-title {
  flex: 1;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-left: 4px;
}

.topbar-actions { display: flex; gap: 2px; }

.icon-btn {
  min-width: var(--tap);
  height: var(--tap);
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 17px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:active { background: var(--line-soft); }
#btnBack { font-size: 30px; line-height: 1; padding: 0 6px; min-width: 36px; }

.icon-btn.sync { position: relative; font-size: 19px; }
.icon-btn.sync.busy { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.dot {
  position: absolute;
  top: 8px; right: 7px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ink-3);
}
.dot.ok      { background: var(--good); }
.dot.pending { background: var(--warn); }
.dot.err     { background: var(--bad); }
.dot.off     { background: var(--ink-3); }

/* ------------------------------------------------------------------ Main */

.main {
  padding: calc(var(--topbar-h) + var(--sat) + 10px) calc(12px + var(--sar))
           calc(var(--tabbar-h) + var(--sab) + 24px) calc(12px + var(--sal));
  max-width: 900px;
  margin: 0 auto;
}

@media (min-width: 720px) {
  .main { padding-left: 20px; padding-right: 20px; }
}

/* ---------------------------------------------------------------- Tabbar */

.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 40;
  display: flex;
  height: calc(var(--tabbar-h) + var(--sab));
  padding-bottom: var(--sab);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line-soft);
}

.tab {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  padding: 0;
}
.tab-ico { font-size: 19px; line-height: 1.1; filter: grayscale(1) opacity(.65); }
.tab-lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; }
.tab.active { color: var(--accent); }
.tab.active .tab-ico { filter: none; }

/* ----------------------------------------------------------- Bausteine */

.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.card-body { padding: 12px 14px; }
.card-body.tight { padding: 4px 0; }

.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 18px 4px 8px;
}
.section-title:first-child { margin-top: 2px; }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
  width: 100%;
  border-left: 0; border-right: 0; border-top: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--surface-2); }
.row.static { cursor: default; }
.row.static:active { background: var(--surface); }

.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; letter-spacing: -.01em; }
.row-sub { font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.row-val { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chev { color: var(--ink-3); font-size: 20px; line-height: 1; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 650;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  border: 1px solid var(--line-soft);
}
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.good { color: var(--good); }
.badge.warn { color: var(--warn); }
.badge.bad  { color: var(--bad); }

.pill {
  width: 10px; height: 34px;
  border-radius: 999px;
  flex: none;
  background: var(--accent);
}

.empty {
  text-align: center;
  color: var(--ink-3);
  padding: 34px 20px;
  font-size: 15px;
}
.empty .big { font-size: 34px; display: block; margin-bottom: 8px; filter: grayscale(.4); }

.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.nums { font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------- Buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  cursor: pointer;
}
.btn:active { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger  { color: var(--bad); }
.btn.block   { display: flex; width: 100%; }
.btn.small   { min-height: 34px; padding: 0 12px; font-size: 14px; }

.btn-row { display: flex; gap: 8px; margin: 12px 0; }
.btn-row .btn { flex: 1; }

/* --------------------------------------------------------------- Formular */

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--ink-2);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  appearance: none;
  -webkit-appearance: none;
}
.field textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
  border-color: var(--accent);
}
.field .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }
.field.check { display: flex; align-items: center; gap: 10px; }
.field.check input { width: 22px; min-height: 22px; height: 22px; accent-color: var(--accent); }
.field.check label { margin: 0; font-size: 15px; color: var(--ink); font-weight: 500; }
.field-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ----------------------------------------------------------------- Modal */

.modal-bg {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,12,18,.42);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .15s ease;
}
@keyframes fade { from { opacity: 0; } }
@media (min-width: 640px) { .modal-bg { align-items: center; } }

.modal {
  background: var(--bg);
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  border-radius: 18px 18px 0 0;
  display: flex;
  flex-direction: column;
  animation: rise .2s cubic-bezier(.2,.8,.3,1);
}
@media (min-width: 640px) { .modal { border-radius: 18px; max-height: 84vh; } }
@keyframes rise { from { transform: translateY(24px); } }

.modal-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 8px 10px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
  border-radius: 18px 18px 0 0;
}
.modal-head .t { flex: 1; font-weight: 650; }
.modal-body {
  padding: 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(14px + var(--sab));
}
.modal-foot {
  display: flex; gap: 8px;
  padding: 10px 14px calc(10px + var(--sab));
  border-top: 1px solid var(--line-soft);
  background: var(--surface);
}
.modal-foot .btn { flex: 1; }

/* ----------------------------------------------------------------- Toast */

.toast-host {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--tabbar-h) + var(--sab) + 10px);
  z-index: 70;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  background: #1d2230;
  color: #fff;
  padding: 9px 15px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 550;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  animation: fade .15s ease;
  max-width: 88vw;
}
.toast.err { background: var(--bad); }

/* -------------------------------------------------------------- Datumsleiste */

.datebar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.datebar .d-main { flex: 1; text-align: center; }
.datebar .d-day { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.datebar .d-date { font-size: 12.5px; color: var(--ink-2); }
.datebar button {
  width: var(--tap); height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--line-soft);
  background: var(--surface);
  color: var(--accent);
  font-size: 20px;
  cursor: pointer;
}

/* --------------------------------------------------------------- Stundenkarte */

.lesson {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
  cursor: pointer;
  width: 100%;
  border-left: 0; border-right: 0; border-top: 0;
  text-align: left;
  color: inherit;
}
.lesson:last-child { border-bottom: 0; }
.lesson:active { background: var(--surface-2); }
.lesson.free { opacity: .55; }
.lesson .hour {
  width: 42px; flex: none; text-align: center;
}
.lesson .hour .nr { font-weight: 750; font-size: 17px; }
.lesson .hour .tm { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lesson .meta { flex: 1; min-width: 0; }
.lesson .meta .l1 { font-weight: 640; letter-spacing: -.01em; }
.lesson .meta .l2 { font-size: 13px; color: var(--ink-2); }
.lesson .flags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }

/* ------------------------------------------------------------ Stundenplan-Raster */

.grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.plan-grid {
  display: grid;
  grid-template-columns: 26px repeat(5, minmax(60px, 1fr));
  gap: 3px;
  min-width: 340px;
}
@media (min-width: 640px) {
  .plan-grid { grid-template-columns: 34px repeat(5, minmax(96px, 1fr)); gap: 5px; }
}
.plan-grid .gh {
  font-size: 11.5px; font-weight: 700; color: var(--ink-3);
  text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: .05em;
}
.plan-grid .gn {
  font-size: 12px; font-weight: 700; color: var(--ink-3);
  display: flex; align-items: center; justify-content: center;
}
.cell {
  min-height: 54px;
  border-radius: 9px;
  border: 1px dashed var(--line);
  background: var(--surface);
  padding: 5px 6px;
  cursor: pointer;
  display: flex; flex-direction: column; justify-content: center;
  overflow: hidden;
  color: inherit;
  text-align: left;
}
.cell.filled { border-style: solid; border-color: transparent; }
.cell .c1 { font-size: 12.5px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.cell .c2 { font-size: 10.5px; opacity: .85; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.cell.empty-cell { color: var(--ink-3); font-size: 18px; align-items: center; }

/* -------------------------------------------------------------- Mitarbeit */

.mit-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
}
.mit-row:last-child { border-bottom: 0; }
.mit-name { flex: 1; min-width: 0; font-size: 15px; }
.mit-name .nn { font-weight: 600; }
.mit-name .avg { font-size: 11.5px; color: var(--ink-3); }
.smileys { display: flex; gap: 3px; flex: none; }
.sm {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--surface-2);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  filter: grayscale(1) opacity(.45);
  transition: filter .1s, transform .1s;
}
.sm:active { transform: scale(.92); }
.sm.on { filter: none; background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 380px) { .sm { width: 36px; height: 36px; font-size: 18px; } }

/* -------------------------------------------------------------- Abhakliste */

.kachel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 8px;
  padding: 10px 12px;
}

.kachel {
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: 11px;
  padding: 7px 8px 8px;
  min-width: 0;
}

.kachel-name {
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: -.01em;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kachel-felder { display: flex; gap: 5px; }

.chk {
  flex: 1;
  min-width: 0;
  height: 40px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 0 2px;
  transition: transform .1s;
}
.chk:active { transform: scale(.93); }
.chk-k {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  opacity: .75;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chk-z { font-size: 15px; font-weight: 700; line-height: 1; }

.chk.ok { color: var(--ink-3); }
.chk.e {
  background: color-mix(in srgb, var(--warn) 20%, var(--surface));
  border-color: transparent;
  color: var(--warn);
}
.chk.f {
  background: color-mix(in srgb, var(--bad) 18%, var(--surface));
  border-color: transparent;
  color: var(--bad);
}

.chk-fuss {
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--ink-2);
  background: var(--surface-2);
  border-top: 1px solid var(--line-soft);
  line-height: 1.5;
}

@media (max-width: 360px) {
  .kachel-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
}

/* ------------------------------------------------ Vergessen / Strafarbeit */

.chk-kachel .kachel-name { display: flex; align-items: baseline; gap: 6px; }
.chk-kachel .nn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.verg {
  flex: none;
  display: inline-block;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 10.5px;
  font-weight: 750;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  vertical-align: 1px;
}
.chk-kachel .verg { background: var(--surface); }
.verg.voll {
  background: color-mix(in srgb, var(--bad) 16%, var(--surface));
  border-color: transparent;
  color: var(--bad);
}
.verg[hidden] { display: none; }

.straf-leiste {
  margin-top: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.45;
}
.straf-leiste.voll {
  background: color-mix(in srgb, var(--bad) 13%, var(--surface));
  color: var(--bad);
}

.straf-box {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--bad) 12%, var(--surface));
  margin-bottom: 12px;
}
.straf-zahl {
  flex: none;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--bad);
  font-variant-numeric: tabular-nums;
}
.straf-text { font-size: 15px; line-height: 1.45; }

.kv.gross .k { font-weight: 650; color: var(--ink); }
.kv.gross .v { font-size: 17px; font-weight: 750; }
.kv .v.schlecht { color: var(--bad); }

/* --------------------------------------------------- Mitarbeit als Kacheln */

.mit-grid { grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }

.mit-kachel .kachel-name {
  display: flex;
  align-items: baseline;
  gap: 6px;
  white-space: normal;
}
.mit-kachel .nn {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mit-kachel .avg {
  flex: none;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.mit-kachel .smileys { gap: 4px; justify-content: space-between; }
.mit-kachel .sm { flex: 1; min-width: 0; max-width: 52px; width: auto; height: 40px; font-size: 18px; }

/* Auf dem iPhone passen nebeneinander keine zwei Kacheln mit fünf gut
   treffbaren Smileys – dort stehen Name und Smileys deshalb nebeneinander.
   Auf dem iPad bleibt es ein echtes Raster. */
@media (max-width: 559px) {
  .mit-grid { grid-template-columns: 1fr; gap: 6px; }
  .mit-kachel { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }

<script>
/* =====================================================================
   Schulapp – Kern: Daten, Synchronisation mit Google Sheets, Notenlogik

   Aufbau:
     Klasse  = Lerngruppe mit Schüler:innen (9a)
     Kurs    = Klasse + Fach (9a · Deutsch) – trägt Gewichtung und Noten
   Stundenplan, Stunden, Mitarbeit, Leistungen und Abhaken hängen am Kurs,
   die Schüler:innen an der Klasse. So werden Namen nur einmal gepflegt.
   ===================================================================== */

(function (global) {
'use strict';

/* --------------------------------------------------------------- Konstanten */

var TABLES = ['Klassen', 'Kurse', 'SuS', 'Stundenplan', 'Stunden', 'Mitarbeit',
              'Leistungen', 'Noten', 'Checks', 'Settings'];

var TAGE = [
  { nr: 1, kurz: 'Mo', lang: 'Montag' },
  { nr: 2, kurz: 'Di', lang: 'Dienstag' },
  { nr: 3, kurz: 'Mi', lang: 'Mittwoch' },
  { nr: 4, kurz: 'Do', lang: 'Donnerstag' },
  { nr: 5, kurz: 'Fr', lang: 'Freitag' }
];

var FARBEN = [
  { name: 'Blau',     hex: '#3f5bd9' },
  { name: 'Grün',     hex: '#0f8a6a' },
  { name: 'Orange',   hex: '#b4531c' },
  { name: 'Violett',  hex: '#8438b8' },
  { name: 'Himbeere', hex: '#b02a5b' },
  { name: 'Petrol',   hex: '#1f6f9c' },
  { name: 'Oliv',     hex: '#7a6a10' },
  { name: 'Schiefer', hex: '#4a5568' }
];
var STANDARDFARBE = FARBEN[0].hex;

function farbName(hex) {
  for (var i = 0; i < FARBEN.length; i++) if (FARBEN[i].hex === hex) return FARBEN[i].name;
  return 'eigene Farbe';
}

/**
 * Stufen-Notenschlüssel als Alternative zur linearen Umrechnung.
 * Prozent-Untergrenzen.
 */
var DEFAULT_SCHLUESSEL = [
  { note: 1,   prozent: 92 },
  { note: 1.5, prozent: 87 },
  { note: 2,   prozent: 81 },
  { note: 2.5, prozent: 74 },
  { note: 3,   prozent: 67 },
  { note: 3.5, prozent: 59 },
  { note: 4,   prozent: 50 },
  { note: 4.5, prozent: 40 },
  { note: 5,   prozent: 30 },
  { note: 5.5, prozent: 20 },
  { note: 6,   prozent: 0 }
];

var DEFAULT_CFG = {
  schuljahr: '',
  zeitraumVon: '',
  zeitraumBis: '',
  doppelstunden: true,
  stunden: [
    { nr: 1, von: '07:45', bis: '08:30' },
    { nr: 2, von: '08:30', bis: '09:15' },
    { nr: 3, von: '09:35', bis: '10:20' },
    { nr: 4, von: '10:20', bis: '11:05' },
    { nr: 5, von: '11:25', bis: '12:10' },
    { nr: 6, von: '12:10', bis: '12:55' },
    { nr: 7, von: '13:45', bis: '14:30' },
    { nr: 8, von: '14:30', bis: '15:15' }
  ],
  smileys: [
    { wert: 2,  emoji: '🤩', label: 'sehr stark', note: 1 },
    { wert: 1,  emoji: '🙂', label: 'gut',        note: 2 },
    { wert: 0,  emoji: '😐', label: 'mittel',     note: 3 },
    { wert: -1, emoji: '😕', label: 'wenig',      note: 4 },
    { wert: -2, emoji: '😴', label: 'gar nicht',  note: 5 }
  ],
  kategorien: [
    { name: 'Klassenarbeit', gewicht: 2 },
    { name: 'Test',          gewicht: 1 },
    { name: 'GFS',           gewicht: 1 },
    { name: 'Mündlich',      gewicht: 1 }
  ],
  /* 'linear' = stufenlose Umrechnung, sonst eine Stufentabelle */
  notenschluessel: 'linear',
  /* Vorgaben je Fach: { Deutsch: { kategorien: [...], notenschluessel: … } } */
  faecher: {},
  mitarbeitAktiv: true,
  mitarbeitKategorie: 'Mündlich',
  mitarbeitGewicht: 1,
  rundung: 'kaufmaennisch',
  namensformat: 'nachname',
  pin: '',
  checkpunkte: [
    { name: 'Hausaufgaben', kurz: 'HA', modus: 2 },
    { name: 'Material', kurz: 'Mat', modus: 2 }
  ],
  /* Ab wie vielen Vergessen (alle Punkte zusammen) gibt es eine Strafarbeit?
     0 schaltet den Hinweis ab. */
  strafarbeitAb: 5,
  /* Merkt sich je Kurs und Kind, bis zu welchem Stand schon gemeldet wurde. */
  strafHinweise: {}
};

var CHECK_VORLAGEN = [
  { titel: 'Unterricht', punkte: [
    { name: 'Hausaufgaben', kurz: 'HA', modus: 2 },
    { name: 'Material', kurz: 'Mat', modus: 2 }
  ] },
  { titel: 'Sport', punkte: [
    { name: 'Sportsachen', kurz: 'Sport', modus: 3 }
  ] },
  { titel: 'Nur Hausaufgaben', punkte: [
    { name: 'Hausaufgaben', kurz: 'HA', modus: 2 }
  ] },
  { titel: 'Keine Abhakliste', punkte: [] }
];

var CHECK_ZUSTAENDE = {
  ok: { zeichen: '✓', label: 'dabei' },
  e:  { zeichen: 'E', label: 'entschuldigt' },
  f:  { zeichen: '✕', label: 'fehlt' }
};

/* -------------------------------------------------------------- Hilfsfunktionen */

function uid(prefix) {
  return (prefix || 'x') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function esc(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function num(v, fallback) {
  var n = parseFloat(String(v).replace(',', '.'));
  return isFinite(n) ? n : (fallback === undefined ? null : fallback);
}

function pad2(n) { return (n < 10 ? '0' : '') + n; }

function todayISO() {
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function isoToDate(iso) {
  var p = String(iso || '').split('-');
  return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1);
}

function dateToISO(d) {
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

function addDays(iso, n) {
  var d = isoToDate(iso);
  d.setDate(d.getDate() + n);
  return dateToISO(d);
}

/** 1 = Montag … 7 = Sonntag */
function tagVon(iso) {
  var wd = isoToDate(iso).getDay();
  return wd === 0 ? 7 : wd;
}

function fmtDate(iso) {
  var d = isoToDate(iso);
  return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear();
}

function fmtDateShort(iso) {
  var d = isoToDate(iso);
  return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.';
}

function tagName(nr, lang) {
  for (var i = 0; i < TAGE.length; i++) if (TAGE[i].nr === nr) return lang ? TAGE[i].lang : TAGE[i].kurz;
  return nr === 6 ? (lang ? 'Samstag' : 'Sa') : (lang ? 'Sonntag' : 'So');
}

function fmtNote(n, stellen) {
  if (n === null || n === undefined || !isFinite(n)) return '–';
  return n.toFixed(stellen === undefined ? 2 : stellen).replace('.', ',');
}

function clone(o) {
  if (o === undefined || o === null) return o;
  return JSON.parse(JSON.stringify(o));
}

function parseJSON(s, fallback) {
  if (s === null || s === undefined || s === '') return fallback;
  if (typeof s === 'object') return s;
  try { return JSON.parse(s); } catch (e) { return fallback; }
}

function alive(r) { return r && String(r.deleted) !== '1'; }

/* ------------------------------------------------------------------ Speicher */

var LS = {
  get: function (key, fallback) {
    try {
      var v = localStorage.getItem('schulapp.' + key);
      return v === null ? fallback : JSON.parse(v);
    } catch (e) { return fallback; }
  },
  set: function (key, val) {
    try { localStorage.setItem('schulapp.' + key, JSON.stringify(val)); } catch (e) {}
  },
  del: function (key) {
    try { localStorage.removeItem('schulapp.' + key); } catch (e) {}
  }
};

/* ---------------------------------------------------------------- Datenbestand */

var DB = {};
TABLES.forEach(function (t) { DB[t] = []; });

var QUEUE = {};
var CONN = { url: '', token: '' };

function loadLocal() {
  var d = LS.get('db', null);
  if (d) TABLES.forEach(function (t) { DB[t] = Array.isArray(d[t]) ? d[t] : []; });
  QUEUE = LS.get('queue', {}) || {};
  CONN = LS.get('conn', { url: '', token: '' }) || { url: '', token: '' };
}

function saveLocal() {
  LS.set('db', DB);
  LS.set('queue', QUEUE);
}

/* ------------------------------------------------------------- CRUD-Funktionen */

function list(table, filterFn) {
  var arr = (DB[table] || []).filter(alive);
  return filterFn ? arr.filter(filterFn) : arr;
}

function byId(table, id) {
  var arr = DB[table] || [];
  for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i];
  return null;
}

function put(table, rec, skipSync) {
  if (!rec.id) rec.id = uid(table.slice(0, 2).toLowerCase());
  rec.updatedAt = new Date().toISOString();
  var arr = DB[table] || (DB[table] = []);
  var found = false;
  for (var i = 0; i < arr.length; i++) {
    if (arr[i].id === rec.id) { arr[i] = Object.assign({}, arr[i], rec); rec = arr[i]; found = true; break; }
  }
  if (!found) arr.push(rec);
  if (!skipSync) {
    QUEUE[table + ':' + rec.id] = rec;
    saveLocal();
    Sync.schedule();
  } else {
    saveLocal();
  }
  return rec;
}

function del(table, id) {
  var rec = byId(table, id);
  if (!rec) return;
  rec.deleted = '1';
  put(table, rec);
}

/** Löscht einen Datensatz samt abhängiger Daten. */
function delKaskade(table, id) {
  if (table === 'Klassen') {
    list('Kurse', function (k) { return k.klasseId === id; }).forEach(function (k) { delKaskade('Kurse', k.id); });
    list('SuS', function (s) { return s.klasseId === id; }).forEach(function (s) { delKaskade('SuS', s.id); });
  } else if (table === 'Kurse') {
    list('Stundenplan', function (r) { return r.kursId === id; }).forEach(function (r) { del('Stundenplan', r.id); });
    list('Stunden', function (r) { return r.kursId === id; }).forEach(function (r) { del('Stunden', r.id); });
    list('Mitarbeit', function (r) { return r.kursId === id; }).forEach(function (r) { del('Mitarbeit', r.id); });
    list('Checks', function (r) { return r.kursId === id; }).forEach(function (r) { del('Checks', r.id); });
    list('Leistungen', function (l) { return l.kursId === id; }).forEach(function (l) { delKaskade('Leistungen', l.id); });
  } else if (table === 'SuS') {
    list('Mitarbeit', function (m) { return m.susId === id; }).forEach(function (m) { del('Mitarbeit', m.id); });
    list('Noten', function (n) { return n.susId === id; }).forEach(function (n) { del('Noten', n.id); });
    list('Checks', function (c) { return c.susId === id; }).forEach(function (c) { del('Checks', c.id); });
  } else if (table === 'Leistungen') {
    list('Noten', function (n) { return n.leistungId === id; }).forEach(function (n) { del('Noten', n.id); });
  }
  del(table, id);
}

/* ------------------------------------------------------------- Einstellungen */

function cfg(key) {
  var rec = byId('Settings', key);
  if (rec && alive(rec)) {
    var v = parseJSON(rec.value, undefined);
    if (v !== undefined) return v;
  }
  return clone(DEFAULT_CFG[key]);
}

function setCfg(key, value) {
  put('Settings', { id: key, value: JSON.stringify(value) });
}

/* ============================================================== Umstellung */

/**
 * Früher war „Klasse“ gleichzeitig das Fach. Diese Funktion zieht jeden
 * solchen Eintrag auseinander: die Klasse behält die Schüler:innen, das Fach
 * wandert in einen Kurs, und alles Abhängige bekommt dessen kursId.
 * Läuft mehrfach ohne Schaden – migrierte Klassen haben kein Fach mehr.
 */
function migriere() {
  var geaendert = 0;

  list('Klassen', function (k) { return k.fach; }).forEach(function (k) {
    var vorhanden = list('Kurse', function (x) { return x.klasseId === k.id && x.fach === k.fach; })[0];
    var kurs = vorhanden || put('Kurse', {
      id: uid('ku'),
      klasseId: k.id,
      fach: k.fach,
      farbe: k.farbe || STANDARDFARBE,
      kategorien: k.kategorien || '',
      notenschluessel: k.notenschluessel || '',
      notiz: '',
      archiviert: k.archiviert || ''
    });

    ['Stundenplan', 'Stunden', 'Mitarbeit', 'Leistungen', 'Checks'].forEach(function (tab) {
      list(tab, function (r) { return r.klasseId === k.id && !r.kursId; }).forEach(function (r) {
        r.kursId = kurs.id;
        put(tab, r);
        geaendert++;
      });
    });

    k.fach = '';
    put('Klassen', k);
    geaendert++;
  });

  /* Kurse ohne Klasse können entstehen, wenn jemand direkt in der Tabelle
     herumräumt – lieber sichtbar lassen als still verschwinden. */
  return geaendert;
}

function namensSchluessel(text) {
  return String(text || '').trim().toLowerCase().replace(/\s+/g, '');
}

/** Klassen, die denselben Namen tragen – Kandidaten zum Zusammenführen. */
function doppelteKlassen() {
  var nach = {};
  klassen(true).forEach(function (k) {
    var key = namensSchluessel(k.name);
    (nach[key] || (nach[key] = [])).push(k);
  });
  return Object.keys(nach).filter(function (key) { return nach[key].length > 1; })
    .map(function (key) { return nach[key]; });
}

/**
 * Führt zwei gleichnamige Klassen zusammen: Fächer und Schüler:innen wandern
 * zur Zielklasse. Namensgleiche Schüler:innen werden zu einem Eintrag
 * verschmolzen, ihre Noten bleiben dabei erhalten.
 */
function klassenZusammenfuehren(zielId, quelleId) {
  var ziel = byId('Klassen', zielId);
  var quelle = byId('Klassen', quelleId);
  if (!ziel || !quelle || zielId === quelleId) return null;

  var bilanz = { kurse: 0, verschoben: 0, verschmolzen: 0 };

  kurseDerKlasse(quelle.id, true).forEach(function (kurs) {
    kurs.klasseId = ziel.id;
    put('Kurse', kurs);
    bilanz.kurse++;
  });

  var vorhanden = {};
  list('SuS', function (s) { return s.klasseId === ziel.id; }).forEach(function (s) {
    vorhanden[namensSchluessel(s.nachname) + '|' + namensSchluessel(s.vorname)] = s;
  });

  list('SuS', function (s) { return s.klasseId === quelle.id; }).forEach(function (s) {
    var key = namensSchluessel(s.nachname) + '|' + namensSchluessel(s.vorname);
    var treffer = vorhanden[key];
    if (treffer) {
      /* Doppelte Person: alles auf den bestehenden Eintrag umhängen */
      ['Noten', 'Mitarbeit', 'Checks'].forEach(function (tab) {
        list(tab, function (r) { return r.susId === s.id; }).forEach(function (r) {
          r.susId = treffer.id;
          put(tab, r);
        });
      });
      del('SuS', s.id);
      bilanz.verschmolzen++;
    } else {
      s.klasseId = ziel.id;
      put('SuS', s);
      vorhanden[key] = s;
      bilanz.verschoben++;
    }
  });

  ['Stundenplan', 'Stunden', 'Mitarbeit', 'Leistungen', 'Checks'].forEach(function (tab) {
    list(tab, function (r) { return r.klasseId === quelle.id; }).forEach(function (r) {
      r.klasseId = ziel.id;
      put(tab, r);
    });
  });

  del('Klassen', quelle.id);
  return bilanz;
}

/* ------------------------------------------------------------ Verbindung / API */

function warte(ms) {
  return new Promise(function (r) { setTimeout(r, ms); });
}

/**
 * Ruft das Apps-Script auf.
 * Google liefert gelegentlich statt der Daten eine Weiterleitungsseite –
 * deshalb bis zu drei Versuche, danach der JSONP-Weg als letzte Möglichkeit.
 */
function apiCall(action, payload) {
  var body = Object.assign({ token: CONN.token, action: action }, payload || {});
  var url = CONN.url;
  if (!url) return Promise.reject(new Error('Keine Verbindung eingerichtet.'));

  function nochmal(n, fehler) {
    if (n < 3) return warte(1200 * n).then(function () { return versuch(n + 1); });
    return jsonp(url, body).catch(function () { throw fehler; });
  }

  function versuch(n) {
    return fetch(url, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    }).then(function (r) {
      return r.text();
    }, function (netzfehler) {
      return { __fehler: netzfehler };
    }).then(function (t) {
      if (t && t.__fehler) return nochmal(n, t.__fehler);
      try { return JSON.parse(t); }
      catch (e) { return nochmal(n, new Error('Google hat statt der Daten eine Webseite geliefert.')); }
    });
  }

  return versuch(1);
}

function jsonp(url, body) {
  return new Promise(function (resolve, reject) {
    var name = 'schulappCb' + Math.random().toString(36).slice(2, 9);
    var script = document.createElement('script');
    var done = false;
    var timer = setTimeout(function () { finish(null, new Error('Zeitüberschreitung.')); }, 30000);

    function finish(data, err) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete global[name]; } catch (e) { global[name] = undefined; }
      if (script.parentNode) script.parentNode.removeChild(script);
      if (err) reject(err); else resolve(data);
    }

    global[name] = function (data) { finish(data, null); };
    var sep = url.indexOf('?') === -1 ? '?' : '&';
    script.src = url + sep + 'callback=' + name + '&payload=' + encodeURIComponent(JSON.stringify(body));
    script.onerror = function () { finish(null, new Error('Verbindung fehlgeschlagen.')); };
    document.head.appendChild(script);
  });
}

/* ----------------------------------------------------------------- Sync */

var Sync = {
  status: 'off',
  lastError: '',
  lastPull: LS.get('lastPull', ''),
  _timer: null,

  configured: function () { return !!(CONN.url && CONN.token); },

  setConn: function (url, token) {
    CONN = { url: String(url || '').trim(), token: String(token || '').trim() };
    LS.set('conn', CONN);
    this.update();
  },

  getConn: function () { return clone(CONN); },

  pendingCount: function () { return Object.keys(QUEUE).length; },

  update: function () {
    if (!this.configured()) this.status = 'off';
    else if (this.status !== 'busy') this.status = this.pendingCount() ? 'pending' : (this.lastError ? 'err' : 'ok');
    if (typeof global.onSyncChange === 'function') global.onSyncChange(this.status);
  },

  schedule: function () {
    var self = this;
    this.update();
    if (!this.configured()) return;
    clearTimeout(this._timer);
    this._timer = setTimeout(function () { self.flush(); }, 1200);
  },

  flush: function (silent) {
    var self = this;
    if (!this.configured()) return Promise.resolve(false);
    var keys = Object.keys(QUEUE);
    if (!keys.length) { this.lastError = ''; this.update(); return Promise.resolve(true); }

    var ops = {};
    keys.forEach(function (k) {
      var table = k.slice(0, k.indexOf(':'));
      (ops[table] || (ops[table] = [])).push(QUEUE[k]);
    });
    var opList = Object.keys(ops).map(function (t) { return { table: t, records: ops[t] }; });

    this.status = 'busy';
    this.update();

    return apiCall('push', { ops: opList }).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.message) || (res && res.error) || 'Unbekannter Fehler');
      keys.forEach(function (k) { delete QUEUE[k]; });
      saveLocal();
      self.lastError = '';
      self.status = 'ok';
      self.update();
      return true;
    }).catch(function (err) {
      self.lastError = err.message || String(err);
      self.status = 'err';
      self.update();
      if (!silent && typeof global.toast === 'function') global.toast('Nicht gespeichert: ' + self.lastError, true);
      return false;
    });
  },

  pull: function () {
    var self = this;
    if (!this.configured()) return Promise.reject(new Error('Keine Verbindung eingerichtet.'));

    return this.flush(true).then(function () {
      self.status = 'busy';
      self.update();
      return apiCall('pull', {});
    }).then(function (res) {
      if (!res || !res.ok) throw new Error((res && res.message) || (res && res.error) || 'Unbekannter Fehler');
      TABLES.forEach(function (t) {
        if (Array.isArray(res.tables[t])) DB[t] = res.tables[t];
      });
      Object.keys(QUEUE).forEach(function (k) {
        var table = k.slice(0, k.indexOf(':'));
        var rec = QUEUE[k];
        var arr = DB[table] || (DB[table] = []);
        var hit = false;
        for (var i = 0; i < arr.length; i++) if (arr[i].id === rec.id) { arr[i] = rec; hit = true; break; }
        if (!hit) arr.push(rec);
      });
      self.lastPull = new Date().toISOString();
      LS.set('lastPull', self.lastPull);
      self.lastError = '';
      migriere();
      self.status = self.pendingCount() ? 'pending' : 'ok';
      saveLocal();
      self.update();
      return true;
    }).catch(function (err) {
      self.lastError = err.message || String(err);
      self.status = 'err';
      self.update();
      throw err;
    });
  },

  test: function (url, token) {
    var old = clone(CONN);
    CONN = { url: String(url || '').trim(), token: String(token || '').trim() };
    return apiCall('ping', {}).then(function (res) {
      CONN = old;
      return res;
    }).catch(function (e) {
      CONN = old;
      throw e;
    });
  }
};

/* ============================================================ Klassen & Kurse */

function klassen(mitArchiv) {
  return list('Klassen', function (k) { return mitArchiv || String(k.archiviert) !== '1'; })
    .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), 'de'); });
}

function kurseDerKlasse(klasseId, mitArchiv) {
  return list('Kurse', function (k) {
    return k.klasseId === klasseId && (mitArchiv || String(k.archiviert) !== '1');
  }).sort(function (a, b) { return String(a.fach).localeCompare(String(b.fach), 'de'); });
}

function alleKurse(mitArchiv) {
  return list('Kurse', function (k) { return mitArchiv || String(k.archiviert) !== '1'; })
    .sort(function (a, b) { return kursLabel(a).localeCompare(kursLabel(b), 'de'); });
}

function klasseVonKurs(kurs) {
  return kurs ? byId('Klassen', kurs.klasseId) : null;
}

function kursLabel(kurs) {
  if (!kurs) return '–';
  var k = klasseVonKurs(kurs);
  return (k ? k.name : '?') + (kurs.fach ? ' · ' + kurs.fach : '');
}

function kursFarbe(kurs) { return (kurs && kurs.farbe) || STANDARDFARBE; }

function susDerKlasse(klasseId) {
  return list('SuS', function (s) { return s.klasseId === klasseId && String(s.aktiv) !== '0'; })
    .sort(function (a, b) {
      var sa = num(a.sortierung, 0) || 0, sb = num(b.sortierung, 0) || 0;
      if (sa !== sb) return sa - sb;
      return susName(a, 'nachname').localeCompare(susName(b, 'nachname'), 'de');
    });
}

function susDesKurses(kursId) {
  var kurs = byId('Kurse', kursId);
  return kurs ? susDerKlasse(kurs.klasseId) : [];
}

function susName(s, format) {
  var f = format || cfg('namensformat');
  var vn = (s.vorname || '').trim(), nn = (s.nachname || '').trim();
  if (f === 'vorname') return (vn + ' ' + nn).trim();
  if (f === 'kurz') return (nn + (vn ? ', ' + vn.charAt(0) + '.' : '')).trim();
  return (nn + (vn ? ', ' + vn : '')).trim();
}

/** Kurzform für enge Kacheln: „Ahmadi, S.“ oder abgeschnitten. */
function susKurz(s) {
  var nn = (s.nachname || '').trim(), vn = (s.vorname || '').trim();
  if (!nn) return vn;
  return nn + (vn ? ', ' + vn.charAt(0) + '.' : '');
}

/* -------------------------------------------------------------- Fach-Vorgaben */

function fachVorgabe(fach) {
  var alle = cfg('faecher') || {};
  return alle[fach] || null;
}

function setFachVorgabe(fach, vorgabe) {
  var alle = cfg('faecher') || {};
  if (vorgabe) alle[fach] = vorgabe; else delete alle[fach];
  setCfg('faecher', alle);
}

function faecherListe() {
  var namen = {};
  Object.keys(cfg('faecher') || {}).forEach(function (f) { namen[f] = true; });
  alleKurse(true).forEach(function (k) { if (k.fach) namen[k.fach] = true; });
  return Object.keys(namen).sort(function (a, b) { return a.localeCompare(b, 'de'); });
}

/* ================================================================= Notenlogik */

function kategorienVon(kurs) {
  var eigen = parseJSON(kurs && kurs.kategorien, null);
  if (eigen && eigen.length) return eigen;
  var vg = kurs ? fachVorgabe(kurs.fach) : null;
  if (vg && vg.kategorien && vg.kategorien.length) return vg.kategorien;
  return cfg('kategorien');
}

/** Liefert 'linear' oder eine Stufentabelle. */
function schluesselVon(kurs, leistung) {
  var s;
  if (leistung && leistung.notenschluessel) {
    if (leistung.notenschluessel === 'linear') return 'linear';
    s = parseJSON(leistung.notenschluessel, null);
    if (s && s.length) return s;
  }
  if (kurs && kurs.notenschluessel) {
    if (kurs.notenschluessel === 'linear') return 'linear';
    s = parseJSON(kurs.notenschluessel, null);
    if (s && s.length) return s;
  }
  var vg = kurs ? fachVorgabe(kurs.fach) : null;
  if (vg && vg.notenschluessel) {
    if (vg.notenschluessel === 'linear') return 'linear';
    if (vg.notenschluessel.length) return vg.notenschluessel;
  }
  var global_ = cfg('notenschluessel');
  if (global_ === 'linear' || !global_ || !global_.length) return 'linear';
  return global_;
}

/**
 * Stufenlose Umrechnung: volle Punktzahl = 1,0, keine Punkte = 6,0.
 * Die Hälfte der Punkte ergibt damit genau 3,5.
 */
function noteLinear(punkte, maxPunkte) {
  var p = num(punkte, null), m = num(maxPunkte, null);
  if (p === null || !m) return null;
  var n = 6 - 5 * (p / m);
  n = Math.max(1, Math.min(6, n));
  return Math.round(n * 10) / 10;
}

function noteAusPunkten(punkte, maxPunkte, schluessel) {
  if (!schluessel || schluessel === 'linear' || !schluessel.length) {
    return noteLinear(punkte, maxPunkte);
  }
  var p = num(punkte, null), m = num(maxPunkte, null);
  if (p === null || !m) return null;
  var prozent = (p / m) * 100;
  var s = schluessel.slice().sort(function (a, b) { return num(b.prozent, 0) - num(a.prozent, 0); });
  for (var i = 0; i < s.length; i++) {
    if (prozent >= num(s[i].prozent, 0) - 1e-9) return num(s[i].note, null);
  }
  return 6;
}

/** Punktzahl, ab der eine bestimmte Note erreicht ist (für die Anzeige). */
function punkteFuerNote(note, maxPunkte, schluessel) {
  var m = num(maxPunkte, null);
  if (!m) return null;
  if (!schluessel || schluessel === 'linear' || !schluessel.length) {
    var anteil = (6 - num(note, 4)) / 5;
    return Math.round(anteil * m * 10) / 10;
  }
  var treffer = schluessel.filter(function (x) { return num(x.note, 0) === num(note, 0); })[0];
  if (!treffer) return null;
  return Math.ceil(num(treffer.prozent, 0) / 100 * m * 10) / 10;
}

function linearerSchluessel(pFuer4, pFuer1, stufen) {
  var p4 = num(pFuer4, 50), p1 = num(pFuer1, 92);
  if (p1 <= p4) p1 = Math.min(100, p4 + 40);
  var noten = stufen || [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5, 6];
  var out = [];
  noten.forEach(function (n) {
    var prozent;
    if (n <= 4) prozent = p4 + (4 - n) / 3 * (p1 - p4);
    else prozent = p4 * (6 - n) / 2;
    out.push({ note: n, prozent: Math.round(prozent * 10) / 10 });
  });
  return out;
}

/** Rundet auf eine ganze Zeugnisnote. */
function rundeNote(n) {
  if (n === null || n === undefined || !isFinite(n)) return null;
  var r = (cfg('rundung') === 'zugunsten') ? Math.ceil(n - 0.5) : Math.round(n);
  return Math.min(6, Math.max(1, r));
}

/** Auf Zehntel begrenzen, Bereich 1,0–6,0. */
function normNote(v) {
  var n = num(v, null);
  if (n === null) return null;
  n = Math.max(1, Math.min(6, n));
  return Math.round(n * 10) / 10;
}

function inZeitraum(datum) {
  var von = cfg('zeitraumVon'), bis = cfg('zeitraumBis');
  if (von && datum && datum < von) return false;
  if (bis && datum && datum > bis) return false;
  return true;
}

function smileyMap() {
  var m = {};
  cfg('smileys').forEach(function (s) { m[String(s.wert)] = num(s.note, null); });
  return m;
}

function noteFuer(leistung, susId, kurs) {
  var rec = null;
  var arr = DB.Noten || [];
  for (var i = 0; i < arr.length; i++) {
    if (alive(arr[i]) && arr[i].leistungId === leistung.id && arr[i].susId === susId) { rec = arr[i]; break; }
  }
  if (!rec) return null;
  var direkt = num(rec.note, null);
  if (direkt !== null) return direkt;
  return noteAusPunkten(rec.punkte, leistung.maxPunkte, schluesselVon(kurs, leistung));
}

function mitarbeitWerte(kursId, susId) {
  return list('Mitarbeit', function (m) {
    return m.kursId === kursId && m.susId === susId && m.wert !== '' && inZeitraum(m.datum);
  });
}

function mitarbeitSchnitt(kursId, susId) {
  var map = smileyMap();
  var rows = mitarbeitWerte(kursId, susId);
  var s = 0, n = 0;
  rows.forEach(function (m) {
    var note = map[String(m.wert)];
    if (note !== null && note !== undefined) { s += note; n++; }
  });
  return n ? { note: s / n, anzahl: n } : null;
}

function kategorieSchnitt(kurs, susId, katName) {
  var sumG = 0, sumGN = 0, anzahl = 0;
  list('Leistungen', function (l) {
    return l.kursId === kurs.id && l.kategorie === katName && inZeitraum(l.datum);
  }).forEach(function (l) {
    var n = noteFuer(l, susId, kurs);
    if (n === null) return;
    var g = num(l.gewicht, 1);
    if (g === null || g <= 0) g = 1;
    sumG += g; sumGN += g * n; anzahl++;
  });

  if (cfg('mitarbeitAktiv') && cfg('mitarbeitKategorie') === katName) {
    var ma = mitarbeitSchnitt(kurs.id, susId);
    if (ma) {
      var gm = num(cfg('mitarbeitGewicht'), 1) || 1;
      sumG += gm; sumGN += gm * ma.note; anzahl += 1;
    }
  }

  return sumG ? { note: sumGN / sumG, anzahl: anzahl } : null;
}

function gesamtnote(kurs, susId) {
  var kats = kategorienVon(kurs);
  var sumG = 0, sumGN = 0;
  var detail = [];
  kats.forEach(function (k) {
    var r = kategorieSchnitt(kurs, susId, k.name);
    var g = num(k.gewicht, 1);
    if (g === null || g < 0) g = 1;
    detail.push({ name: k.name, gewicht: g, note: r ? r.note : null, anzahl: r ? r.anzahl : 0 });
    if (!r || g === 0) return;
    sumG += g; sumGN += g * r.note;
  });
  return { note: sumG ? sumGN / sumG : null, detail: detail };
}

function notenspiegel(noten) {
  var counts = [0, 0, 0, 0, 0, 0];
  noten.forEach(function (n) {
    var r = rundeNote(n);
    if (r === null) return;
    counts[r - 1]++;
  });
  var vals = noten.filter(function (n) { return n !== null && isFinite(n); });
  var schnitt = vals.length ? vals.reduce(function (a, b) { return a + b; }, 0) / vals.length : null;
  return {
    counts: counts,
    anzahl: vals.length,
    schnitt: schnitt,
    bestanden: vals.filter(function (n) { return n < 4.5; }).length,
    max: Math.max.apply(null, counts.concat([1]))
  };
}

/* ---------------------------------------------------- Stundenplan und Blöcke */

function planFuerTag(tag) {
  return list('Stundenplan', function (p) { return num(p.tag, 0) === tag; })
    .sort(function (a, b) { return num(a.stunde, 0) - num(b.stunde, 0); });
}

function planZelle(tag, stunde) {
  var hit = null;
  list('Stundenplan').forEach(function (p) {
    if (num(p.tag, 0) === tag && num(p.stunde, 0) === stunde) hit = p;
  });
  return hit;
}

/**
 * Fasst aufeinanderfolgende Stunden desselben Kurses zu einem Block zusammen.
 * Aus 1. und 2. Stunde Deutsch wird ein Eintrag „1.–2.“, der nur einmal
 * abgehakt und bewertet wird.
 */
function bloeckeFuerTag(tag) {
  var zusammen = cfg('doppelstunden') !== false;
  var out = [];
  planFuerTag(tag).forEach(function (p) {
    var nr = num(p.stunde, 0);
    var letzter = out[out.length - 1];
    if (zusammen && letzter && p.kursId && letzter.kursId === p.kursId && nr === letzter.bis + 1) {
      letzter.bis = nr;
      letzter.eintraege.push(p);
      if (!letzter.raum && p.raum) letzter.raum = p.raum;
    } else {
      out.push({
        von: nr, bis: nr, kursId: p.kursId || '', raum: p.raum || '',
        fach: p.fach || '', eintraege: [p]
      });
    }
  });
  return out;
}

function blockLabel(block) {
  return block.von === block.bis ? block.von + '.' : block.von + '.–' + block.bis + '.';
}

/** Die Blöcke eines Datums – aus dem Wochenplan plus einzeln ergänzte Stunden. */
function bloeckeFuerDatum(datum) {
  var tag = tagVon(datum);
  var bloecke = bloeckeFuerTag(tag);

  list('Stunden', function (s) { return s.datum === datum && s.kursId; }).forEach(function (s) {
    var nr = num(s.stunde, 0);
    var drin = bloecke.some(function (b) {
      return b.kursId === s.kursId && nr >= b.von && nr <= b.bis;
    });
    if (!drin) bloecke.push({ von: nr, bis: nr, kursId: s.kursId, raum: '', fach: '', eintraege: [], extra: true });
  });

  return bloecke.sort(function (a, b) { return a.von - b.von; });
}

function stundeFuer(datum, stunde, kursId, anlegen) {
  var hit = null;
  list('Stunden').forEach(function (s) {
    if (s.datum === datum && num(s.stunde, 0) === num(stunde, 0) && s.kursId === kursId) hit = s;
  });
  if (hit || !anlegen) return hit;
  var kurs = byId('Kurse', kursId);
  return put('Stunden', {
    id: uid('st'), datum: datum, stunde: String(stunde), kursId: kursId,
    klasseId: kurs ? kurs.klasseId : '',
    thema: '', hausaufgaben: '', material: '', notiz: '', entfaellt: ''
  });
}

/* -------------------------------------------------------------- Mitarbeit */

function mitarbeitFuer(datum, stunde, susId) {
  var hit = null;
  list('Mitarbeit').forEach(function (m) {
    if (m.datum === datum && num(m.stunde, 0) === num(stunde, 0) && m.susId === susId) hit = m;
  });
  return hit;
}

function setMitarbeit(datum, stunde, kursId, susId, wert, bemerkung) {
  var rec = mitarbeitFuer(datum, stunde, susId);
  var kurs = byId('Kurse', kursId);
  if (!rec) {
    rec = { id: uid('ma'), datum: datum, stunde: String(stunde), kursId: kursId,
            klasseId: kurs ? kurs.klasseId : '', susId: susId };
  }
  rec.kursId = kursId;
  rec.wert = (wert === null || wert === undefined || wert === '') ? '' : String(wert);
  if (bemerkung !== undefined) rec.bemerkung = bemerkung;
  rec.deleted = '';
  return put('Mitarbeit', rec);
}

/* ------------------------------------------------------------- Abhakliste */

/**
 * Erkennt an der Fachbezeichnung, welche Abhakliste gemeint ist.
 * Sport braucht Sportsachen statt Hausaufgaben – das muss niemand einstellen.
 */
function vorlageFuerFach(fach) {
  var f = String(fach || '').toLowerCase();
  if (/sport|schwimm|bewegung/.test(f)) return vorlageNach('Sport');
  return null;
}

function vorlageNach(titel) {
  for (var i = 0; i < CHECK_VORLAGEN.length; i++) {
    if (CHECK_VORLAGEN[i].titel === titel) return clone(CHECK_VORLAGEN[i].punkte);
  }
  return null;
}

/**
 * Welche Punkte gelten für eine Stunde? Von fein nach grob:
 * Stundenplan-Eintrag → Kurs → Fach-Vorgabe → Fach-Erkennung → allgemeine Vorgabe.
 */
function checkpunkteFuer(kursId, stunde, datum) {
  var tag = datum ? tagVon(datum) : 0;
  var genau = null, irgendeiner = null;

  list('Stundenplan').forEach(function (p) {
    if (p.kursId !== kursId) return;
    if (tag && num(p.tag, 0) === tag && num(p.stunde, 0) === num(stunde, 0)) genau = p;
    if (!irgendeiner && p.checkpunkte) irgendeiner = p;
  });

  if (genau && genau.checkpunkte) {
    var eigene = parseJSON(genau.checkpunkte, null);
    if (eigene) return eigene;
  }
  if (irgendeiner) {
    var geerbt = parseJSON(irgendeiner.checkpunkte, null);
    if (geerbt) return geerbt;
  }

  var kurs = byId('Kurse', kursId);
  if (kurs) {
    if (kurs.checkpunkte) {
      var amKurs = parseJSON(kurs.checkpunkte, null);
      if (amKurs) return amKurs;
    }
    var vg = fachVorgabe(kurs.fach);
    if (vg && vg.checkpunkte) return vg.checkpunkte;
    var erkannt = vorlageFuerFach(kurs.fach);
    if (erkannt) return erkannt;
  }

  return cfg('checkpunkte') || [];
}

function checksDerStunde(datum, stunde) {
  var m = {};
  list('Checks').forEach(function (c) {
    if (c.datum === datum && num(c.stunde, 0) === num(stunde, 0)) m[c.susId + '|' + c.punkt] = c;
  });
  return m;
}

function checkWert(index, susId, punktName) {
  var c = index[susId + '|' + punktName];
  return (c && c.wert) ? c.wert : 'ok';
}

function setCheck(datum, stunde, kursId, susId, punktName, wert) {
  var rec = null;
  list('Checks').forEach(function (c) {
    if (c.datum === datum && num(c.stunde, 0) === num(stunde, 0) && c.susId === susId && c.punkt === punktName) rec = c;
  });
  var kurs = byId('Kurse', kursId);
  if (!rec) {
    rec = { id: uid('ck'), datum: datum, stunde: String(stunde), kursId: kursId,
            klasseId: kurs ? kurs.klasseId : '', susId: susId, punkt: punktName };
  }
  rec.kursId = kursId;
  rec.wert = (wert === 'ok') ? '' : wert;
  rec.deleted = '';
  return put('Checks', rec);
}

function naechsterCheck(wert, modus) {
  if (num(modus, 2) === 3) {
    return wert === 'ok' ? 'e' : (wert === 'e' ? 'f' : 'ok');
  }
  return wert === 'ok' ? 'f' : 'ok';
}

function checkBilanzStunde(datum, stunde, kursId) {
  var index = checksDerStunde(datum, stunde);
  var punkte = checkpunkteFuer(kursId, stunde, datum);
  var sus = susDesKurses(kursId);
  var out = { gesamt: 0, proPunkt: {} };
  punkte.forEach(function (p) {
    var e = 0, f = 0;
    sus.forEach(function (s) {
      var w = checkWert(index, s.id, p.name);
      if (w === 'e') e++;
      if (w === 'f') f++;
    });
    out.proPunkt[p.name] = { e: e, f: f };
    out.gesamt += e + f;
  });
  return out;
}

/**
 * Vorschlag für eine mündliche Note: der Durchschnitt der Smileys,
 * auf Zehntel gerundet. Null, wenn noch nichts erfasst wurde.
 */
function mitarbeitVorschlag(kursId, susId) {
  var m = mitarbeitSchnitt(kursId, susId);
  if (!m) return null;
  return { note: Math.round(m.note * 10) / 10, anzahl: m.anzahl };
}

/** Passt ein Notenvorschlag aus der Mitarbeit zu dieser Leistung? */
function vorschlagPasst(leistung) {
  if (!leistung) return false;
  if (num(leistung.maxPunkte, 0)) return false;
  var kat = String(leistung.kategorie || '');
  return kat === cfg('mitarbeitKategorie') || /m(ü|ue)ndl/i.test(kat);
}

function checkBilanzSus(kursId, susId) {
  var out = {};
  list('Checks', function (c) {
    return c.kursId === kursId && c.susId === susId && c.wert && inZeitraum(c.datum);
  }).forEach(function (c) {
    var z = out[c.punkt] || (out[c.punkt] = { e: 0, f: 0 });
    if (c.wert === 'e') z.e++; else z.f++;
  });
  return out;
}

/* ----------------------------------------------------------- Strafarbeit */

/**
 * Wie oft hat jemand in diesem Kurs etwas vergessen?
 * Hausaufgaben und Material zählen zusammen; entschuldigt zählt nicht mit.
 */
function vergessen(kursId, susId) {
  var bilanz = checkBilanzSus(kursId, susId);
  var gesamt = 0, entschuldigt = 0, teile = [];
  Object.keys(bilanz).forEach(function (name) {
    var z = bilanz[name];
    entschuldigt += z.e;
    if (!z.f) return;
    gesamt += z.f;
    teile.push({ name: name, anzahl: z.f });
  });
  teile.sort(function (a, b) { return b.anzahl - a.anzahl; });
  return { gesamt: gesamt, entschuldigt: entschuldigt, teile: teile };
}

/** Ab wie vielen Vergessen ist eine Strafarbeit fällig? 0 = Hinweis aus. */
function strafGrenze() {
  var n = num(cfg('strafarbeitAb'), 0);
  return n > 0 ? n : 0;
}

/** Stand für die Anzeige. */
function strafStand(kursId, susId) {
  var grenze = strafGrenze();
  var v = vergessen(kursId, susId);
  return {
    gesamt: v.gesamt,
    teile: v.teile,
    entschuldigt: v.entschuldigt,
    grenze: grenze,
    faellig: grenze ? Math.floor(v.gesamt / grenze) : 0,
    bisZurNaechsten: grenze ? grenze - (v.gesamt % grenze) : null
  };
}

/**
 * Ist die Grenze mit dem eben gesetzten Eintrag voll geworden?
 * Meldet jeden Stand nur einmal – Korrigieren löst keinen zweiten Hinweis aus.
 */
function strafFaellig(kursId, susId) {
  var grenze = strafGrenze();
  if (!grenze) return null;
  var st = strafStand(kursId, susId);
  if (!st.gesamt || st.gesamt % grenze !== 0) return null;
  if (st.gesamt <= num((cfg('strafHinweise') || {})[kursId + '|' + susId], 0)) return null;
  return st;
}

function strafGemeldet(kursId, susId, stand) {
  var alle = cfg('strafHinweise') || {};
  alle[kursId + '|' + susId] = stand;
  setCfg('strafHinweise', alle);
}

/** Vergessen über alle Fächer einer Klasse – für die Namensliste. */
function vergessenGesamt(klasseId, susId) {
  var gesamt = 0, faellig = 0;
  kurseDerKlasse(klasseId).forEach(function (ku) {
    var st = strafStand(ku.id, susId);
    gesamt += st.gesamt;
    faellig += st.faellig;
  });
  return { gesamt: gesamt, faellig: faellig };
}

function exportJSON() {

}

function importJSON(text, ersetzen) {
  var data = JSON.parse(text);
  var quelle = data.daten || data;
  TABLES.forEach(function (t) {
    if (!Array.isArray(quelle[t])) return;
    if (ersetzen) DB[t] = [];
    quelle[t].forEach(function (rec) { put(t, rec); });
  });
  migriere();
  saveLocal();
}

/** Erzeugt ein zufälliges Passwort für eine eigene Einrichtung. */
function neuesPasswort(laenge) {
  var zeichen = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var out = '';
  var buf = new Uint32Array(laenge || 28);
  (global.crypto || global.msCrypto).getRandomValues(buf);
  for (var i = 0; i < buf.length; i++) out += zeichen.charAt(buf[i] % zeichen.length);
  return out;
}

  if (st.grenze) {
    titel += st.faellig
      ? ' – Strafarbeit fällig'
      : ' – noch ' + st.bisZurNaechsten + ' bis zur Strafarbeit';
  }
  return '<span class="verg' + (st.faellig ? ' voll' : '') + '" data-verg="' + susId + '" ' +
    'title="' + A.esc(titel) + '">' + st.gesamt + '×</span>';
}

/** Zusammenfassung unter der Abhakliste. */
function checkFussText(datum, stunde, kursId, punkte) {
  var bilanz = A.checkBilanzStunde(datum, stunde, kursId);
  return punkte.map(function (pt) {
    var z = bilanz.proPunkt[pt.name] || { e: 0, f: 0 };
    if (!z.e && !z.f) return A.esc(pt.name) + ': alle dabei';
    var t = A.esc(pt.name) + ': ' + z.f + '× fehlt';
    if (z.e) t += ', ' + z.e + '× entschuldigt';
    return t;
  }).join(' · ');
}

VIEWS.heute = {

  body: function () {

    var h = '<div class="datebar">' +
      '<button data-act="tag-minus" aria-label="Vorheriger Tag">‹</button>' +
      '<div class="d-main" data-act="datum-waehlen">' +
        '<div class="d-day">' + (heute ? 'Heute · ' : '') + A.tagName(tag, true) + '</div>' +
        '<div class="d-date">' + A.fmtDate(datum) + '</div>' +
      '</div>' +
      '<button data-act="tag-plus" aria-label="Nächster Tag">›</button>' +
      '</div>';

    var bloecke = A.bloeckeFuerDatum(datum);

    if (!bloecke.length) {
      h += card('', empty(tag > 5 ? '🌤️' : '☕', tag > 5
        ? 'Wochenende – kein Unterricht eingetragen.'
        : 'Für diesen Tag steht nichts im Stundenplan.<br><span class="small">Unter <b>Plan</b> lässt sich der Stundenplan anlegen.</span>'));
      return h;
    }

    var rows = bloecke.map(function (b) {
      var kurs = A.byId('Kurse', b.kursId);
      var st = A.stundeFuer(datum, b.von, b.kursId, false);
      var sus = kurs ? A.susDesKurses(kurs.id) : [];
      var erfasst = 0;
      sus.forEach(function (s) { var m = A.mitarbeitFuer(datum, b.von, s.id); if (m && m.wert !== '') erfasst++; });

      var flags = '';
      if (st && st.entfaellt === '1') flags += '<span class="badge bad">entfällt</span>';
      if (b.von !== b.bis) flags += '<span class="badge">Doppelstunde</span>';
      if (sus.length) flags += '<span class="badge' + (erfasst ? ' accent' : '') + '">🙂 ' + erfasst + '/' + sus.length + '</span>';
      if (kurs && sus.length) {
        var cb = A.checkBilanzStunde(datum, b.von, kurs.id);
        if (cb.gesamt) flags += '<span class="badge bad">📋 ' + cb.gesamt + '</span>';
      }

      var zweiteZeile = [];
      if (b.raum) zweiteZeile.push('Raum ' + A.esc(b.raum));
      if (st && st.notiz) zweiteZeile.push(A.esc(st.notiz));

      return '<button class="lesson' + (kurs ? '' : ' free') + '" data-act="open-stunde" ' +
        'data-datum="' + datum + '" data-von="' + b.von + '" data-bis="' + b.bis + '" ' +
        'data-kurs="' + A.esc(b.kursId) + '">' +
        '<div class="hour"><div class="nr">' + A.blockLabel(b) + '</div>' +
          '<div class="tm">' + stundenZeit(b.von) + '</div></div>' +
        '<div class="pill" style="background:' + A.kursFarbe(kurs) + '"></div>' +
        '<div class="meta">' +
          '<div class="l1">' + A.esc(kurs ? A.kursLabel(kurs) : 'Kein Kurs hinterlegt') + '</div>' +
          (zweiteZeile.length ? '<div class="l2">' + zweiteZeile.join(' · ') + '</div>' : '') +
          (flags ? '<div class="flags">' + flags + '</div>' : '') +
        '</div><div class="chev">›</div></button>';
    }).join('');

    return h + card('', rows);
  }
};

VIEWS.stunde = {

      return h + card('', empty('🧑‍🎓', 'In der Klasse ' + A.esc((A.klasseVonKurs(kurs) || {}).name || '') +

        '<button class="btn primary block" data-act="open-klasse" data-klasse="' + kurs.klasseId + '">Klasse öffnen</button>');
    }

    /* --- Abhaken als Kachelraster: Standard ist „alle dabei“ --- */
    var punkte = A.checkpunkteFuer(kurs.id, p.stunde, p.datum) || [];
    if (punkte.length) {
      var index = A.checksDerStunde(p.datum, p.stunde);
      var kacheln = sus.map(function (s) {
        var felder = punkte.map(function (pt) {
          var w = A.checkWert(index, s.id, pt.name);
          var z = A.CHECK_ZUSTAENDE[w];
          return '<button class="chk ' + w + '" data-act="check" data-sus="' + s.id + '" ' +
            'data-punkt="' + A.esc(pt.name) + '" data-modus="' + (pt.modus || 2) + '" ' +
            'aria-label="' + A.esc(A.susName(s) + ' – ' + pt.name + ': ' + z.label) + '">' +
            '<span class="chk-k">' + A.esc(pt.kurz || pt.name.slice(0, 4)) + '</span>' +
            '<span class="chk-z">' + z.zeichen + '</span></button>';
        }).join('');
        return '<div class="kachel chk-kachel">' +
          '<div class="kachel-name"><span class="nn">' + A.esc(A.susKurz(s)) + '</span>' +
          vergessenBadge(kurs.id, s.id) + '</div>' +
          '<div class="kachel-felder">' + felder + '</div></div>';
      }).join('');

      h += card('Abhaken',
        '<div class="kachel-grid">' + kacheln + '</div>' +
        '<div class="chk-fuss" id="chkFuss">' + checkFussText(p.datum, p.stunde, kurs.id, punkte) + '</div>');
      h += '<div class="btn-row">' +
        '<button class="btn small" data-act="check-reset">Alle auf „dabei“</button>' +
        '<button class="btn small" data-act="check-punkte" data-kurs="' + kurs.id + '" ' +
        'data-tag="' + A.tagVon(p.datum) + '" data-stunde="' + p.stunde + '">Punkte anpassen</button></div>';
    }

    /* --- Mitarbeit, ebenfalls als Kachelraster --- */
    var smileys = A.cfg('smileys');
    var mkacheln = sus.map(function (s) {
      var m = A.mitarbeitFuer(p.datum, p.stunde, s.id);
      var wert = m ? String(m.wert) : '';
      var schnitt = A.mitarbeitSchnitt(kurs.id, s.id);
      var btns = smileys.map(function (sm) {
        return '<button class="sm' + (wert === String(sm.wert) ? ' on' : '') + '" ' +
          'data-act="mitarbeit" data-sus="' + s.id + '" data-wert="' + sm.wert + '" ' +
          'title="' + A.esc(sm.label) + '" aria-label="' + A.esc(A.susName(s) + ' – ' + sm.label) + '">' +
          sm.emoji + '</button>';
      }).join('');
      return '<div class="kachel mit-kachel">' +
        '<div class="kachel-name" data-act="mitarbeit-notiz" data-sus="' + s.id + '">' +
          '<span class="nn">' + A.esc(A.susKurz(s)) + '</span>' +
          '<span class="avg">' + (schnitt ? 'Ø ' + A.fmtNote(schnitt.note, 1) : '–') +
          (m && m.bemerkung ? ' 💬' : '') + '</span>' +
        '</div><div class="smileys">' + btns + '</div></div>';
    }).join('');

    h += card('Mitarbeit', '<div class="kachel-grid mit-grid">' + mkacheln + '</div>');
    h += '<div class="btn-row"><button class="btn small" data-act="mitarbeit-rest">Rest auf ' +
      (smileys[2] ? smileys[2].emoji : '😐') + '</button>' +
      '<button class="btn small" data-act="mitarbeit-leeren">Alle leeren</button></div>';
    h += '<button class="btn block" data-act="open-kurs" data-kurs="' + kurs.id + '">Noten von ' +
      A.esc(A.kursLabel(kurs)) + '</button>';
    return h;
  }
};

VIEWS.sus = {
  title: function (p) { var s = A.byId('SuS', p.id); return s ? A.susName(s) : 'Schüler:in'; },
  actions: function (p) { return '<button class="icon-btn" data-act="sus-bearbeiten" data-sus="' + p.id + '">···</button>'; },
  body: function (p) {
    var s = A.byId('SuS', p.id);
    if (!s) return card('', empty('❓', 'Nicht gefunden.'));
    var klasse = A.byId('Klassen', s.klasseId);
    if (!klasse) return card('', empty('❓', 'Klasse nicht gefunden.'));
    var kurse = A.kurseDerKlasse(klasse.id);

    var h = '<div class="hint-box">Klasse <b>' + A.esc(klasse.name) + '</b></div>';

    if (!kurse.length) return h + card('', empty('📚', 'Für diese Klasse ist noch kein Fach angelegt.'));

    kurse.forEach(function (kurs) {
      var g = A.gesamtnote(kurs, s.id);
      var ma = A.mitarbeitSchnitt(kurs.id, s.id);

      var inner = '<div class="card-body">' +
        '<div class="stat-row">' +
        '<div class="stat"><div class="v ' + noteKlasse(g.note) + '">' + A.fmtNote(g.note) + '</div><div class="k">Gesamt</div></div>' +
        '<div class="stat"><div class="v">' + (A.rundeNote(g.note) === null ? '–' : A.rundeNote(g.note)) + '</div><div class="k">Zeugnis</div></div>' +
        '<div class="stat"><div class="v">' + (ma ? A.fmtNote(ma.note, 1) : '–') + '</div><div class="k">Mitarbeit</div></div>' +
        '</div>' +
        g.detail.map(function (d) {
          return '<div class="kv"><span class="k">' + A.esc(d.name) + ' <span class="small muted">×' + d.gewicht +
            ', ' + d.anzahl + '</span></span><span class="v ' + noteKlasse(d.note) + '">' + A.fmtNote(d.note) + '</span></div>';
        }).join('') +
        '</div>';

      var leistungen = A.list('Leistungen', function (l) { return l.kursId === kurs.id; })
        .sort(function (a, b) { return String(b.datum).localeCompare(String(a.datum)); });

      inner += leistungen.map(function (l) {
        var n = A.noteFuer(l, s.id, kurs);
        var rec = A.list('Noten', function (x) { return x.leistungId === l.id && x.susId === s.id; })[0];
        var pkt = (rec && rec.punkte !== '' && rec.punkte !== undefined) ? rec.punkte + '/' + l.maxPunkte + ' P.' : '';
        return '<button class="row" data-act="open-leistung" data-leistung="' + l.id + '">' +
          '<div class="row-main"><div class="row-title">' + A.esc(l.titel || l.kategorie) + '</div>' +
          '<div class="row-sub">' + A.esc(l.kategorie) + (l.datum ? ' · ' + A.fmtDateShort(l.datum) : '') +
          (pkt ? ' · ' + pkt : '') + '</div></div>' +
          '<div class="row-val ' + noteKlasse(n) + '">' + A.fmtNote(n, 1) + '</div><div class="chev">›</div></button>';
      }).join('');

      var bilanz = A.checkBilanzSus(kurs.id, s.id);
      var namen = Object.keys(bilanz);
      if (namen.length) {
        var st = A.strafStand(kurs.id, s.id);
        inner += '<div class="card-body" style="border-top:1px solid var(--line-soft)">' +
          '<div class="kv gross"><span class="k">Vergessen</span>' +
          '<span class="v' + (st.faellig ? ' schlecht' : '') + '">' + st.gesamt + '×</span></div>' +
          namen.map(function (n) {
            var z = bilanz[n];
            return '<div class="kv"><span class="k small muted">' + A.esc(n) + '</span><span class="v small">' +
              z.f + '× fehlt' + (z.e ? ' · ' + z.e + '× entschuldigt' : '') + '</span></div>';
          }).join('') +
          (st.grenze
            ? '<div class="straf-leiste' + (st.faellig ? ' voll' : '') + '">' +
              (st.faellig
                ? '⚠️ <b>' + (st.faellig > 1 ? st.faellig + ' Strafarbeiten' : 'Strafarbeit') +
                  ' fällig</b> · nächster Hinweis nach ' + st.bisZurNaechsten + ' weiteren'
                : 'Noch <b>' + st.bisZurNaechsten + '</b> bis zur Strafarbeit (ab ' + st.grenze + ')') +
              '</div>'
            : '') +
          '</div>';
      }

      h += card(kurs.fach || 'ohne Fach', inner);
    });

    if (s.notiz) h += card('Notiz', '<div class="card-body">' + A.esc(s.notiz).replace(/\n/g, '<br>') + '</div>');
    return h;
  }
};

VIEWS.noten = {
  title: function () { return 'Noten'; },
  actions: function () { return '<button class="icon-btn" data-act="leistung-neu">＋</button>'; },
  body: function () {
    var kurse = A.alleKurse();
    if (!kurse.length) {
      return card('', empty('📊', 'Noch kein Fach angelegt.')) +
        '<button class="btn primary block" data-act="neue-klasse">Klasse anlegen</button>';
    }

    var h = '';
    var leer = true;
    kurse.forEach(function (kurs) {
      var leistungen = A.list('Leistungen', function (l) { return l.kursId === kurs.id; })
        .sort(function (a, b) { return String(b.datum).localeCompare(String(a.datum)); });
      if (!leistungen.length) return;
      leer = false;
      var sus = A.susDesKurses(kurs.id);
      var rows = leistungen.map(function (l) {
        var noten = sus.map(function (s) { return A.noteFuer(l, s.id, kurs); }).filter(function (n) { return n !== null; });
        var schnitt = noten.length ? noten.reduce(function (a, b) { return a + b; }, 0) / noten.length : null;
        var offen = sus.length - noten.length;
        return '<button class="row" data-act="open-leistung" data-leistung="' + l.id + '">' +
          '<div class="pill" style="background:' + A.kursFarbe(kurs) + ';height:26px"></div>' +
          '<div class="row-main"><div class="row-title">' + A.esc(l.titel || l.kategorie) + '</div>' +
          '<div class="row-sub">' + A.esc(l.kategorie) + (l.datum ? ' · ' + A.fmtDateShort(l.datum) : '') +
          (offen > 0 ? ' · <span class="badge warn">' + offen + ' offen</span>' : '') + '</div></div>' +
          '<div class="row-val">' + A.fmtNote(schnitt) + '</div><div class="chev">›</div></button>';
      }).join('');
      h += card(A.kursLabel(kurs), rows);
    });

    if (leer) h += card('', empty('📊', 'Noch keine Leistungen erfasst.'));
    h += '<button class="btn primary block" data-act="leistung-neu">Neue Leistung</button>';
    return h;
  }
};

VIEWS.leistung = {
  title: function (p) { var l = A.byId('Leistungen', p.id); return l ? (l.titel || l.kategorie) : 'Leistung'; },
  actions: function (p) { return '<button class="icon-btn" data-act="leistung-bearbeiten" data-leistung="' + p.id + '">···</button>'; },
  body: function (p) {
    var l = A.byId('Leistungen', p.id);
    if (!l) return card('', empty('❓', 'Nicht gefunden.'));
    var kurs = A.byId('Kurse', l.kursId);
    if (!kurs) return card('', empty('❓', 'Kurs nicht gefunden.'));

    var sus = A.susDesKurses(kurs.id);
    var max = A.num(l.maxPunkte, 0);
    var mitPunkten = !!max;
    var sch = A.schluesselVon(kurs, l);

    var h = '<div class="hint-box"><b>' + A.esc(A.kursLabel(kurs)) + '</b> · ' + A.esc(l.kategorie) +
      (l.datum ? ' · ' + A.fmtDate(l.datum) : '') + ' · Gewicht ×' + A.esc(l.gewicht || 1) + '<br>' +
      (mitPunkten
        ? 'Maximal ' + A.esc(l.maxPunkte) + ' Punkte · ' +
          (sch === 'linear'
            ? 'stufenlos: volle Punktzahl 1,0, halbe Punktzahl 3,5'
            : 'Stufentabelle')
        : 'Noten direkt eintragen (1,0 bis 6,0)') + '</div>';

    if (!sus.length) return h + card('', empty('👥', 'In dieser Klasse sind keine Schüler:innen angelegt.'));

    /* Vorschlag aus den Smileys – nur bei einer mündlichen Leistung ohne Punkte. */
    var zeigtVorschlag = A.vorschlagPasst(l);
    var zaehltSchon = zeigtVorschlag && A.cfg('mitarbeitAktiv') && A.cfg('mitarbeitKategorie') === l.kategorie;
    if (zaehltSchon) {
      h += '<div class="warn-box">Die Smileys fließen in der Art „' + A.esc(l.kategorie) +
        '“ bereits <b>automatisch</b> in die Gesamtnote ein. Wer sie hier zusätzlich als Note ' +
        'einträgt, zählt sie doppelt. Unter <i>Mehr → Mitarbeit in der Note</i> lässt sich das ' +
        'automatische Mitzählen abschalten.</div>';
    }

    var rows = sus.map(function (s, i) {
      var rec = A.list('Noten', function (x) { return x.leistungId === l.id && x.susId === s.id; })[0] || {};
      var n = A.noteFuer(l, s.id, kurs);
      var wert = mitPunkten
        ? (rec.punkte === undefined ? '' : rec.punkte)
        : (rec.note === undefined ? '' : rec.note);

      var chip = '';
      if (zeigtVorschlag) {
        var vs = A.mitarbeitVorschlag(kurs.id, s.id);
        chip = vs
          ? '<button class="vorschlag" data-act="vorschlag" data-sus="' + s.id + '" ' +
            'data-note="' + vs.note + '" title="Aus ' + vs.anzahl + ' Smileys – tippen zum Übernehmen">' +
            '<span class="vs-k">Vorschlag</span><span class="vs-n">' + A.fmtNote(vs.note, 1) + '</span></button>'
          : '<span class="vorschlag leer"><span class="vs-k">Vorschlag</span><span class="vs-n">–</span></span>';
      }

      return '<div class="mit-row">' +
        '<div class="mit-name"><div class="nn">' + A.esc(A.susName(s)) + '</div></div>' +
        '<div class="eingabe">' + chip +
          '<input class="pkt" data-note-input data-sus="' + s.id + '" data-idx="' + i + '" type="text" ' +
          'inputmode="decimal" value="' + A.esc(wert) + '" placeholder="' + (mitPunkten ? 'P.' : 'Note') + '">' +
          '<div class="nums ' + noteKlasse(n) + '">' + A.fmtNote(n, 1) + '</div>' +
        '</div></div>';
    }).join('');

    h += card(mitPunkten ? 'Punkte eintragen' : 'Noten eintragen', rows);

    if (zeigtVorschlag) {
      h += '<div class="btn-row"><button class="btn small" data-act="vorschlaege-alle">Vorschläge in leere Felder</button>' +
        '<button class="btn small" data-act="vorschlaege-alle" data-ueber="1">Auch belegte überschreiben</button></div>';
    }

    var noten = sus.map(function (s) { return A.noteFuer(l, s.id, kurs); });
    var sp = A.notenspiegel(noten);
    h += card('Notenspiegel', '<div class="card-body">' + spiegelHTML(sp) +
      '<div class="stat-row">' +
        '<div class="stat"><div class="v">' + A.fmtNote(sp.schnitt) + '</div><div class="k">Schnitt</div></div>' +
        '<div class="stat"><div class="v">' + sp.anzahl + '/' + sus.length + '</div><div class="k">Eingetragen</div></div>' +
        '<div class="stat"><div class="v">' + (sp.anzahl ? Math.round(sp.bestanden / sp.anzahl * 100) + '%' : '–') + '</div><div class="k">4 od. besser</div></div>' +
      '</div></div>');

    if (mitPunkten) {
      var zeilen;
      if (sch === 'linear') {
        zeilen = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5].map(function (note) {
          var pk = A.punkteFuerNote(note, max, 'linear');
          return '<div class="kv"><span class="k">Note ' + A.fmtNote(note, 1) + '</span>' +
            '<span class="v">ab ' + A.fmtNote(pk, 1) + ' P.</span></div>';
        }).join('');
      } else {
        zeilen = sch.slice().sort(function (a, b) { return A.num(b.prozent, 0) - A.num(a.prozent, 0); })
          .map(function (x) {
            var pk = A.punkteFuerNote(x.note, max, sch);
            return '<div class="kv"><span class="k">Note ' + A.fmtNote(A.num(x.note, 0), 1) + '</span>' +
              '<span class="v">ab ' + A.fmtNote(A.num(x.prozent, 0), 1) + ' % · ' + A.fmtNote(pk, 1) + ' P.</span></div>';
          }).join('');
      }
      h += card('Umrechnung', '<div class="card-body">' + zeilen +
        '<div class="btn-row" style="margin-bottom:0"><button class="btn small" data-act="schluessel-bearbeiten" ' +
        'data-kurs="' + kurs.id + '" data-leistung="' + l.id + '">Für diese Arbeit ändern</button></div></div>');
    }

    return h;
  }
};

function currentView() {
  var top = route.stack[route.stack.length - 1];
  return top ? { def: VIEWS[top.view], p: top.p } : { def: VIEWS[route.tab], p: {} };
}

function render() {
  var cur = currentView();
  if (!cur.def) { route.stack = []; cur = currentView(); }
  main.innerHTML = cur.def.body(cur.p);
  topTitle.textContent = cur.def.title(cur.p);
  topActions.innerHTML = cur.def.actions ? cur.def.actions(cur.p) : '';
  btnBack.hidden = route.stack.length === 0;
  document.querySelectorAll('.tab').forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-tab') === route.tab && route.stack.length === 0);
  });
}
window.render = render;
