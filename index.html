  });
}

function kursHatUnterrichtAmDatum(kursId, datum) {
  if (!kursId || !datum) return false;
  return A.bloeckeFuerDatum(datum).some(function (b) { return b.kursId === kursId; });
}

/* Zeigt eine Frist bereits in der letzten Unterrichtsstunde davor an. */
function istStundeVorFrist(kursId, datum, frist) {
  if (!kursId || !datum || !frist || datum >= frist) return false;
  if (!kursHatUnterrichtAmDatum(kursId, datum)) return false;
  var d = A.addDays(datum, 1);
  var sicherung = 0;
  while (d < frist && sicherung < 370) {
    if (kursHatUnterrichtAmDatum(kursId, d)) return false;
    d = A.addDays(d, 1);
    sicherung++;
  }
  return true;
}

function aufgabeStatus(a, kursId, bezugsdatum) {
  var datum = bezugsdatum || A.todayISO();
  if (!a || !a.frist) return { art: '', text: '', cls: '' };
  if (a.frist < datum) return { art: 'ueberfaellig', text: 'überfällig · ' + A.fmtDateShort(a.frist), cls: ' ueberfaellig' };
  if (a.frist === datum) return { art: 'heute', text: 'heute fällig', cls: ' heute' };
  if (istStundeVorFrist(kursId, datum, a.frist)) {
    return { art: 'bald', text: 'bald fällig · ' + A.fmtDateShort(a.frist), cls: ' bald' };
  }
  return { art: '', text: 'bis ' + A.fmtDateShort(a.frist), cls: '' };
}

function aufgabeFrist(a, bezugsdatum, kursId) {
  return aufgabeStatus(a, kursId || (a && a.kursId), bezugsdatum);
}

function aufgabenStatusKurs(kursId, bezugsdatum) {
  var datum = bezugsdatum || A.todayISO();
  var out = { ueberfaellig: false, heute: false, bald: false, frist: '' };
  aufgabenOffen(kursId).forEach(function (a) {
    var st = aufgabeStatus(a, kursId, datum);
    if (st.art === 'ueberfaellig') out.ueberfaellig = true;
    else if (st.art === 'heute') out.heute = true;
    else if (st.art === 'bald') out.bald = true;
    if (a.frist && (!out.frist || a.frist < out.frist)) out.frist = a.frist;
  });
  return out;
}

function naechstesDatumFuerTag(tag, abDatum) {
  var d = abDatum || A.todayISO();
  for (var i = 0; i < 7; i++) {
    if (A.tagVon(d) === tag) return d;
    d = A.addDays(d, 1);
  }
  return abDatum || A.todayISO();
}

/* Kompakter Hinweis in der Planansicht: überfällig oder innerhalb 7 Tagen fällig. */
function planKursHinweis(kursId, bezugsdatum) {
  var datum = bezugsdatum || A.todayISO();
  var offen = aufgabenOffen(kursId).filter(function (a) { return a.frist; });
  if (!offen.length) return null;
  var ueber = offen.filter(function (a) { return a.frist < datum; });
  if (ueber.length) return { cls: 'bad', text: '📋 überfällig', frist: ueber[0].frist };
  var baldBis = A.addDays(datum, 7);
  var bald = offen.filter(function (a) { return a.frist >= datum && a.frist <= baldBis; })[0];
  if (bald) return { cls: 'warn', text: '📋 ' + A.fmtDateShort(bald.frist), frist: bald.frist };
  return null;
}

function listenStand(a, kurs) {
  var sus = kurs ? A.susDesKurses(kurs.id) : [];
  var checks = (a && a.checks && typeof a.checks === 'object') ? a.checks : {};
  var erledigt = sus.filter(function (s) { return !!checks[s.id]; }).length;
  return { erledigt: erledigt, gesamt: sus.length, sus: sus, checks: checks };
}

function aufgabenRows(kurs, mitNeu, bezugsdatum) {
  if (!kurs) return '';
  var offen = aufgabenOffen(kurs.id);
  var body = offen.length ? offen.map(function (a) {
    var fr = aufgabeFrist(a, bezugsdatum, kurs.id);
    var istListe = a.typ === 'liste';
    var stand = istListe ? listenStand(a, kurs) : null;
    var sub = istListe
      ? stand.erledigt + '/' + stand.gesamt + ' eingesammelt'
      : (a.notiz ? A.esc(a.notiz) : 'offenes To-do');
    var prozent = (istListe && stand.gesamt) ? Math.round(stand.erledigt / stand.gesamt * 100) : 0;
    return '<button class="aufgabe-row' + fr.cls + '" data-act="aufgabe-open" data-aufgabe="' + A.esc(a.id) + '">' +
      '<span class="aufgabe-ico">' + (istListe ? '📋' : '✓') + '</span>' +
      '<span class="aufgabe-main"><span class="aufgabe-title">' + A.esc(a.titel) + '</span>' +
        '<span class="aufgabe-sub">' + sub + '</span>' +
        (istListe ? '<span class="aufgabe-progress"><i style="width:' + prozent + '%"></i></span>' : '') +
      '</span>' +
      (fr.text ? '<span class="aufgabe-frist' + fr.cls + '">' + A.esc(fr.text) + '</span>' : '') +
      '<span class="chev">›</span></button>';
  }).join('') : '<div class="card-body small muted">Keine offenen Listen oder To-dos.</div>';

  if (mitNeu) {
    body += '<div class="aufgabe-neu-zeile"><button class="btn block" data-act="aufgabe-neu" data-kurs="' +
      kurs.id + '">＋ Liste oder To-do anlegen</button></div>';
  }
  return body;
}

/* ------------------------------------------------------------------ Toast */

window.toast = function (msg, isError) {
  var host = $('#toastHost');
  var el = document.createElement('div');
  el.className = 'toast' + (isError ? ' err' : '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(function () {
    el.style.opacity = '0';
    el.style.transition = 'opacity .25s';
    setTimeout(function () { el.remove(); }, 260);
  }, isError ? 4200 : 2000);
};

window.onSyncChange = function (status) {
  syncDot.className = 'dot ' + (status === 'busy' ? 'pending' : status);
  btnSync.classList.toggle('busy', status === 'busy');
};

/* ------------------------------------------------------------------ Modal */

var Modal = {
  open: function (opts) {
    var host = $('#modalHost');
    var bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML =
      '<div class="modal" role="dialog">' +
        '<div class="modal-head"><div class="t">' + A.esc(opts.title || '') + '</div>' +
          '<button class="icon-btn" data-close>Fertig</button></div>' +
        '<div class="modal-body">' + (opts.body || '') + '</div>' +
        (opts.foot ? '<div class="modal-foot">' + opts.foot + '</div>' : '') +
      '</div>';
    host.appendChild(bg);

    var close = function () { bg.remove(); if (opts.onClose) opts.onClose(); };
    /* Tippen neben das Fenster schließt; „Fertig" ebenso. */
    bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    bg.querySelector('.modal').addEventListener('click', function (e) {
      if (e.target.closest('[data-close]')) close();
    });
    if (opts.after) opts.after(bg, close);
    return { el: bg, close: close };
  },

  form: function (opts) {
    var fields = opts.fields || [];
    var body = (opts.hinweis ? '<div class="hint-box">' + opts.hinweis + '</div>' : '') +
      fields.map(fieldHTML).join('');
    var foot =
      (opts.onDelete ? '<button class="btn danger" data-del>Löschen</button>' : '') +
      '<button class="btn primary" data-save>' + A.esc(opts.saveLabel || 'Speichern') + '</button>';

    return Modal.open({
      title: opts.title,
      body: body,
      foot: foot,
      after: function (bg, close) {
        var first = bg.querySelector('.modal-body input:not([type="hidden"]), .modal-body textarea, .modal-body select');
        if (first && opts.focus !== false && first.type !== 'date') setTimeout(function () { first.focus(); }, 60);

        /* Farbwahl: sichtbare Knöpfe schreiben in das versteckte Feld. */
        bg.querySelector('.modal').addEventListener('click', function (e) {
          var b = e.target.closest('.farb-opt');
          if (!b) return;
          var feld = b.closest('.field');
          feld.querySelectorAll('.farb-opt').forEach(function (x) { x.classList.remove('on'); });
          b.classList.add('on');
          var versteckt = feld.querySelector('input[type="hidden"]');
          if (versteckt) versteckt.value = b.getAttribute('data-farbe');
        });

        bg.querySelector('[data-save]').addEventListener('click', function () {
          var vals = {};
          fields.forEach(function (f) {
            var node = bg.querySelector('[name="' + f.key + '"]');
            if (!node) return;
            vals[f.key] = (f.type === 'checkbox') ? node.checked : node.value;
          });
          if (opts.validate) {
            var err = opts.validate(vals);
            if (err) { window.toast(err, true); return; }
          }
          close();
          opts.onSave(vals);
          render();
        });

        var d = bg.querySelector('[data-del]');
        if (d) d.addEventListener('click', function () {
          if (!confirm(opts.deleteHint || 'Wirklich löschen?')) return;
          close();
          opts.onDelete();
          render();
        });
      }
    });
  }
};

function fieldHTML(f) {
  var v = f.value === undefined || f.value === null ? '' : f.value;
  if (f.type === 'checkbox') {
    return '<div class="field check"><input type="checkbox" id="f_' + f.key + '" name="' + f.key + '"' +
      (v ? ' checked' : '') + '><label for="f_' + f.key + '">' + A.esc(f.label) + '</label></div>';
  }
  var inner;
  if (f.type === 'select') {
    inner = '<select name="' + f.key + '">' + (f.options || []).map(function (o) {
      var val = (typeof o === 'object') ? o.value : o;
      var lab = (typeof o === 'object') ? o.label : o;
      return '<option value="' + A.esc(val) + '"' + (String(val) === String(v) ? ' selected' : '') + '>' + A.esc(lab) + '</option>';
    }).join('') + '</select>';
  } else if (f.type === 'farbe') {
    var gew = String(v || A.STANDARDFARBE);
    inner = '<input type="hidden" name="' + f.key + '" value="' + A.esc(gew) + '">' +
      '<div class="farb-wahl">' + A.FARBEN.map(function (c) {
        return '<button type="button" class="farb-opt' + (c.hex === gew ? ' on' : '') + '" ' +
          'data-farbe="' + c.hex + '" style="--fc:' + c.hex + '">' +
          '<span class="farb-punkt"></span>' + A.esc(c.name) + '</button>';
      }).join('') + '</div>';
  } else if (f.type === 'textarea') {
    inner = '<textarea name="' + f.key + '" rows="' + (f.rows || 4) + '" placeholder="' + A.esc(f.placeholder || '') + '">' + A.esc(v) + '</textarea>';
  } else {
    inner = '<input name="' + f.key + '" type="' + (f.type || 'text') + '" value="' + A.esc(v) + '"' +
      (f.placeholder ? ' placeholder="' + A.esc(f.placeholder) + '"' : '') +
      (f.step ? ' step="' + f.step + '"' : '') +
      (f.min !== undefined ? ' min="' + f.min + '"' : '') +
      (f.inputmode ? ' inputmode="' + f.inputmode + '"' : '') +
      (f.autocap === false ? ' autocapitalize="off" autocorrect="off" spellcheck="false"' : '') + '>';
  }
  return '<div class="field"><label for="f_' + f.key + '">' + A.esc(f.label) + '</label>' + inner +
    (f.hint ? '<div class="hint">' + f.hint + '</div>' : '') + '</div>';
}

/* --------------------------------------------------------------- Navigation */

function go(tab) { route.tab = tab; route.stack = []; window.scrollTo(0, 0); render(); }
function push(view, p) { route.stack.push({ view: view, p: p || {} }); window.scrollTo(0, 0); render(); }
function back() { route.stack.pop(); window.scrollTo(0, 0); render(); }

btnBack.addEventListener('click', back);

document.querySelectorAll('.tab').forEach(function (t) {
  t.addEventListener('click', function () { go(t.getAttribute('data-tab')); });
});

btnSync.addEventListener('click', function () {
  if (!A.Sync.configured()) { showAuth('login'); return; }
  A.Sync.pull().then(function () { window.toast('Daten aktualisiert'); render(); })
    .catch(function (e) { window.toast('Fehler: ' + e.message, true); });
});

/* ------------------------------------------------------------- Bausteine */

function card(title, inner, cls) {
  return '<div class="card' + (cls ? ' ' + cls : '') + '">' +
    (title ? '<div class="card-head">' + A.esc(title) + '</div>' : '') + inner + '</div>';
}

function empty(icon, text) {
  return '<div class="empty"><span class="big">' + icon + '</span>' + text + '</div>';
}

function spiegelHTML(sp) {
  var max = Math.max.apply(null, sp.counts.concat([1]));
  var cols = sp.counts.map(function (c) {
    var h = c ? Math.max(4, Math.round(c / max * 92)) : 2;
    return '<div class="col"><div class="cnt">' + (c || '') + '</div>' +
      '<div class="bar' + (c ? '' : ' zero') + '" style="height:' + h + 'px"></div></div>';
  }).join('');
  return '<div class="spiegel">' + cols + '</div>' +
    '<div class="spiegel-x"><div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div></div>';
}

function noteKlasse(n) {
  if (n === null || n === undefined || !isFinite(n)) return '';
  if (n < 2.5) return 'g1';
  if (n >= 4.5) return 'g5';
  return '';
}

function stundenZeit(nr) {
  var s = A.cfg('stunden').filter(function (x) { return A.num(x.nr, 0) === A.num(nr, 0); })[0];
  return s ? s.von : '';
}

/** Erste noch nicht vergebene Farbe – damit sich Fächer im Plan unterscheiden. */
function freieFarbe() {
  var kurse = A.alleKurse(true);
  var belegt = {};
  kurse.forEach(function (k) { belegt[A.kursFarbe(k)] = true; });
  for (var i = 0; i < A.FARBEN.length; i++) {
    if (!belegt[A.FARBEN[i].hex]) return A.FARBEN[i].hex;
  }
  return A.FARBEN[kurse.length % A.FARBEN.length].hex;
}

function kursSchnitt(kurs) {
  var noten = A.susDesKurses(kurs.id).map(function (s) { return A.gesamtnote(kurs, s.id).note; })
    .filter(function (n) { return n !== null; });
  return noten.length ? noten.reduce(function (a, b) { return a + b; }, 0) / noten.length : null;
}

/** Zähler „x× vergessen" für die Abhak-Kachel; leer, solange nichts fehlt. */
function vergessenBadge(kursId, susId) {
  var st = A.strafStand(kursId, susId);
  if (!st.gesamt) return '<span class="verg" data-verg="' + susId + '" hidden></span>';
  var titel = st.teile.map(function (t) { return t.anzahl + '× ' + t.name; }).join(', ');
  if (st.grenze) {
    titel += st.faellig
      ? ' – Strafarbeit fällig'
      : ' – noch ' + st.bisZurNaechsten + ' bis zur Strafarbeit';
  }
  return '<span class="verg' + (st.faellig ? ' voll' : '') + '" data-verg="' + susId + '" ' +
    'title="' + A.esc(titel) + '">' + st.gesamt + '×</span>';
}

/** Zusammenfassung unter der Abhakliste. */
function checkFussText(datum, stunde, kursId, punkte) {
  var bilanz = A.checkBilanzStunde(datum, stunde, kursId);
  return punkte.map(function (pt) {
    var z = bilanz.proPunkt[pt.name] || { e: 0, f: 0 };
    if (!z.e && !z.f) return A.esc(pt.name) + ': alle dabei';
    var t = A.esc(pt.name) + ': ' + z.f + '× fehlt';
    if (z.e) t += ', ' + z.e + '× entschuldigt';
    return t;
  }).join(' · ');
}

var VIEWS = {};

/* ====================================================================== */
/*  Heute                                                                 */
/* ====================================================================== */

VIEWS.heute = {
  title: function () { return 'Heute'; },
  actions: function () {
    return '<button class="icon-btn" data-act="datum-waehlen">📆</button>' +
           '<button class="icon-btn" data-act="extra-stunde">＋</button>';
  },
  body: function () {
    var datum = ui.datum;
    var tag = A.tagVon(datum);
    var heute = datum === A.todayISO();

    var h = '<div class="datebar">' +
      '<button data-act="tag-minus" aria-label="Vorheriger Tag">‹</button>' +
      '<div class="d-main" data-act="datum-waehlen">' +
        '<div class="d-day">' + (heute ? 'Heute · ' : '') + A.tagName(tag, true) + '</div>' +
        '<div class="d-date">' + A.fmtDate(datum) + '</div>' +
      '</div>' +
      '<button data-act="tag-plus" aria-label="Nächster Tag">›</button>' +
      '</div>';

    var bloecke = A.bloeckeFuerDatum(datum);

    if (!bloecke.length) {
      h += card('', empty(tag > 5 ? '🌤️' : '☕', tag > 5
        ? 'Wochenende – kein Unterricht eingetragen.'
        : 'Für diesen Tag steht nichts im Stundenplan.<br><span class="small">Unter <b>Plan</b> lässt sich der Stundenplan anlegen.</span>'));
      return h;
    }

    var rows = bloecke.map(function (b) {
      var kurs = A.byId('Kurse', b.kursId);
      var st = A.stundeFuer(datum, b.von, b.kursId, false);
      var sus = kurs ? A.susDesKurses(kurs.id) : [];
      var erfasst = 0;
      sus.forEach(function (s) { var m = A.mitarbeitFuer(datum, b.von, s.id); if (m && m.wert !== '') erfasst++; });

      var flags = '';
      var aufgabenLage = kurs ? aufgabenStatusKurs(kurs.id, datum) : { ueberfaellig: false, heute: false, bald: false };
      var aufgabenKlasse = aufgabenLage.ueberfaellig ? ' task-bad' : ((aufgabenLage.heute || aufgabenLage.bald) ? ' task-warn' : '');
      if (st && st.entfaellt === '1') flags += '<span class="badge bad">entfällt</span>';
      if (b.von !== b.bis) flags += '<span class="badge">Doppelstunde</span>';
      if (sus.length) flags += '<span class="badge' + (erfasst ? ' accent' : '') + '">🙂 ' + erfasst + '/' + sus.length + '</span>';
      if (kurs && sus.length) {
        var cb = A.checkBilanzStunde(datum, b.von, kurs.id);
        if (cb.gesamt) flags += '<span class="badge bad">📋 ' + cb.gesamt + '</span>';
      }
      if (aufgabenLage.ueberfaellig) flags += '<span class="badge bad">📋 überfällig</span>';
      else if (aufgabenLage.heute) flags += '<span class="badge warn">📋 heute fällig</span>';
      else if (aufgabenLage.bald) flags += '<span class="badge warn">📋 bald fällig</span>';

      var zweiteZeile = [];
      if (b.raum) zweiteZeile.push('Raum ' + A.esc(b.raum));
      if (st && st.notiz) zweiteZeile.push(A.esc(st.notiz));

      return '<button class="lesson' + (kurs ? '' : ' free') + aufgabenKlasse + '" data-act="open-stunde" ' +
        'data-datum="' + datum + '" data-von="' + b.von + '" data-bis="' + b.bis + '" ' +
        'data-kurs="' + A.esc(b.kursId) + '">' +
        '<div class="hour"><div class="nr">' + A.blockLabel(b) + '</div>' +
          '<div class="tm">' + stundenZeit(b.von) + '</div></div>' +
        '<div class="pill" style="background:' + A.kursFarbe(kurs) + '"></div>' +
        '<div class="meta">' +
          '<div class="l1">' + A.esc(kurs ? A.kursLabel(kurs) : 'Kein Kurs hinterlegt') + '</div>' +
          (zweiteZeile.length ? '<div class="l2">' + zweiteZeile.join(' · ') + '</div>' : '') +
          (flags ? '<div class="flags">' + flags + '</div>' : '') +
        '</div><div class="chev">›</div></button>';
    }).join('');

    return h + card('', rows);
  }
};

/* ====================================================================== */
/*  Eine Stunde                                                           */
/* ====================================================================== */

VIEWS.stunde = {
  title: function (p) {
    var kurs = A.byId('Kurse', p.kursId);
    return (kurs ? A.kursLabel(kurs) : 'Stunde');
  },
  actions: function () { return '<button class="icon-btn" data-act="stunde-menu">···</button>'; },
  body: function (p) {
    var kurs = A.byId('Kurse', p.kursId);
    var st = A.stundeFuer(p.datum, p.stunde, p.kursId, false) || {};
    var sus = kurs ? A.susDesKurses(kurs.id) : [];
    var spanne = (p.bis && p.bis !== p.stunde) ? p.stunde + '.–' + p.bis + '. Stunde' : p.stunde + '. Stunde';

    var h = '<div class="hint-box"><b>' + A.tagName(A.tagVon(p.datum), true) + ', ' + A.fmtDate(p.datum) + '</b>' +
      ' · ' + spanne + (st.entfaellt === '1' ? ' · <b>entfällt</b>' : '') +
      (st.notiz ? '<br>' + A.esc(st.notiz) : '') + '</div>';

    if (!kurs) return h + card('', empty('👥', 'Zu dieser Stunde ist kein Kurs hinterlegt.'));
    if (!sus.length) {
      return h + card('', empty('🧑‍🎓', 'In der Klasse ' + A.esc((A.klasseVonKurs(kurs) || {}).name || '') +
        ' sind noch keine Schüler:innen angelegt.') +
        '<button class="btn primary block" data-act="open-klasse" data-klasse="' + kurs.klasseId + '">Klasse öffnen</button>');
    }

    var offeneStrafen = A.offeneStrafarbeiten(kurs.id);
    if (offeneStrafen.length) {
      h += card('Offene Strafarbeiten', offeneStrafen.map(function (x) {
        var grund = x.stand.teile.map(function (p) { return p.anzahl + '× ' + A.esc(p.name); }).join(' · ');
        return '<div class="straf-offen-row">' +
          '<div class="straf-offen-main"><div class="straf-offen-name">' + A.esc(A.susName(x.sus)) + '</div>' +
          '<div class="straf-offen-sub">seit dem ' + x.aufgabe.schwelle + '. Vergessen fällig' +
          (grund ? ' · ' + grund : '') + '</div></div>' +
          '<button class="btn small" data-act="straf-erledigt" data-straf-id="' + A.esc(x.aufgabe.id) + '">Abgegeben ✓</button>' +
          '</div>';
      }).join(''), 'straf-offen');
    }

    var offeneAufgaben = aufgabenOffen(kurs.id);
    if (offeneAufgaben.length) {
      var aufgabenLageStunde = aufgabenStatusKurs(kurs.id, p.datum);
      var aufgabenCardKlasse = aufgabenLageStunde.ueberfaellig
        ? ' ueberfaellig'
        : ((aufgabenLageStunde.heute || aufgabenLageStunde.bald) ? ' bald-faellig' : '');
      h += card('Offene Listen & To-dos', aufgabenRows(kurs, false, p.datum),
        'aufgaben-card' + aufgabenCardKlasse);
    }

    /* --- Abhaken als Kachelraster: Standard ist „alle dabei“ --- */
    var punkte = A.checkpunkteFuer(kurs.id, p.stunde, p.datum) || [];
    if (punkte.length) {
      var index = A.checksDerStunde(p.datum, p.stunde);
      var kacheln = sus.map(function (s) {
        var felder = punkte.map(function (pt) {
          var w = A.checkWert(index, s.id, pt.name);
          var z = A.CHECK_ZUSTAENDE[w];
          return '<button class="chk ' + w + '" data-act="check" data-sus="' + s.id + '" ' +
            'data-punkt="' + A.esc(pt.name) + '" data-modus="' + (pt.modus || 2) + '" ' +
            'aria-label="' + A.esc(A.susName(s) + ' – ' + pt.name + ': ' + z.label) + '">' +
            '<span class="chk-k">' + A.esc(pt.kurz || pt.name.slice(0, 4)) + '</span>' +
            '<span class="chk-z">' + z.zeichen + '</span></button>';
        }).join('');
        return '<div class="kachel chk-kachel">' +
          '<div class="kachel-name"><span class="nn">' + A.esc(A.susKurz(s)) + '</span>' +
          vergessenBadge(kurs.id, s.id) + '</div>' +
          '<div class="kachel-felder">' + felder + '</div></div>';
      }).join('');

      h += card('Abhaken',
        '<div class="kachel-grid">' + kacheln + '</div>' +
        '<div class="chk-fuss" id="chkFuss">' + checkFussText(p.datum, p.stunde, kurs.id, punkte) + '</div>');
      h += '<div class="btn-row">' +
        '<button class="btn small" data-act="check-reset">Alle auf „dabei“</button>' +
        '<button class="btn small" data-act="check-punkte" data-kurs="' + kurs.id + '" ' +
        'data-tag="' + A.tagVon(p.datum) + '" data-stunde="' + p.stunde + '">Punkte anpassen</button></div>';
    }

    /* --- Mitarbeit, ebenfalls als Kachelraster --- */
    var smileys = A.cfg('smileys');
    var mkacheln = sus.map(function (s) {
      var m = A.mitarbeitFuer(p.datum, p.stunde, s.id);
      var wert = m ? String(m.wert) : '';
      var schnitt = A.mitarbeitBewertung(kurs.id, s.id);
      var btns = smileys.map(function (sm) {
        return '<button class="sm' + (wert === String(sm.wert) ? ' on' : '') + '" ' +
          'data-act="mitarbeit" data-sus="' + s.id + '" data-wert="' + sm.wert + '" ' +
          'title="' + A.esc(sm.label) + '" aria-label="' + A.esc(A.susName(s) + ' – ' + sm.label) + '">' +
          sm.emoji + '</button>';
      }).join('');
      return '<div class="kachel mit-kachel">' +
        '<div class="kachel-name" data-act="mitarbeit-notiz" data-sus="' + s.id + '">' +
          '<span class="nn">' + A.esc(A.susKurz(s)) + '</span>' +
          '<span class="avg">' + (schnitt ? 'Ø ' + A.fmtNote(schnitt.note, 1) : '–') +
          (m && m.bemerkung ? ' 💬' : '') + '</span>' +
        '</div><div class="smileys">' + btns + '</div></div>';
    }).join('');

    h += card('Mitarbeit', '<div class="kachel-grid mit-grid">' + mkacheln + '</div>' +
      '<div class="mitarbeit-actions">' +
        '<button class="btn small" data-act="mitarbeit-rest">Rest auf ' +
          (smileys[2] ? smileys[2].emoji : '😐') + '</button>' +
        '<button class="btn small" data-act="mitarbeit-leeren">Alle leeren</button>' +
      '</div>');

    h += '<div class="stunden-tools">' +
      '<button class="btn" data-act="zufall-sus">🎲 Zufall</button>' +
      '<button class="btn" data-act="gruppen">👥 Gruppen</button>' +
      '<button class="btn" data-act="gruppenpuzzle">🧩 Gruppenpuzzle</button>' +
      '<button class="btn" data-act="aufgabe-neu" data-kurs="' + kurs.id + '">📋 Liste / To-do</button>' +
      '</div>';

    h += '<button class="btn block" data-act="open-kurs" data-kurs="' + kurs.id + '">Noten von ' +
      A.esc(A.kursLabel(kurs)) + '</button>';
    return h;
  }
};

VIEWS.plan = {
  title: function () { return 'Stundenplan'; },
  actions: function () { return '<button class="icon-btn" data-act="plan-stunden">🕐</button>'; },
  body: function () {
    var stunden = A.cfg('stunden');
    var kurse = A.alleKurse();
    var h = '';

    if (kurse.length) {
      var gruppen = A.klassen().map(function (klasse) {
        var kk = A.kurseDerKlasse(klasse.id);
        if (!kk.length) return '';
        return '<div class="plan-kursgruppe"><div class="plan-kursgruppe-title">' + A.esc(klasse.name) + '</div>' +
          '<div class="plan-kurschips">' + kk.map(function (kurs) {
            var f = A.kursFarbe(kurs);
            var aktiv = ui.planKursId === kurs.id;
            var planHinweis = planKursHinweis(kurs.id, A.todayISO());
            return '<button type="button" class="plan-kurs-chip' + (aktiv ? ' selected' : '') + '" ' +
              'data-act="plan-kurs-waehlen" data-kurs="' + kurs.id + '" data-drag-kurs="' + kurs.id + '" draggable="true" ' +
              'style="background:' + f + '18;border-color:' + f + '55;color:' + f + '">' +
              A.esc(kurs.fach || 'ohne Fach') +
              (planHinweis ? '<span class="plan-chip-alert ' + planHinweis.cls + '">' + A.esc(planHinweis.text) + '</span>' : '') +
              '</button>';
          }).join('') + '</div></div>';
      }).filter(Boolean).join('');

      h += card('Kurse', '<div class="card-body">' + gruppen +
        '<div class="hint" style="margin-top:10px">Kurs ziehen und im Stundenplan ablegen. Auf Touch-Geräten geht auch: Kurs antippen, dann das gewünschte Feld.</div></div>', 'plan-kurswahl');
    } else {
      h += '<div class="hint-box">Lege zuerst eine Klasse und darunter mindestens ein Fach an.</div>';
    }

    h += '<div class="hint-box">' +
      (ui.planKursId
        ? '<b>' + A.esc(A.kursLabel(A.byId('Kurse', ui.planKursId))) + '</b> ist ausgewählt. Tippe auf ein Feld, um den Kurs dort einzutragen.'
        : 'Kurse können direkt auf die Stunden gezogen werden. Bereits belegte Felder lassen sich ebenfalls verschieben. Antippen öffnet weiterhin die Einstellungen.') +
      '</div>';

    var head = '<div class="gh"></div>' + A.TAGE.map(function (t) { return '<div class="gh">' + t.kurz + '</div>'; }).join('');
    var body = stunden.map(function (s) {
      var nr = A.num(s.nr, 0);
      var zellen = A.TAGE.map(function (t) {
        var p = A.planZelle(t.nr, nr);
        var kurs = p ? A.byId('Kurse', p.kursId) : null;
        if (!p || !kurs) {
          return '<button class="cell empty-cell" data-act="plan-zelle" data-plan-drop="1" data-tag="' + t.nr + '" data-stunde="' + nr + '">+</button>';
        }
        var f = A.kursFarbe(kurs);
        var kl = A.klasseVonKurs(kurs);
        var oben = A.planZelle(t.nr, nr - 1);
        var teilBlock = A.cfg('doppelstunden') !== false && oben && oben.kursId === p.kursId;
        var naechstesDatum = naechstesDatumFuerTag(t.nr, A.todayISO());
        var planLageJetzt = aufgabenStatusKurs(kurs.id, A.todayISO());
        var planLageStunde = aufgabenStatusKurs(kurs.id, naechstesDatum);
        var planAlarm = null;
        if (planLageJetzt.ueberfaellig) planAlarm = { cls: 'bad', text: '📋 überfällig' };
        else if (planLageStunde.heute || planLageStunde.bald) planAlarm = { cls: 'warn', text: '📋 bald' };
        return '<button class="cell filled' + (teilBlock ? ' fortsetzung' : '') + '" data-act="plan-zelle" ' +
          'data-plan-drop="1" data-plan-id="' + p.id + '" data-drag-kurs="' + kurs.id + '" draggable="true" ' +
          'data-tag="' + t.nr + '" data-stunde="' + nr + '" ' +
          'style="background:' + f + '1f;border-color:' + f + '55">' +
          '<div class="c1" style="color:' + f + '">' + A.esc(kl ? kl.name : '?') + '</div>' +
          '<div class="c2">' + A.esc(kurs.fach || '') + (p.raum ? ' · ' + A.esc(p.raum) : '') + '</div>' +
          ((!teilBlock && planAlarm) ? '<span class="plan-alert ' + planAlarm.cls + '">' + A.esc(planAlarm.text) + '</span>' : '') +
          '</button>';
      }).join('');
      return '<div class="gn">' + nr + '</div>' + zellen;
    }).join('');

    h += '<div class="grid-wrap"><div class="plan-grid">' + head + body + '</div></div>';
    h += '<div class="btn-row"><button class="btn" data-act="plan-stunden">Stundenzeiten</button>' +
         '<button class="btn" data-act="neue-klasse">Klasse anlegen</button></div>';
    return h;
  }
};

    h += card('Schüler:innen (' + sus.length + ')', sus.length ? '<div class="sus-grid">' + susRows + '</div>' : susRows);

VIEWS.sitzplan = {
  title: function (p) {
    var k = A.byId('Klassen', p.id);
    return k ? 'Sitzplan · ' + k.name : 'Sitzplan';
  },
  actions: function (p) {
    return '<button class="icon-btn" data-act="sitzplan-spalten" data-klasse="' + p.id + '">···</button>';
  },
  body: function (p) {
    var k = A.byId('Klassen', p.id);
    if (!k) return card('', empty('❓', 'Diese Klasse gibt es nicht mehr.'));
    var plan = sitzPlanFlex(k.id);
    var layout = !!ui.sitzLayout;
    var renderItems = plan.items.slice();

    /* Im Layoutmodus eine zusätzliche leere Reihe als Ablage / Ausbaufläche. */
    if (layout) {
      for (var x = 0; x < plan.tischeProReihe; x++) renderItems.push({ type: 'gap' });
    }

    var tische = renderItems.map(function (it, ti) {
      if (!it || it.type === 'gap') {
        return layout
          ? '<button class="sitz-tisch-slot" data-act="sitz-tisch-neu" data-index="' + ti + '" data-tisch-drop="' + ti + '">' +
              '<span class="plus">＋</span><span>Tisch</span></button>'
          : '<div class="sitz-tisch-luecke" aria-hidden="true"></div>';
      }

      var size = Math.max(1, A.num(it.size, 2));
      var span = Math.max(1, Math.min(plan.tischeProReihe, Math.ceil(size / 2)));
      var minBreite = Math.max(132, size * 67);
      var namen = (it.seats || []).map(function (sid) {
        var s = sid ? A.byId('SuS', sid) : null;
        return s ? A.susKurz(s) : '';
      }).filter(Boolean);
      var style = '--sitzanzahl:' + size + ';grid-column:span ' + span + ';min-width:' + minBreite + 'px';

      if (layout) {
        return '<button class="sitz-tisch-edit" data-act="sitz-tisch-konfig" data-index="' + ti + '" ' +
          'data-tisch-drag="' + ti + '" data-tisch-drop="' + ti + '" draggable="true" ' +
          'data-label="' + A.esc(namen.length ? namen.join(' · ') : 'Leerer Tisch') + '" style="' + style + '">' +
          '<span class="sitz-tisch-griff" aria-hidden="true">⠿</span>' +
          '<div class="sitz-tisch-namen">' + (namen.length ? A.esc(namen.join(' · ')) : '<span class="leer">freier Tisch</span>') + '</div>' +
          '<span class="sitz-tisch-groesse">' + size + (size === 1 ? ' Platz' : ' Plätze') + '</span>' +
          '</button>';
      }

      var sitze = (it.seats || []).map(function (sid, si) {
        var s = sid ? A.byId('SuS', sid) : null;
        var key = sitzKey(ti, si);
        return '<button class="sitzplatz' + (!s ? ' frei' : '') +
          (ui.sitzAuswahl === key ? ' selected' : '') + '" data-act="sitzplatz" ' +
          'data-tisch="' + ti + '" data-platz="' + si + '" data-sitz-drag="' + key + '" data-sitz-drop="' + key + '" draggable="true">' +
          (s ? A.esc(A.susKurz(s)) : 'frei') + '</button>';
      }).join('');
      return '<div class="sitz-tisch" style="' + style + '"><div class="sitz-tisch-sitze">' + sitze + '</div></div>';
    }).join('');

    var gridMin = Math.max(0, Math.round(plan.tischeProReihe * 155 + Math.max(0, plan.tischeProReihe - 1) * 20));
    var hinweis = layout
      ? 'Tisch antippen, um die Anzahl der Plätze festzulegen (z. B. 2er-, 3er- oder 4er-Reihe). Am Griff ziehen, um ganze Tische zu verschieben.'
      : 'Schüler:innen per Drag & Drop verschieben oder nacheinander zwei Plätze antippen, um sie zu tauschen.';

    return card('', '<div class="card-body sitz-raum">' +
        '<div class="sitz-tafel-wrap"><div class="sitz-tafel">Tafel / vorne</div></div>' +
        '<div class="sitz-layout-hinweis">' + hinweis + '</div>' +
        '<div class="sitz-scroll"><div class="sitz-tisch-grid" style="--tische-pro-reihe:' + plan.tischeProReihe + ';min-width:' + gridMin + 'px">' +
          tische + '</div></div></div>') +
      '<div class="btn-row"><button class="btn' + (layout ? ' sitz-mode-on' : '') + '" data-act="sitz-layout-toggle" data-klasse="' + k.id + '">' +
        (layout ? '✓ Layout fertig' : '🪑 Tische anordnen') + '</button>' +
      '<button class="btn" data-act="sitzplan-mischen" data-klasse="' + k.id + '">🎲 Zufällig mischen</button></div>' +
      '<button class="btn block" data-act="sitzplan-spalten" data-klasse="' + k.id + '">Tische pro Reihe</button>';
  }
};

        return '<tr data-act="open-sus" data-sus="' + s.id + '"><td class="name">' + A.esc(A.susKurz(s)) + '</td>' +
          tds + '<td class="gesamt ' + noteKlasse(g.note) + '">' + A.fmtNote(g.note, 2) + '</td></tr>';
      }).join('');

      h += card('Notenübersicht', '<div class="tbl-wrap"><table class="grades">' +
        '<thead>' + th + '</thead><tbody>' + tb + '</tbody></table></div>');
    }

    var leistungen = A.list('Leistungen', function (l) { return l.kursId === kurs.id; })
      .sort(function (a, b) { return String(b.datum).localeCompare(String(a.datum)); });

    var lRows = leistungen.length ? leistungen.map(function (l) {
      var noten = sus.map(function (s) { return A.noteFuer(l, s.id, kurs); }).filter(function (n) { return n !== null; });
      var schnitt = noten.length ? noten.reduce(function (a, b) { return a + b; }, 0) / noten.length : null;
      return '<button class="row" data-act="open-leistung" data-leistung="' + l.id + '">' +
        '<div class="row-main"><div class="row-title">' + A.esc(l.titel || l.kategorie) + '</div>' +
        '<div class="row-sub">' + A.esc(l.kategorie) + ' · ' + (l.datum ? A.fmtDateShort(l.datum) : 'ohne Datum') +
        ' · ' + noten.length + '/' + sus.length + ' eingetragen</div></div>' +
        '<div class="row-val">' + A.fmtNote(schnitt) + '</div><div class="chev">›</div></button>';
    }).join('') : empty('📝', 'Noch keine Leistungen erfasst.');

    h += card('Leistungen', lRows);
    h += '<button class="btn primary block" data-act="leistung-neu" data-kurs="' + kurs.id + '">Neue Leistung</button>';

    var sch = A.schluesselVon(kurs, null);
    h += card('Bewertung', '<div class="card-body">' +
      kats.map(function (c) {
        return '<div class="kv"><span class="k">' + A.esc(c.name) + '</span><span class="v">×' + c.gewicht + '</span></div>';
      }).join('') +
      (A.cfg('mitarbeitAktiv') ? '<div class="kv"><span class="k small muted">Smiley-Vorschlag zählt in „' +
        A.esc(A.cfg('mitarbeitKategorie')) + '“ und kann pro Schüler:in geändert werden</span><span class="v small">×' + A.cfg('mitarbeitGewicht') + '</span></div>' : '') +
      '<div class="kv"><span class="k">Notenschlüssel</span><span class="v">' +
        (sch === 'linear' ? 'stufenlos' : 'Stufentabelle') + '</span></div>' +
      '<div class="btn-row" style="margin-bottom:0">' +
        '<button class="btn small" data-act="kats-bearbeiten" data-kurs="' + kurs.id + '">Gewichtung</button>' +
        '<button class="btn small" data-act="schluessel-bearbeiten" data-kurs="' + kurs.id + '">Notenschlüssel</button>' +
      '</div>' +
      (kurs.fach ? '<button class="btn small block" style="margin-top:8px" data-act="fach-vorgabe-speichern" data-kurs="' + kurs.id + '">' +
        'Als Vorgabe für ' + A.esc(kurs.fach) + ' merken</button>' : '') +
      '</div>');

    return h;
  }
};

VIEWS.sus = {
  title: function (p) { var s = A.byId('SuS', p.id); return s ? A.susName(s) : 'Schüler:in'; },
  actions: function (p) { return '<button class="icon-btn" data-act="sus-bearbeiten" data-sus="' + p.id + '">···</button>'; },
  body: function (p) {
    var s = A.byId('SuS', p.id);
    if (!s) return card('', empty('❓', 'Nicht gefunden.'));
    var klasse = A.byId('Klassen', s.klasseId);
    if (!klasse) return card('', empty('❓', 'Klasse nicht gefunden.'));
    var kurse = A.kurseDerKlasse(klasse.id);

    var h = '<div class="hint-box">Klasse <b>' + A.esc(klasse.name) + '</b></div>';

    if (!kurse.length) return h + card('', empty('📚', 'Für diese Klasse ist noch kein Fach angelegt.'));

    kurse.forEach(function (kurs) {
      var g = A.gesamtnote(kurs, s.id);
      var ma = A.mitarbeitBewertung(kurs.id, s.id);

      var inner = '<div class="card-body">' +
        '<div class="stat-row">' +
        '<div class="stat"><div class="v ' + noteKlasse(g.note) + '">' + A.fmtNote(g.note) + '</div><div class="k">Gesamt</div></div>' +
        '<div class="stat"><div class="v">' + (A.rundeNote(g.note) === null ? '–' : A.rundeNote(g.note)) + '</div><div class="k">Zeugnis</div></div>' +
        '<div class="stat"><div class="v">' + (ma ? A.fmtNote(ma.note, 1) : '–') + '</div><div class="k">Mitarbeit</div></div>' +
        '</div>' +
        g.detail.map(function (d) {
          return '<div class="kv"><span class="k">' + A.esc(d.name) + ' <span class="small muted">×' + d.gewicht +
            ', ' + d.anzahl + '</span></span><span class="v ' + noteKlasse(d.note) + '">' + A.fmtNote(d.note) + '</span></div>';
        }).join('') +
        '</div>';

      var leistungen = A.list('Leistungen', function (l) { return l.kursId === kurs.id; })
        .sort(function (a, b) { return String(b.datum).localeCompare(String(a.datum)); });

      inner += leistungen.map(function (l) {
        var n = A.noteFuer(l, s.id, kurs);
        var rec = A.list('Noten', function (x) { return x.leistungId === l.id && x.susId === s.id; })[0];
        var pkt = (rec && rec.punkte !== '' && rec.punkte !== undefined) ? rec.punkte + '/' + l.maxPunkte + ' P.' : '';
        return '<button class="row" data-act="open-leistung" data-leistung="' + l.id + '">' +
          '<div class="row-main"><div class="row-title">' + A.esc(l.titel || l.kategorie) + '</div>' +
          '<div class="row-sub">' + A.esc(l.kategorie) + (l.datum ? ' · ' + A.fmtDateShort(l.datum) : '') +
          (pkt ? ' · ' + pkt : '') + '</div></div>' +
          '<div class="row-val ' + noteKlasse(n) + '">' + A.fmtNote(n, 1) + '</div><div class="chev">›</div></button>';
      }).join('');

      var bilanz = A.checkBilanzSus(kurs.id, s.id);
      var namen = Object.keys(bilanz);
      if (namen.length) {
        var st = A.strafStand(kurs.id, s.id);
        inner += '<div class="card-body" style="border-top:1px solid var(--line-soft)">' +
          '<div class="kv gross"><span class="k">Vergessen</span>' +
          '<span class="v' + (st.faellig ? ' schlecht' : '') + '">' + st.gesamt + '×</span></div>' +
          namen.map(function (n) {
            var z = bilanz[n];
            return '<div class="kv"><span class="k small muted">' + A.esc(n) + '</span><span class="v small">' +
              z.f + '× fehlt' + (z.e ? ' · ' + z.e + '× entschuldigt' : '') + '</span></div>';
          }).join('') +
          (st.grenze
            ? '<div class="straf-leiste' + (st.faellig ? ' voll' : '') + '">' +
              (st.faellig
                ? '⚠️ <b>' + (st.faellig > 1 ? st.faellig + ' Strafarbeiten' : 'Strafarbeit') +
                  ' fällig</b> · nächster Hinweis nach ' + st.bisZurNaechsten + ' weiteren'
                : 'Noch <b>' + st.bisZurNaechsten + '</b> bis zur Strafarbeit (ab ' + st.grenze + ')') +
              '</div>'
            : '') +
          '</div>';
      }

      h += card(kurs.fach || 'ohne Fach', inner);
    });

    if (s.notiz) h += card('Notiz', '<div class="card-body">' + A.esc(s.notiz).replace(/\n/g, '<br>') + '</div>');
    return h;
  }
};

VIEWS.noten = {
  title: function () { return 'Noten'; },
  actions: function () { return '<button class="icon-btn" data-act="leistung-neu">＋</button>'; },
  body: function () {
    var kurse = A.alleKurse();
    if (!kurse.length) {
      return card('', empty('📊', 'Noch kein Fach angelegt.')) +
        '<button class="btn primary block" data-act="neue-klasse">Klasse anlegen</button>';
    }

    var h = '';
    var leer = true;
    kurse.forEach(function (kurs) {
      var leistungen = A.list('Leistungen', function (l) { return l.kursId === kurs.id; })
        .sort(function (a, b) { return String(b.datum).localeCompare(String(a.datum)); });
      if (!leistungen.length) return;
      leer = false;
      var sus = A.susDesKurses(kurs.id);
      var rows = leistungen.map(function (l) {
        var noten = sus.map(function (s) { return A.noteFuer(l, s.id, kurs); }).filter(function (n) { return n !== null; });
        var schnitt = noten.length ? noten.reduce(function (a, b) { return a + b; }, 0) / noten.length : null;
        var offen = sus.length - noten.length;
        return '<button class="row" data-act="open-leistung" data-leistung="' + l.id + '">' +
          '<div class="pill" style="background:' + A.kursFarbe(kurs) + ';height:26px"></div>' +
          '<div class="row-main"><div class="row-title">' + A.esc(l.titel || l.kategorie) + '</div>' +
          '<div class="row-sub">' + A.esc(l.kategorie) + (l.datum ? ' · ' + A.fmtDateShort(l.datum) : '') +
          (offen > 0 ? ' · <span class="badge warn">' + offen + ' offen</span>' : '') + '</div></div>' +
          '<div class="row-val">' + A.fmtNote(schnitt) + '</div><div class="chev">›</div></button>';
      }).join('');
      h += card(A.kursLabel(kurs), rows);
    });

    if (leer) h += card('', empty('📊', 'Noch keine Leistungen erfasst.'));
    h += '<button class="btn primary block" data-act="leistung-neu">Neue Leistung</button>';
    return h;
  }
};

VIEWS.leistung = {
  title: function (p) { var l = A.byId('Leistungen', p.id); return l ? (l.titel || l.kategorie) : 'Leistung'; },
  actions: function (p) { return '<button class="icon-btn" data-act="leistung-bearbeiten" data-leistung="' + p.id + '">···</button>'; },
  body: function (p) {
    var l = A.byId('Leistungen', p.id);
    if (!l) return card('', empty('❓', 'Nicht gefunden.'));
    var kurs = A.byId('Kurse', l.kursId);
    if (!kurs) return card('', empty('❓', 'Kurs nicht gefunden.'));

    var sus = A.susDesKurses(kurs.id);
    var max = A.num(l.maxPunkte, 0);
    var mitPunkten = !!max;
    var sch = A.schluesselVon(kurs, l);

    var h = '<div class="hint-box"><b>' + A.esc(A.kursLabel(kurs)) + '</b> · ' + A.esc(l.kategorie) +
      (l.datum ? ' · ' + A.fmtDate(l.datum) : '') + ' · Gewicht ×' + A.esc(l.gewicht || 1) + '<br>' +
      (mitPunkten
        ? 'Maximal ' + A.esc(l.maxPunkte) + ' Punkte · ' +
          (sch === 'linear'
            ? 'stufenlos: volle Punktzahl 1,0, halbe Punktzahl 3,5'
            : 'Stufentabelle')
        : 'Noten direkt eintragen (1,0 bis 6,0)') + '</div>';

    if (!sus.length) return h + card('', empty('👥', 'In dieser Klasse sind keine Schüler:innen angelegt.'));

    /* Vorschlag aus den Smileys – nur bei einer mündlichen Leistung ohne Punkte. */
    var zeigtVorschlag = A.vorschlagPasst(l);
    var zaehltSchon = zeigtVorschlag && A.cfg('mitarbeitAktiv') && A.cfg('mitarbeitKategorie') === l.kategorie;
    if (zaehltSchon) {
      h += '<div class="warn-box">Die Smileys fließen in der Art „' + A.esc(l.kategorie) +
        '“ bereits <b>automatisch</b> in die Gesamtnote ein. Wer sie hier zusätzlich als Note ' +
        'einträgt, zählt sie doppelt. Unter <i>Mehr → Mitarbeit in der Note</i> lässt sich das ' +
        'automatische Mitzählen abschalten.</div>';
    }

    var rows = sus.map(function (s, i) {
      var rec = A.list('Noten', function (x) { return x.leistungId === l.id && x.susId === s.id; })[0] || {};
      var n = A.noteFuer(l, s.id, kurs);
      var wert = mitPunkten
        ? (rec.punkte === undefined ? '' : rec.punkte)
        : (rec.note === undefined ? '' : rec.note);

      var chip = '';
      if (zeigtVorschlag) {
        var vs = A.mitarbeitVorschlag(kurs.id, s.id);
        chip = vs
          ? '<button class="vorschlag" data-act="vorschlag" data-sus="' + s.id + '" ' +
            'data-note="' + vs.note + '" title="Aus ' + vs.anzahl + ' Smileys – tippen zum Übernehmen">' +
            '<span class="vs-k">Vorschlag</span><span class="vs-n">' + A.fmtNote(vs.note, 1) + '</span></button>'
          : '<span class="vorschlag leer"><span class="vs-k">Vorschlag</span><span class="vs-n">–</span></span>';
      }

      return '<div class="mit-row">' +
        '<div class="mit-name"><div class="nn">' + A.esc(A.susName(s)) + '</div></div>' +
        '<div class="eingabe">' + chip +
          '<input class="pkt" data-note-input data-sus="' + s.id + '" data-idx="' + i + '" type="text" ' +
          'inputmode="decimal" value="' + A.esc(wert) + '" placeholder="' + (mitPunkten ? 'P.' : 'Note') + '">' +
          '<div class="nums ' + noteKlasse(n) + '">' + A.fmtNote(n, 1) + '</div>' +
        '</div></div>';
    }).join('');

    h += card(mitPunkten ? 'Punkte eintragen' : 'Noten eintragen', rows);

    if (zeigtVorschlag) {
      h += '<div class="btn-row"><button class="btn small" data-act="vorschlaege-alle">Vorschläge in leere Felder</button>' +
        '<button class="btn small" data-act="vorschlaege-alle" data-ueber="1">Auch belegte überschreiben</button></div>';
    }

    var noten = sus.map(function (s) { return A.noteFuer(l, s.id, kurs); });
    var sp = A.notenspiegel(noten);
    h += card('Notenspiegel', '<div class="card-body">' + spiegelHTML(sp) +
      '<div class="stat-row">' +
        '<div class="stat"><div class="v">' + A.fmtNote(sp.schnitt) + '</div><div class="k">Schnitt</div></div>' +
        '<div class="stat"><div class="v">' + sp.anzahl + '/' + sus.length + '</div><div class="k">Eingetragen</div></div>' +
        '<div class="stat"><div class="v">' + (sp.anzahl ? Math.round(sp.bestanden / sp.anzahl * 100) + '%' : '–') + '</div><div class="k">4 od. besser</div></div>' +
      '</div></div>');

    if (mitPunkten) {
      var zeilen;
      if (sch === 'linear') {
        zeilen = [1, 1.5, 2, 2.5, 3, 3.5, 4, 4.5, 5, 5.5].map(function (note) {
          var pk = A.punkteFuerNote(note, max, 'linear');
          return '<div class="kv"><span class="k">Note ' + A.fmtNote(note, 1) + '</span>' +
            '<span class="v">ab ' + A.fmtNote(pk, 1) + ' P.</span></div>';
        }).join('');
      } else {
        zeilen = sch.slice().sort(function (a, b) { return A.num(b.prozent, 0) - A.num(a.prozent, 0); })
          .map(function (x) {
            var pk = A.punkteFuerNote(x.note, max, sch);
            return '<div class="kv"><span class="k">Note ' + A.fmtNote(A.num(x.note, 0), 1) + '</span>' +
              '<span class="v">ab ' + A.fmtNote(A.num(x.prozent, 0), 1) + ' % · ' + A.fmtNote(pk, 1) + ' P.</span></div>';
          }).join('');
      }
      h += card('Umrechnung', '<div class="card-body">' + zeilen +
        '<div class="btn-row" style="margin-bottom:0"><button class="btn small" data-act="schluessel-bearbeiten" ' +
        'data-kurs="' + kurs.id + '" data-leistung="' + l.id + '">Für diese Arbeit ändern</button></div></div>');
    }

    return h;
  }
};

function currentView() {
  var top = route.stack[route.stack.length - 1];
  return top ? { def: VIEWS[top.view], p: top.p } : { def: VIEWS[route.tab], p: {} };
}

function render() {
  applyFarbdesign();
  var cur = currentView();
  if (!cur.def) { route.stack = []; cur = currentView(); }
  main.innerHTML = cur.def.body(cur.p);
  topTitle.textContent = cur.def.title(cur.p);
  topActions.innerHTML = cur.def.actions ? cur.def.actions(cur.p) : '';
  btnBack.hidden = route.stack.length === 0;
  document.querySelectorAll('.tab').forEach(function (t) {
    t.classList.toggle('active', t.getAttribute('data-tab') === route.tab && route.stack.length === 0);
  });
}
window.render = render;

ACT['zufall-sus'] = function () {
  var p = currentView().p;
  var sus = A.susDesKurses(p.kursId);
  if (!sus.length) { window.toast('Keine Schüler:innen in diesem Kurs.', true); return; }

  var zuletzt = '';
  function ziehe() {
    var pool = sus.length > 1 ? sus.filter(function (s) { return s.id !== zuletzt; }) : sus;
    var s = pool[Math.floor(Math.random() * pool.length)];
    zuletzt = s.id;
    return s;
  }

  var erster = ziehe();
  Modal.open({
    title: 'Zufällige Auswahl',
    body: '<div class="tool-result"><div class="tool-result-name" id="zufName">' + A.esc(A.susName(erster)) + '</div>' +
      '<div class="hint-box">Bei „Nochmal“ wird nach Möglichkeit nicht direkt dieselbe Person gezogen.</div></div>',
    foot: '<button class="btn primary" id="zufNochmal">🎲 Nochmal</button>',
    after: function (bg) {
      bg.querySelector('#zufNochmal').addEventListener('click', function () {
        var s = ziehe();
        bg.querySelector('#zufName').textContent = A.susName(s);
        if (navigator.vibrate) navigator.vibrate(12);
      });
    }
  });
};

function gruppenDialog(puzzle) {
  var p = currentView().p;
  var sus = A.susDesKurses(p.kursId);
  if (sus.length < 2) { window.toast('Für Gruppen braucht es mindestens zwei Schüler:innen.', true); return; }

  var body = puzzle
    ? '<div class="hint-box">Die Stammgruppen werden zufällig gebildet. Die Position innerhalb der Stammgruppe bestimmt anschließend die Expertengruppe.</div>' +
      '<div class="field"><label>Personen pro Stammgruppe</label><input id="gruppenZahl" type="number" min="2" max="8" value="4" inputmode="numeric"></div>'
    : '<div class="field"><label>Aufteilen nach</label><select id="gruppenModus">' +
        '<option value="anzahl">Anzahl Gruppen</option><option value="personen">Personen pro Gruppe</option></select></div>' +
      '<div class="field"><label id="gruppenLabel">Anzahl Gruppen</label><input id="gruppenZahl" type="number" min="1" max="' + sus.length + '" value="3" inputmode="numeric"></div>';

  body += '<div id="gruppenErgebnis"></div>';

  Modal.open({
    title: puzzle ? 'Gruppenpuzzle' : 'Gruppen bilden',
    body: body,
    foot: '<button class="btn primary" id="gruppenNeu">🎲 Neu mischen</button>',
    after: function (bg) {
      var zahl = bg.querySelector('#gruppenZahl');
      var modus = bg.querySelector('#gruppenModus');
      var ergebnis = bg.querySelector('#gruppenErgebnis');

      function zeichne() {
        if (puzzle) {
          var proGruppe = Math.max(2, Math.min(8, Math.round(A.num(zahl.value, 4) || 4)));
          var leute = mischen(sus);
          var stamm = [];
          for (var i = 0; i < leute.length; i += proGruppe) stamm.push(leute.slice(i, i + proGruppe));
          var experten = [];
          for (var e = 0; e < proGruppe; e++) experten.push([]);
          stamm.forEach(function (g) {
            g.forEach(function (s, pos) { experten[pos].push(s); });
          });
          experten = experten.filter(function (g) { return g.length; });
          ergebnis.innerHTML = '<div class="tool-result"><b>1. Stammgruppen</b>' + gruppenHTML(stamm, 'Stammgruppe') +
            '<div style="margin-top:16px"><b>2. Expertengruppen</b></div>' + gruppenHTML(experten, 'Expertengruppe') + '</div>';
        } else {
          var m = modus.value;
          var g = gruppenNormal(sus, m, zahl.value);
          ergebnis.innerHTML = '<div class="tool-result">' + gruppenHTML(g, 'Gruppe') + '</div>';
        }
      }

      if (modus) {
        modus.addEventListener('change', function () {
          bg.querySelector('#gruppenLabel').textContent = modus.value === 'personen' ? 'Personen pro Gruppe' : 'Anzahl Gruppen';
          zeichne();
        });
      }
      zahl.addEventListener('change', zeichne);
      bg.querySelector('#gruppenNeu').addEventListener('click', function () {
        zeichne();
        if (navigator.vibrate) navigator.vibrate(12);
      });
      zeichne();
    }
  });
}

ACT['check'] = function (el) {
  var p = currentView().p;
  var susId = el.getAttribute('data-sus');
  var punkt = el.getAttribute('data-punkt');
  var modus = A.num(el.getAttribute('data-modus'), 2);

  var index = A.checksDerStunde(p.datum, p.stunde);
  var neu = A.naechsterCheck(A.checkWert(index, susId, punkt), modus);
  A.setCheck(p.datum, p.stunde, p.kursId, susId, punkt, neu);

  var z = A.CHECK_ZUSTAENDE[neu];
  el.className = 'chk ' + neu;
  var zeichen = el.querySelector('.chk-z');
  if (zeichen) zeichen.textContent = z.zeichen;

  var fuss = document.getElementById('chkFuss');
  if (fuss) fuss.innerHTML = checkFussText(p.datum, p.stunde, p.kursId, A.checkpunkteFuer(p.kursId, p.stunde, p.datum));

  /* Zähler an der Kachel mitführen */
  var badge = main.querySelector('[data-verg="' + susId + '"]');
  if (badge) badge.outerHTML = vergessenBadge(p.kursId, susId);

  if (navigator.vibrate) navigator.vibrate(8);

  /* Ist damit die Grenze voll? */
  if (neu === 'f') {
    var straf = A.strafFaellig(p.kursId, susId);
    if (straf) {
      A.strafGemeldet(p.kursId, susId, straf.gesamt);
      zeigeStrafHinweis(A.byId('SuS', susId), A.byId('Kurse', p.kursId), straf);
    }
  }
};

/** Hinweisfenster, wenn die Grenze erreicht ist. */
function zeigeStrafHinweis(sus, kurs, st) {
  if (!sus || !kurs) return;
  var kurz = st.teile.map(function (t) { return t.anzahl + '× ' + t.name; }).join(', ');
  var notizText = A.fmtDate(A.todayISO()) + ': ' + st.gesamt + '× vergessen (' + kurz + ') → Strafarbeit';

  Modal.open({
    title: 'Strafarbeit fällig',
    body:
      '<div class="straf-box"><div class="straf-zahl">' + st.gesamt + '×</div>' +
        '<div class="straf-text"><b>' + A.esc(A.susName(sus)) + '</b> hat in ' +
        A.esc(A.kursLabel(kurs)) + ' zum <b>' + st.gesamt + '. Mal</b> etwas vergessen.</div></div>' +
      '<div class="card-body">' + st.teile.map(function (t) {
        return '<div class="kv"><span class="k">' + A.esc(t.name) + '</span><span class="v">' + t.anzahl + '×</span></div>';
      }).join('') + '</div>' +
      '<div class="hint-box">Eingestellt ist eine Strafarbeit ab ' + st.grenze +
      ' Vergessen. Der nächste Hinweis kommt beim ' + (st.gesamt + st.grenze) + '. Mal.' +
      (st.entschuldigt ? ' Entschuldigtes Fehlen (' + st.entschuldigt + '×) zählt nicht mit.' : '') + '</div>',
    foot: '<button class="btn" id="strafNotiz">In die Notiz schreiben</button>' +
          '<button class="btn primary" data-close>Verstanden</button>',
    after: function (bg, close) {
      bg.querySelector('#strafNotiz').addEventListener('click', function () {
        sus.notiz = (sus.notiz ? String(sus.notiz) + '\n' : '') + notizText;
        A.put('SuS', sus);
        close();
        window.toast('In die Notiz von ' + A.susKurz(sus) + ' eingetragen');
      });
    }
  });
}

ACT['check-reset'] = function () {

  A.susDesKurses(p.kursId).forEach(function (s) {

ACT['check-punkte'] = function (el) {
  var tag = A.num(el.getAttribute('data-tag'), 0);
  var stunde = A.num(el.getAttribute('data-stunde'), 0);
  var kursId = el.getAttribute('data-kurs') || '';

  var slot = (tag && stunde) ? A.planZelle(tag, stunde) : null;
  if (slot && kursId && slot.kursId !== kursId) slot = null;

  var kurs = kursId ? A.byId('Kurse', kursId) : null;

  var aktuell = (slot && slot.checkpunkte)
    ? (A.parseJSON(slot.checkpunkte, null) || [])
    : (kursId ? (A.checkpunkteFuer(kursId, stunde, '') || []) : (A.cfg('checkpunkte') || []));

  /* Ohne eigene Liste erkennt die App das Fach – bei Sport also Sportsachen. */
  var eigen = !!((slot && slot.checkpunkte) || (kurs && kurs.checkpunkte));
  var erkannt = (!eigen && kurs) ? A.vorlageFuerFach(kurs.fach) : null;

  var wo;
  if (slot && kurs) {
    wo = 'Gilt für ' + A.esc(A.kursLabel(kurs)) + ' am ' + A.tagName(tag, true) + ', ' + stunde + '. Stunde.';
  } else if (kurs) {
    wo = 'Diese Stunde steht nicht im Wochenplan – gespeichert wird die Liste für <b>' +
      A.esc(A.kursLabel(kurs)) + '</b>.';
  } else {
    wo = 'Kein Kurs hinterlegt – gespeichert wird die <b>Vorgabe für alle Stunden</b>.';
  }

  var body = '<div class="hint-box">' + wo + ' Zwei Stufen heißt <b>dabei / fehlt</b>, ' +
    'drei Stufen zusätzlich <b>entschuldigt</b>.</div>' +
    (erkannt ? '<div class="hint-box">Für <b>' + A.esc(kurs.fach) + '</b> schlägt die App automatisch ' +
      'die Sportliste vor. Speichern macht sie fest, sonst bleibt sie automatisch.</div>' : '') +
    '<div class="field"><label>Fertige Listen</label><div class="chiplist" id="chkVorlagen">' +
    A.CHECK_VORLAGEN.map(function (v, i) {
      return '<button class="chip" data-vorlage="' + i + '">' + A.esc(v.titel) + '</button>';
    }).join('') + '</div></div>' +
    '<div id="chkListe">' + aktuell.map(chkPunktZeileHTML).join('') + '</div>' +
    '<div class="btn-row"><button class="btn" id="chkAdd">Punkt hinzufügen</button></div>' +
    ((slot && kurs) ? '<div class="field check" style="margin-top:4px">' +
      '<input type="checkbox" id="chkAlle"><label for="chkAlle">Für alle Stunden von ' +
      A.esc(A.kursLabel(kurs)) + '</label></div>' : '');

  Modal.open({
    title: 'Abhakliste',
    body: body,
    foot: '<button class="btn primary" id="chkSave">Speichern</button>',
    after: function (bg, close) {
      var listEl = bg.querySelector('#chkListe');

      bg.querySelector('#chkVorlagen').addEventListener('click', function (e) {
        var b = e.target.closest('[data-vorlage]');
        if (!b) return;
        var v = A.CHECK_VORLAGEN[A.num(b.getAttribute('data-vorlage'), 0)];
        listEl.innerHTML = v.punkte.map(chkPunktZeileHTML).join('');
        bg.querySelectorAll('#chkVorlagen .chip').forEach(function (c) { c.classList.remove('on'); });
        b.classList.add('on');
      });

      listEl.addEventListener('click', function (e) {
        var b = e.target.closest('[data-chkp-del]');
        if (b) b.closest('.chkp-zeile').remove();
      });

      bg.querySelector('#chkAdd').addEventListener('click', function () {
        listEl.insertAdjacentHTML('beforeend', chkPunktZeileHTML({ name: '', kurz: '', modus: 2 }));
      });

      bg.querySelector('#chkSave').addEventListener('click', function () {
        var out = [];
        listEl.querySelectorAll('.chkp-zeile').forEach(function (z) {
          var name = z.querySelector('.chkp-name').value.trim();
          if (!name) return;
          var kurz = z.querySelector('.chkp-kurz').value.trim() || name.slice(0, 4);
          out.push({ name: name, kurz: kurz, modus: A.num(z.querySelector('.chkp-modus').value, 2) });
        });

        var text = JSON.stringify(out);
        var alleEl = bg.querySelector('#chkAlle');
        var fuersFach = !!(alleEl && alleEl.checked);

        if (kurs && (!slot || fuersFach)) {
          /* Am Kurs hinterlegen – und Ausnahmen einzelner Stunden aufheben,
             sonst würden die weiterhin gewinnen. */
          kurs.checkpunkte = text;
          A.put('Kurse', kurs);
          A.list('Stundenplan', function (x) { return x.kursId === kurs.id && x.checkpunkte; })
            .forEach(function (x) { x.checkpunkte = ''; A.put('Stundenplan', x); });
          window.toast('Für ' + A.kursLabel(kurs) + ' übernommen');
        } else if (slot) {
          slot.checkpunkte = text;
          A.put('Stundenplan', slot);
        } else {
          A.setCfg('checkpunkte', out);
        }
        close();
        render();
      });
    }
  });
};

function chkPunktZeileHTML(pt) {
  var m = A.num(pt.modus, 2);
  return '<div class="chkp-zeile" style="display:flex;gap:6px;align-items:center;margin-bottom:8px">' +
    '<input class="chkp-name" value="' + A.esc(pt.name || '') + '" placeholder="Bezeichnung" ' +
    'style="flex:2;min-width:0;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<input class="chkp-kurz" value="' + A.esc(pt.kurz || '') + '" placeholder="Kürzel" ' +

    '<select class="chkp-modus" style="width:74px;min-height:40px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<option value="2"' + (m === 2 ? ' selected' : '') + '>2 St.</option>' +
    '<option value="3"' + (m === 3 ? ' selected' : '') + '>3 St.</option></select>' +
    '<button class="icon-btn" data-chkp-del style="color:var(--bad);min-width:32px;padding:0 4px">✕</button></div>';

/* --- Stundenplan ------------------------------------------------------ */

function planSetzeKurs(tag, stunde, kursId) {
  var kurs = A.byId('Kurse', kursId);
  if (!kurs) return null;
  var rec = A.planZelle(tag, stunde) || { id: A.uid('pl'), tag: String(tag), stunde: String(stunde) };
  rec.tag = String(tag);
  rec.stunde = String(stunde);
  rec.kursId = kurs.id;
  rec.klasseId = kurs.klasseId || '';
  rec.fach = kurs.fach || '';
  rec.deleted = '';
  return A.put('Stundenplan', rec);
}

function planVerschiebe(payload, tag, stunde) {
  tag = A.num(tag, 1);
  stunde = A.num(stunde, 1);
  if (!payload || !payload.kursId) return false;

  var quelle = payload.planId ? A.byId('Stundenplan', payload.planId) : null;
  var ziel = A.planZelle(tag, stunde);

  if (!quelle) {
    planSetzeKurs(tag, stunde, payload.kursId);
    return true;
  }

  var qTag = A.num(quelle.tag, 1);
  var qStunde = A.num(quelle.stunde, 1);
  if (qTag === tag && qStunde === stunde) return false;

  if (ziel && ziel.id !== quelle.id) {
    /* Belegte Felder werden beim Verschieben getauscht statt überschrieben. */
    ziel.tag = String(qTag);
    ziel.stunde = String(qStunde);
    A.put('Stundenplan', ziel);
  }

  quelle.tag = String(tag);
  quelle.stunde = String(stunde);
  A.put('Stundenplan', quelle);
  return true;
}

  var tag = A.num(el.getAttribute('data-tag'), 1);

  Modal.form({

      { key: 'kursId', label: 'Kurs', type: 'select',
        options: [{ value: '', label: '– frei –' }].concat(kurse.map(function (k) { return { value: k.id, label: A.kursLabel(k) }; })),
        value: vorhanden ? vorhanden.kursId : '' },
      { key: 'raum', label: 'Raum', value: vorhanden ? vorhanden.raum : '' },
      { key: 'vorlage', label: 'Abhakliste', type: 'select',
        options: [{ value: '', label: (vorhanden && vorhanden.checkpunkte) ? 'unverändert lassen' : 'Vorgabe aus den Einstellungen' }]
          .concat(A.CHECK_VORLAGEN.map(function (v, i) { return { value: String(i), label: v.titel }; })),
        hint: (vorhanden && vorhanden.checkpunkte)
          ? 'Eingestellt: ' + A.esc((A.parseJSON(vorhanden.checkpunkte, []) || []).map(function (x) { return x.name; }).join(', ') || 'keine')
          : 'Feinere Einstellungen gibt es in der Stunde selbst unter „Punkte anpassen“.' }
    ],

      var kurs = A.byId('Kurse', v.kursId);

      rec.kursId = v.kursId;

function sitzTischDialog(klasseId, index, neu) {
  var plan = sitzPlanFlex(klasseId);
  while (plan.items.length <= index) plan.items.push({ type: 'gap' });
  var vorhanden = plan.items[index] && plan.items[index].type === 'table' ? plan.items[index] : null;
  var startGroesse = vorhanden ? vorhanden.size : 2;

  Modal.form({
    title: neu ? 'Tisch hinzufügen' : 'Tisch / Reihe',
    hinweis: 'Hier legst du fest, wie viele Schüler:innen nebeneinander an diesem Tisch bzw. in dieser Reihe sitzen können.',
    fields: [{ key: 'groesse', label: 'Anzahl der Sitzplätze', type: 'number', value: String(startGroesse), min: 1,
      inputmode: 'numeric', hint: 'Zum Beispiel 2 für einen Doppeltisch, 3 für eine 3er-Reihe oder 4 für eine 4er-Reihe.' }],
    validate: function (v) {
      var n = Math.round(A.num(v.groesse, 0));
      if (n < 1 || n > 12) return 'Bitte eine Zahl zwischen 1 und 12 eingeben.';
      if (vorhanden && n < vorhanden.size) {
        for (var i = n; i < vorhanden.seats.length; i++) {
          if (vorhanden.seats[i]) return 'Auf einem Platz, der wegfallen würde, sitzt noch jemand. Bitte die Person zuerst verschieben.';
        }
      }
      return null;
    },
    onSave: function (v) {
      var n = Math.max(1, Math.min(12, Math.round(A.num(v.groesse, 2) || 2)));
      var planNeu = sitzPlanFlex(klasseId);
      while (planNeu.items.length <= index) planNeu.items.push({ type: 'gap' });
      var item = planNeu.items[index];
      if (!item || item.type !== 'table') item = { type: 'table', size: n, seats: [] };
      item.size = n;
      item.seats = Array.isArray(item.seats) ? item.seats.slice(0, n) : [];
      while (item.seats.length < n) item.seats.push('');
      planNeu.items[index] = item;
      setSitzPlanFlex(klasseId, planNeu);
      ui.sitzAuswahl = null;
    },
    onDelete: (!neu && vorhanden) ? function () {
      var planNeu = sitzPlanFlex(klasseId);
      var item = planNeu.items[index];
      if (item && item.type === 'table' && item.seats.some(Boolean)) {
        window.toast('Belegten Tisch zuerst leeren oder die Schüler:innen verschieben.', true);
        return;
      }
      planNeu.items[index] = { type: 'gap' };
      setSitzPlanFlex(klasseId, planNeu);
      ui.sitzAuswahl = null;
    } : null,
    deleteHint: 'Diesen leeren Tisch aus dem Sitzplan entfernen?',
    focus: false
  });
}

  if (ui.sitzAuswahl === null || ui.sitzAuswahl === undefined) {
    ui.sitzAuswahl = key;
    render();
    return;

  if (ui.sitzAuswahl === key) {

  var a = sitzKeyLesen(ui.sitzAuswahl);
  if (!a || !plan.items[a.tisch] || plan.items[a.tisch].type !== 'table') {

  plan.items[tisch].seats[platz] = tmp;

  render();
};

  ids = mischen(ids);
  var pos = 0;
  plan.items.forEach(function (it) {

    it.seats = it.seats.map(function () { return ids[pos++] || ''; });

  setSitzPlanFlex(klasseId, plan);

ACT['sus-liste'] = function (el) {
  var kid = el.getAttribute('data-klasse') || currentView().p.id;
  Modal.form({
    title: 'Namensliste einfügen',
    fields: [{
      key: 'liste', label: 'Ein Name pro Zeile', type: 'textarea', rows: 10,
      placeholder: 'Müller, Anna\nSchmidt, Ben\n…',
      hint: 'Erlaubt sind „Nachname, Vorname“ oder „Vorname Nachname“. Vorhandene Namen werden nicht doppelt angelegt.'
    }],
    saveLabel: 'Hinzufügen',
    onSave: function (v) {
      var vorhanden = A.susDerKlasse(kid).map(function (s) { return A.susName(s, 'nachname').toLowerCase(); });
      var neu = 0;
      v.liste.split('\n').forEach(function (zeile) {
        var t = zeile.trim();
        if (!t) return;
        var nachname, vorname;
        if (t.indexOf(',') > -1) {
          var teile = t.split(',');
          nachname = teile[0].trim(); vorname = (teile[1] || '').trim();
        } else {
          var w = t.split(/\s+/);
          vorname = w.length > 1 ? w.slice(0, -1).join(' ') : '';
          nachname = w[w.length - 1];
        }
        var key = (nachname + (vorname ? ', ' + vorname : '')).toLowerCase();
        if (vorhanden.indexOf(key) > -1) return;
        A.put('SuS', { id: A.uid('su'), klasseId: kid, nachname: nachname, vorname: vorname, aktiv: '1' });
        neu++;
      });
      window.toast(neu + ' Schüler:in(nen) hinzugefügt');
    }
  });
};

ACT['kats-bearbeiten'] = function (el) {
  var kursId = el.getAttribute('data-kurs');
  var kurs = kursId ? A.byId('Kurse', kursId) : null;
  var kats = kurs ? A.kategorienVon(kurs) : A.cfg('kategorien');

  var body = '<div class="hint-box">' + (kurs
    ? 'Gilt für <b>' + A.esc(A.kursLabel(kurs)) + '</b>. Die Gesamtnote ist das gewichtete Mittel der Arten.'
    : 'Allgemeine Vorgabe. Fachspezifische Vorgaben stehen unter „Fächer &amp; Gewichtung“.') + '</div>' +
    '<div id="katList">' + kats.map(katZeileHTML).join('') + '</div>' +
    '<div class="btn-row"><button class="btn" id="katAdd">Art hinzufügen</button></div>';

  Modal.open({
    title: 'Gewichtung',
    body: body,
    foot: (kurs ? '<button class="btn" id="katReset">Vorgabe</button>' : '') + '<button class="btn primary" id="katSave">Speichern</button>',
    after: function (bg, close) {
      var listEl = bg.querySelector('#katList');
      listEl.addEventListener('click', function (e) {
        var b = e.target.closest('[data-kat-del]');
        if (b) b.closest('.kat-zeile').remove();
      });
      bg.querySelector('#katAdd').addEventListener('click', function () {
        listEl.insertAdjacentHTML('beforeend', katZeileHTML({ name: '', gewicht: 1 }));
      });
      var r = bg.querySelector('#katReset');
      if (r) r.addEventListener('click', function () {
        kurs.kategorien = ''; A.put('Kurse', kurs); close(); render();
      });
      bg.querySelector('#katSave').addEventListener('click', function () {
        var out = [];
        listEl.querySelectorAll('.kat-zeile').forEach(function (z) {
          var name = z.querySelector('.kat-name').value.trim();
          var g = A.num(z.querySelector('.kat-gew').value, 1);
          if (name) out.push({ name: name, gewicht: g === null ? 1 : g });
        });
        if (!out.length) { window.toast('Mindestens eine Art angeben.', true); return; }
        if (kurs) { kurs.kategorien = JSON.stringify(out); A.put('Kurse', kurs); }
        else A.setCfg('kategorien', out);
        close(); render();
      });
    }
  });
};

function katZeileHTML(c) {
  return '<div class="kat-zeile" style="display:flex;gap:8px;align-items:center;margin-bottom:8px">' +
    '<input class="kat-name" value="' + A.esc(c.name) + '" placeholder="Art" style="flex:1;min-width:0;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<input class="kat-gew" value="' + A.esc(c.gewicht) + '" inputmode="decimal" style="width:64px;text-align:center;min-height:40px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<button class="icon-btn" data-kat-del style="color:var(--bad);min-width:36px">✕</button></div>';
}

ACT['schluessel-bearbeiten'] = function (el) {
  var kursId = el.getAttribute('data-kurs');
  var lid = el.getAttribute('data-leistung');
  var kurs = kursId ? A.byId('Kurse', kursId) : null;
  var l = lid ? A.byId('Leistungen', lid) : null;
  var sch = A.schluesselVon(kurs, l);
  var istLinear = (sch === 'linear');
  var tabelle = istLinear ? A.DEFAULT_SCHLUESSEL : sch;

  var wo = l ? 'Gilt nur für diese Arbeit.' : (kurs ? 'Gilt für <b>' + A.esc(A.kursLabel(kurs)) + '</b>.' : 'Allgemeine Vorgabe.');

  var body = '<div class="hint-box">' + wo + '</div>' +
    '<div class="field"><label>Verfahren</label>' +
      '<div class="chiplist" id="schModus">' +
      '<button class="chip' + (istLinear ? ' on' : '') + '" data-modus="linear">Stufenlos</button>' +
      '<button class="chip' + (istLinear ? '' : ' on') + '" data-modus="tabelle">Stufentabelle</button>' +
      '</div>' +
      '<div class="hint">Stufenlos: volle Punktzahl 1,0, keine Punkte 6,0 – die halbe Punktzahl ergibt genau 3,5. ' +
      'Zwischenwerte in Zehnteln.</div></div>' +
    '<div id="schBereich"' + (istLinear ? ' hidden' : '') + '>' +
      '<div class="field"><label>Schnell erzeugen: Note 4 ab … % · Note 1 ab … %</label>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input id="linP4" type="text" inputmode="decimal" value="50" style="flex:1;min-height:44px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">' +
        '<input id="linP1" type="text" inputmode="decimal" value="92" style="flex:1;min-height:44px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">' +
        '<button class="btn" id="linGo">Erzeugen</button></div></div>' +
      '<div id="schList">' + tabelle.slice().sort(function (a, b) { return A.num(b.prozent, 0) - A.num(a.prozent, 0); }).map(schZeileHTML).join('') + '</div>' +
    '</div>';

  Modal.open({
    title: 'Notenschlüssel',
    body: body,
    foot: ((kurs || l) ? '<button class="btn" id="schReset">Vorgabe</button>' : '') + '<button class="btn primary" id="schSave">Speichern</button>',
    after: function (bg, close) {
      var modus = istLinear ? 'linear' : 'tabelle';
      var listEl = bg.querySelector('#schList');
      var bereich = bg.querySelector('#schBereich');

      bg.querySelector('#schModus').addEventListener('click', function (e) {
        var b = e.target.closest('[data-modus]');
        if (!b) return;
        modus = b.getAttribute('data-modus');
        bg.querySelectorAll('#schModus .chip').forEach(function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        bereich.hidden = (modus === 'linear');
      });

      bg.querySelector('#linGo').addEventListener('click', function () {
        var p4 = A.num(bg.querySelector('#linP4').value, 50);
        var p1 = A.num(bg.querySelector('#linP1').value, 92);
        listEl.innerHTML = A.linearerSchluessel(p4, p1).sort(function (a, b) { return b.prozent - a.prozent; }).map(schZeileHTML).join('');
      });

      var r = bg.querySelector('#schReset');
      if (r) r.addEventListener('click', function () {
        if (l) { l.notenschluessel = ''; A.put('Leistungen', l); }
        else if (kurs) { kurs.notenschluessel = ''; A.put('Kurse', kurs); }
        close(); render();
      });

      bg.querySelector('#schSave').addEventListener('click', function () {
        var wert;
        if (modus === 'linear') {
          wert = 'linear';
        } else {
          var out = [];
          listEl.querySelectorAll('.sch-zeile').forEach(function (z) {
            var note = A.num(z.querySelector('.sch-note').value, null);
            var pr = A.num(z.querySelector('.sch-proz').value, null);
            if (note !== null && pr !== null) out.push({ note: note, prozent: pr });
          });
          if (!out.length) { window.toast('Keine gültigen Zeilen.', true); return; }
          out.sort(function (a, b) { return b.prozent - a.prozent; });
          wert = out;
        }
        var text = (wert === 'linear') ? 'linear' : JSON.stringify(wert);
        if (l) { l.notenschluessel = text; A.put('Leistungen', l); }
        else if (kurs) { kurs.notenschluessel = text; A.put('Kurse', kurs); }
        else A.setCfg('notenschluessel', wert);
        close(); render();
      });
    }
  });
};

function schZeileHTML(x) {
  return '<div class="sch-zeile" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">' +
    '<span class="small muted" style="width:40px">Note</span>' +
    '<input class="sch-note" value="' + A.esc(x.note) + '" inputmode="decimal" style="width:62px;text-align:center;min-height:38px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<span class="small muted" style="width:24px;text-align:right">ab</span>' +

function kopieren(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    ok ? resolve() : reject(new Error('nicht möglich'));
  });
}
