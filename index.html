ACT['check'] = function (el) {
  var p = currentView().p;
  var susId = el.getAttribute('data-sus');
  var punkt = el.getAttribute('data-punkt');
  var modus = A.num(el.getAttribute('data-modus'), 2);

  var index = A.checksDerStunde(p.datum, p.stunde);
  var neu = A.naechsterCheck(A.checkWert(index, susId, punkt), modus);
  A.setCheck(p.datum, p.stunde, p.kursId, susId, punkt, neu);

  var z = A.CHECK_ZUSTAENDE[neu];
  el.className = 'chk ' + neu;
  var zeichen = el.querySelector('.chk-z');
  if (zeichen) zeichen.textContent = z.zeichen;

  var fuss = document.getElementById('chkFuss');
  if (fuss) fuss.innerHTML = checkFussText(p.datum, p.stunde, p.kursId, A.checkpunkteFuer(p.kursId, p.stunde, p.datum));

  /* Zähler an der Kachel mitführen */
  var badge = main.querySelector('[data-verg="' + susId + '"]');
  if (badge) badge.outerHTML = vergessenBadge(p.kursId, susId);

  if (navigator.vibrate) navigator.vibrate(8);

  /* Ist damit die Grenze voll? */
  if (neu === 'f') {
    var straf = A.strafFaellig(p.kursId, susId);
    if (straf) {
      A.strafGemeldet(p.kursId, susId, straf.gesamt);
      zeigeStrafHinweis(A.byId('SuS', susId), A.byId('Kurse', p.kursId), straf);
    }
  }
};

/** Hinweisfenster, wenn die Grenze erreicht ist. */
function zeigeStrafHinweis(sus, kurs, st) {
  if (!sus || !kurs) return;
  var kurz = st.teile.map(function (t) { return t.anzahl + '× ' + t.name; }).join(', ');
  var notizText = A.fmtDate(A.todayISO()) + ': ' + st.gesamt + '× vergessen (' + kurz + ') → Strafarbeit';

  Modal.open({
    title: 'Strafarbeit fällig',
    body:
      '<div class="straf-box"><div class="straf-zahl">' + st.gesamt + '×</div>' +
        '<div class="straf-text"><b>' + A.esc(A.susName(sus)) + '</b> hat in ' +
        A.esc(A.kursLabel(kurs)) + ' zum <b>' + st.gesamt + '. Mal</b> etwas vergessen.</div></div>' +
      '<div class="card-body">' + st.teile.map(function (t) {
        return '<div class="kv"><span class="k">' + A.esc(t.name) + '</span><span class="v">' + t.anzahl + '×</span></div>';
      }).join('') + '</div>' +
      '<div class="hint-box">Eingestellt ist eine Strafarbeit ab ' + st.grenze +
      ' Vergessen. Der nächste Hinweis kommt beim ' + (st.gesamt + st.grenze) + '. Mal.' +
      (st.entschuldigt ? ' Entschuldigtes Fehlen (' + st.entschuldigt + '×) zählt nicht mit.' : '') + '</div>',
    foot: '<button class="btn" id="strafNotiz">In die Notiz schreiben</button>' +
          '<button class="btn primary" data-close>Verstanden</button>',
    after: function (bg, close) {
      bg.querySelector('#strafNotiz').addEventListener('click', function () {
        sus.notiz = (sus.notiz ? String(sus.notiz) + '\n' : '') + notizText;
        A.put('SuS', sus);
        close();
        window.toast('In die Notiz von ' + A.susKurz(sus) + ' eingetragen');
      });
    }
  });
}

ACT['check-punkte'] = function (el) {
  var tag = A.num(el.getAttribute('data-tag'), 0);
  var stunde = A.num(el.getAttribute('data-stunde'), 0);
  var kursId = el.getAttribute('data-kurs') || '';

  var slot = (tag && stunde) ? A.planZelle(tag, stunde) : null;
  if (slot && kursId && slot.kursId !== kursId) slot = null;

  var kurs = kursId ? A.byId('Kurse', kursId) : null;

  var aktuell = (slot && slot.checkpunkte)
    ? (A.parseJSON(slot.checkpunkte, null) || [])
    : (kursId ? (A.checkpunkteFuer(kursId, stunde, '') || []) : (A.cfg('checkpunkte') || []));

  /* Ohne eigene Liste erkennt die App das Fach – bei Sport also Sportsachen. */
  var eigen = !!((slot && slot.checkpunkte) || (kurs && kurs.checkpunkte));
  var erkannt = (!eigen && kurs) ? A.vorlageFuerFach(kurs.fach) : null;

  var wo;
  if (slot && kurs) {
    wo = 'Gilt für ' + A.esc(A.kursLabel(kurs)) + ' am ' + A.tagName(tag, true) + ', ' + stunde + '. Stunde.';
  } else if (kurs) {
    wo = 'Diese Stunde steht nicht im Wochenplan – gespeichert wird die Liste für <b>' +
      A.esc(A.kursLabel(kurs)) + '</b>.';
  } else {
    wo = 'Kein Kurs hinterlegt – gespeichert wird die <b>Vorgabe für alle Stunden</b>.';
  }

  var body = '<div class="hint-box">' + wo + ' Zwei Stufen heißt <b>dabei / fehlt</b>, ' +
    'drei Stufen zusätzlich <b>entschuldigt</b>.</div>' +
    (erkannt ? '<div class="hint-box">Für <b>' + A.esc(kurs.fach) + '</b> schlägt die App automatisch ' +
      'die Sportliste vor. Speichern macht sie fest, sonst bleibt sie automatisch.</div>' : '') +
    '<div class="field"><label>Fertige Listen</label><div class="chiplist" id="chkVorlagen">' +
    A.CHECK_VORLAGEN.map(function (v, i) {
      return '<button class="chip" data-vorlage="' + i + '">' + A.esc(v.titel) + '</button>';
    }).join('') + '</div></div>' +
    '<div id="chkListe">' + aktuell.map(chkPunktZeileHTML).join('') + '</div>' +
    '<div class="btn-row"><button class="btn" id="chkAdd">Punkt hinzufügen</button></div>' +
    ((slot && kurs) ? '<div class="field check" style="margin-top:4px">' +
      '<input type="checkbox" id="chkAlle"><label for="chkAlle">Für alle Stunden von ' +
      A.esc(A.kursLabel(kurs)) + '</label></div>' : '');

  Modal.open({
    title: 'Abhakliste',
    body: body,
    foot: '<button class="btn primary" id="chkSave">Speichern</button>',
    after: function (bg, close) {
      var listEl = bg.querySelector('#chkListe');

      bg.querySelector('#chkVorlagen').addEventListener('click', function (e) {
        var b = e.target.closest('[data-vorlage]');
        if (!b) return;
        var v = A.CHECK_VORLAGEN[A.num(b.getAttribute('data-vorlage'), 0)];
        listEl.innerHTML = v.punkte.map(chkPunktZeileHTML).join('');
        bg.querySelectorAll('#chkVorlagen .chip').forEach(function (c) { c.classList.remove('on'); });
        b.classList.add('on');
      });

      listEl.addEventListener('click', function (e) {
        var b = e.target.closest('[data-chkp-del]');
        if (b) b.closest('.chkp-zeile').remove();
      });

      bg.querySelector('#chkAdd').addEventListener('click', function () {
        listEl.insertAdjacentHTML('beforeend', chkPunktZeileHTML({ name: '', kurz: '', modus: 2 }));
      });

      bg.querySelector('#chkSave').addEventListener('click', function () {
        var out = [];
        listEl.querySelectorAll('.chkp-zeile').forEach(function (z) {
          var name = z.querySelector('.chkp-name').value.trim();
          if (!name) return;
          var kurz = z.querySelector('.chkp-kurz').value.trim() || name.slice(0, 4);
          out.push({ name: name, kurz: kurz, modus: A.num(z.querySelector('.chkp-modus').value, 2) });
        });

        var text = JSON.stringify(out);
        var alleEl = bg.querySelector('#chkAlle');
        var fuersFach = !!(alleEl && alleEl.checked);

        if (kurs && (!slot || fuersFach)) {
          /* Am Kurs hinterlegen – und Ausnahmen einzelner Stunden aufheben,
             sonst würden die weiterhin gewinnen. */
          kurs.checkpunkte = text;
          A.put('Kurse', kurs);
          A.list('Stundenplan', function (x) { return x.kursId === kurs.id && x.checkpunkte; })
            .forEach(function (x) { x.checkpunkte = ''; A.put('Stundenplan', x); });
          window.toast('Für ' + A.kursLabel(kurs) + ' übernommen');
        } else if (slot) {
          slot.checkpunkte = text;
          A.put('Stundenplan', slot);
        } else {
          A.setCfg('checkpunkte', out);
        }
        close();
        render();
      });
    }
  });
};

function chkPunktZeileHTML(pt) {
  var m = A.num(pt.modus, 2);
  return '<div class="chkp-zeile" style="display:flex;gap:6px;align-items:center;margin-bottom:8px">' +
    '<input class="chkp-name" value="' + A.esc(pt.name || '') + '" placeholder="Bezeichnung" ' +
    'style="flex:2;min-width:0;min-height:40px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<input class="chkp-kurz" value="' + A.esc(pt.kurz || '') + '" placeholder="Kürzel" ' +

    '<select class="chkp-modus" style="width:74px;min-height:40px;padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<option value="2"' + (m === 2 ? ' selected' : '') + '>2 St.</option>' +

    '<button class="icon-btn" data-chkp-del style="color:var(--bad);min-width:32px;padding:0 4px">✕</button></div>';
}

      { key: 'vorlage', label: 'Abhakliste', type: 'select',

ACT['klassen-merge'] = function (el) {
  var zielId = el.getAttribute('data-ziel');
  var quellen = (el.getAttribute('data-quellen') || '').split(',').filter(Boolean);
  var ziel = A.byId('Klassen', zielId);
  if (!ziel) return;
  if (!confirm('„' + ziel.name + '“ zu einer Klasse zusammenführen?\n\n' +
      'Fächer und Schüler:innen wandern zusammen. Namensgleiche Personen werden zu einem ' +
      'Eintrag verschmolzen, ihre Noten bleiben erhalten.')) return;

  var summe = { kurse: 0, verschoben: 0, verschmolzen: 0 };
  quellen.forEach(function (qid) {
    var b = A.klassenZusammenfuehren(zielId, qid);
    if (b) { summe.kurse += b.kurse; summe.verschoben += b.verschoben; summe.verschmolzen += b.verschmolzen; }
  });
  window.toast(summe.kurse + ' Fach/Fächer, ' + summe.verschoben + ' übernommen, ' + summe.verschmolzen + ' verschmolzen');
  render();
};

  var kid = el.getAttribute('data-klasse') || currentView().p.id;
  Modal.form({
    title: 'Namensliste einfügen',
    fields: [{
      key: 'liste', label: 'Ein Name pro Zeile', type: 'textarea', rows: 10,
      placeholder: 'Müller, Anna\nSchmidt, Ben\n…',
      hint: 'Erlaubt sind „Nachname, Vorname“ oder „Vorname Nachname“. Vorhandene Namen werden nicht doppelt angelegt.'
    }],

    onSave: function (v) {
      var vorhanden = A.susDerKlasse(kid).map(function (s) { return A.susName(s, 'nachname').toLowerCase(); });

      v.liste.split('\n').forEach(function (zeile) {
        var t = zeile.trim();
        if (!t) return;
        var nachname, vorname;
        if (t.indexOf(',') > -1) {
          var teile = t.split(',');
          nachname = teile[0].trim(); vorname = (teile[1] || '').trim();
        } else {
          var w = t.split(/\s+/);
          vorname = w.length > 1 ? w.slice(0, -1).join(' ') : '';
          nachname = w[w.length - 1];
        }
        var key = (nachname + (vorname ? ', ' + vorname : '')).toLowerCase();
        if (vorhanden.indexOf(key) > -1) return;
        A.put('SuS', { id: A.uid('su'), klasseId: kid, nachname: nachname, vorname: vorname, aktiv: '1' });
        neu++;
      });
      window.toast(neu + ' Schüler:in(nen) hinzugefügt');

ACT['schluessel-bearbeiten'] = function (el) {
  var kursId = el.getAttribute('data-kurs');
  var lid = el.getAttribute('data-leistung');
  var kurs = kursId ? A.byId('Kurse', kursId) : null;
  var l = lid ? A.byId('Leistungen', lid) : null;
  var sch = A.schluesselVon(kurs, l);
  var istLinear = (sch === 'linear');
  var tabelle = istLinear ? A.DEFAULT_SCHLUESSEL : sch;

  var wo = l ? 'Gilt nur für diese Arbeit.' : (kurs ? 'Gilt für <b>' + A.esc(A.kursLabel(kurs)) + '</b>.' : 'Allgemeine Vorgabe.');

  var body = '<div class="hint-box">' + wo + '</div>' +
    '<div class="field"><label>Verfahren</label>' +
      '<div class="chiplist" id="schModus">' +
      '<button class="chip' + (istLinear ? ' on' : '') + '" data-modus="linear">Stufenlos</button>' +
      '<button class="chip' + (istLinear ? '' : ' on') + '" data-modus="tabelle">Stufentabelle</button>' +
      '</div>' +
      '<div class="hint">Stufenlos: volle Punktzahl 1,0, keine Punkte 6,0 – die halbe Punktzahl ergibt genau 3,5. ' +
      'Zwischenwerte in Zehnteln.</div></div>' +
    '<div id="schBereich"' + (istLinear ? ' hidden' : '') + '>' +
      '<div class="field"><label>Schnell erzeugen: Note 4 ab … % · Note 1 ab … %</label>' +
      '<div style="display:flex;gap:8px;align-items:center">' +
        '<input id="linP4" type="text" inputmode="decimal" value="50" style="flex:1;min-height:44px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">' +
        '<input id="linP1" type="text" inputmode="decimal" value="92" style="flex:1;min-height:44px;text-align:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface)">' +
        '<button class="btn" id="linGo">Erzeugen</button></div></div>' +
      '<div id="schList">' + tabelle.slice().sort(function (a, b) { return A.num(b.prozent, 0) - A.num(a.prozent, 0); }).map(schZeileHTML).join('') + '</div>' +
    '</div>';

  Modal.open({
    title: 'Notenschlüssel',
    body: body,
    foot: ((kurs || l) ? '<button class="btn" id="schReset">Vorgabe</button>' : '') + '<button class="btn primary" id="schSave">Speichern</button>',
    after: function (bg, close) {
      var modus = istLinear ? 'linear' : 'tabelle';
      var listEl = bg.querySelector('#schList');
      var bereich = bg.querySelector('#schBereich');

      bg.querySelector('#schModus').addEventListener('click', function (e) {
        var b = e.target.closest('[data-modus]');
        if (!b) return;
        modus = b.getAttribute('data-modus');
        bg.querySelectorAll('#schModus .chip').forEach(function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        bereich.hidden = (modus === 'linear');
      });

      bg.querySelector('#linGo').addEventListener('click', function () {
        var p4 = A.num(bg.querySelector('#linP4').value, 50);
        var p1 = A.num(bg.querySelector('#linP1').value, 92);
        listEl.innerHTML = A.linearerSchluessel(p4, p1).sort(function (a, b) { return b.prozent - a.prozent; }).map(schZeileHTML).join('');
      });

      var r = bg.querySelector('#schReset');
      if (r) r.addEventListener('click', function () {
        if (l) { l.notenschluessel = ''; A.put('Leistungen', l); }
        else if (kurs) { kurs.notenschluessel = ''; A.put('Kurse', kurs); }
        close(); render();
      });

      bg.querySelector('#schSave').addEventListener('click', function () {
        var wert;
        if (modus === 'linear') {
          wert = 'linear';
        } else {
          var out = [];
          listEl.querySelectorAll('.sch-zeile').forEach(function (z) {
            var note = A.num(z.querySelector('.sch-note').value, null);
            var pr = A.num(z.querySelector('.sch-proz').value, null);
            if (note !== null && pr !== null) out.push({ note: note, prozent: pr });
          });
          if (!out.length) { window.toast('Keine gültigen Zeilen.', true); return; }
          out.sort(function (a, b) { return b.prozent - a.prozent; });
          wert = out;
        }
        var text = (wert === 'linear') ? 'linear' : JSON.stringify(wert);
        if (l) { l.notenschluessel = text; A.put('Leistungen', l); }
        else if (kurs) { kurs.notenschluessel = text; A.put('Kurse', kurs); }
        else A.setCfg('notenschluessel', wert);
        close(); render();
      });
    }
  });
};

function schZeileHTML(x) {
  return '<div class="sch-zeile" style="display:flex;gap:8px;align-items:center;margin-bottom:6px">' +
    '<span class="small muted" style="width:40px">Note</span>' +
    '<input class="sch-note" value="' + A.esc(x.note) + '" inputmode="decimal" style="width:62px;text-align:center;min-height:38px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<span class="small muted" style="width:24px;text-align:right">ab</span>' +
    '<input class="sch-proz" value="' + A.esc(x.prozent) + '" inputmode="decimal" style="flex:1;min-width:0;text-align:center;min-height:38px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--surface)">' +
    '<span class="small muted">%</span></div>';
}

    'Gemerkt wird eine Vorgabe am schnellsten über den Knopf „Als Vorgabe merken“ in einem fertig eingestellten Fach.</div>';

      '<div class="row-sub">' + (vg && vg.kategorien
        ? vg.kategorien.map(function (c) { return A.esc(c.name) + ' ×' + c.gewicht; }).join(' · ')
        : 'keine eigene Vorgabe') + '</div></div>' +
      (vg ? '<button class="btn small" data-fach-del="' + A.esc(f) + '">Entfernen</button>' : '') +
      '</div>';

  Modal.open({
    title: 'Fächer & Gewichtung',

ACT['export'] = function () {

ACT['import'] = function () {

  inp.addEventListener('change', function () {

    var r = new FileReader();
    r.onload = function () {
      try { A.importJSON(r.result, false); window.toast('Import abgeschlossen'); render(); }
      catch (e) { window.toast('Datei konnte nicht gelesen werden.', true); }

    r.readAsText(f);
  });

};

/* --- Verbindung und Einrichtung --------------------------------------- */

ACT['verbindung'] = function () { push('verbindung', {}); };
ACT['einrichten'] = function () { push('einrichten', {}); };

ACT['code-kopieren'] = function () {
  var status = document.getElementById('codeStatus');
  status.textContent = 'Wird geladen …';
  fetch('Code.gs?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.text(); })
    .then(function (text) { return kopieren(text); })
    .then(function () { status.innerHTML = '<span style="color:var(--good)">✓ In der Zwischenablage – jetzt im Apps-Script-Editor einfügen.</span>'; })
    .catch(function () { status.innerHTML = '<span style="color:var(--bad)">Kopieren hat nicht geklappt. „Code ansehen“ öffnen und von dort kopieren.</span>'; });
};

ACT['passwort-neu'] = function () {
  document.getElementById('genToken').value = A.neuesPasswort(28);
};

ACT['passwort-kopieren'] = function () {
  var feld = document.getElementById('genToken');
  kopieren(feld.value).then(function () { window.toast('Passwort kopiert'); })
    .catch(function () { feld.select(); window.toast('Bitte von Hand kopieren', true); });
};

function kopieren(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text);
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    ok ? resolve() : reject(new Error('nicht möglich'));
  });
}

ACT['conn-test'] = function () {
  var url = $('#connUrl').value.trim();
  var token = $('#connToken').value.trim();
  var out = $('#connResult');
  out.textContent = 'Teste …';
  var geduld = setTimeout(function () {
    out.textContent = 'Teste … Google startet den Dienst gerade, beim ersten Mal dauert das bis zu 30 Sekunden.';
  }, 4000);
  A.Sync.test(url, token).then(function (res) {
    clearTimeout(geduld);
    if (res && res.ok) out.innerHTML = '<span style="color:var(--good)">✓ Verbunden mit „' + A.esc(res.spreadsheet || '?') + '“</span>';
    else out.innerHTML = '<span style="color:var(--bad)">✕ ' + A.esc((res && res.message) || (res && res.error) || 'Unbekannter Fehler') + '</span>';
  }).catch(function (e) {
    clearTimeout(geduld);
    out.innerHTML = '<span style="color:var(--bad)">✕ ' + A.esc(e.message) + '</span>';
  });
};

/* ---------------------------------------------------------- Event-Verteilung */

function verteile(e) {
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) { e.preventDefault(); fn(el, e); }
}

main.addEventListener('click', verteile);
topActions.addEventListener('click', verteile);

/* Noteneingabe automatisch sichern */
function verzoegert(el, ms, fn) {
  clearTimeout(el._saveTimer);
  el._saveTimer = setTimeout(fn, ms);
}

main.addEventListener('input', function (e) {
  var ni = e.target.closest('[data-note-input]');
  if (ni) verzoegert(ni, 500, function () { speichereNote(ni); });
});

main.addEventListener('change', function (e) {
  var ni = e.target.closest('[data-note-input]');
  if (ni) { clearTimeout(ni._saveTimer); speichereNote(ni); }
});

main.addEventListener('keydown', function (e) {
  var ni = e.target.closest('[data-note-input]');
  if (ni && e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(ni._saveTimer);
    speichereNote(ni);
    var alle = Array.prototype.slice.call(main.querySelectorAll('[data-note-input]'));
    var i = alle.indexOf(ni);
    if (alle[i + 1]) { alle[i + 1].focus(); alle[i + 1].select(); }
    else ni.blur();
  }
});

function speichereNote(input) {
  var p = currentView().p;
  var l = A.byId('Leistungen', p.id);
  if (!l) return;
  var kurs = A.byId('Kurse', l.kursId);
  var susId = input.getAttribute('data-sus');
  var mitPunkten = !!A.num(l.maxPunkte, 0);
  var roh = String(input.value).trim().replace(',', '.');

  var rec = A.list('Noten', function (x) { return x.leistungId === l.id && x.susId === susId; })[0];
  if (!rec) rec = { id: A.uid('no'), leistungId: l.id, susId: susId, punkte: '', note: '', bemerkung: '' };

  if (roh === '') {
    rec.punkte = ''; rec.note = '';
  } else if (mitPunkten) {
    rec.punkte = roh; rec.note = '';
  } else {
    var n = A.normNote(roh);
    rec.note = (n === null) ? '' : String(n);
    rec.punkte = '';
  }
  rec.deleted = '';
  A.put('Noten', rec);

  var note = A.noteFuer(l, susId, kurs);
  var zeile = input.closest('.mit-row');
  var out = zeile.querySelector('.nums');
  out.textContent = A.fmtNote(note, 1);
  out.className = 'nums ' + noteKlasse(note);
}

/* ------------------------------------------------------------- PIN-Sperre */

function pinSetup() {
  var pin = A.cfg('pin');
  var lock = $('#lock');
  if (!pin) { lock.classList.add('hidden'); return; }
  if (sessionStorage.getItem('schulapp.unlocked') === '1') { lock.classList.add('hidden'); return; }

  lock.classList.remove('hidden');
  var eingabe = '';
  var dots = $('#pinDots');
  var pad = $('#pinPad');
  var err = $('#pinErr');

  function zeichne() {
    dots.innerHTML = [0, 1, 2, 3].map(function (i) {
      return '<i class="' + (eingabe.length > i ? 'on' : '') + '"></i>';
    }).join('');
  }
  pad.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button data-n="' + n + '">' + n + '</button>'; })
    .join('') + '<button class="blank"></button><button data-n="0">0</button><button data-del>⌫</button>';

  pad.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-del')) { eingabe = eingabe.slice(0, -1); zeichne(); return; }
    if (!b.hasAttribute('data-n')) return;
    eingabe += b.getAttribute('data-n');
    zeichne();
    if (eingabe.length === 4) {
      if (eingabe === String(pin)) {
        sessionStorage.setItem('schulapp.unlocked', '1');
        lock.classList.add('hidden');
      } else {
        err.textContent = 'Falsche PIN';
        eingabe = '';
        setTimeout(function () { zeichne(); err.textContent = ''; }, 700);
      }
    }
  });
  zeichne();
}

/* ------------------------------------------------------------------ Start */

A.loadLocal();
A.migriere();
A.Sync.update();
pinSetup();
render();

if (A.Sync.configured()) {
  A.Sync.pull().then(function () { render(); }).catch(function () { /* offline – lokale Daten genügen */ });

window.addEventListener('online', function () { if (A.Sync.configured()) A.Sync.flush(true); });

if ('serviceWorker' in navigator && istHauptseite) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

})();
