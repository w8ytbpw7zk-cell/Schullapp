/* ---------------------------------------------------------- Event-Verteilung */

var planDragClickBlock = 0;
var sitzDragClickBlock = 0;

function verteile(e) {
  if (Date.now() < Math.max(planDragClickBlock, sitzDragClickBlock)) { e.preventDefault(); return; }
  var el = e.target.closest('[data-act]');
  if (!el) return;
  var fn = ACT[el.getAttribute('data-act')];
  if (fn) { e.preventDefault(); fn(el, e); }
}

main.addEventListener('click', verteile);
topActions.addEventListener('click', verteile);

/* Stundenplan: Drag & Drop mit Maus sowie langem Fingerdruck. */
function planDragPayloadVon(el) {
  if (!el) return null;
  var kursId = el.getAttribute('data-drag-kurs');
  if (!kursId) return null;
  return { kursId: kursId, planId: el.getAttribute('data-plan-id') || '' };
}

function planDropZiel(el) {
  return el && el.closest ? el.closest('[data-plan-drop]') : null;
}

function planMarkiereDrop(ziel) {
  main.querySelectorAll('.cell.drop-target').forEach(function (x) { x.classList.remove('drop-target'); });
  if (ziel) ziel.classList.add('drop-target');
}

main.addEventListener('dragstart', function (e) {
  var src = e.target.closest('[data-drag-kurs]');
  var payload = planDragPayloadVon(src);
  if (!payload || !e.dataTransfer) return;
  e.dataTransfer.effectAllowed = payload.planId ? 'move' : 'copy';
  e.dataTransfer.setData('text/plain', JSON.stringify(payload));
  src.classList.add('dragging');
});

main.addEventListener('dragend', function (e) {
  var src = e.target.closest('[data-drag-kurs]');
  if (src) src.classList.remove('dragging');
  planMarkiereDrop(null);
});

main.addEventListener('dragover', function (e) {
  var ziel = planDropZiel(e.target);
  if (!ziel) return;
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = 'move';
  planMarkiereDrop(ziel);
});

main.addEventListener('dragleave', function (e) {
  var ziel = planDropZiel(e.target);
  if (ziel && !ziel.contains(e.relatedTarget)) ziel.classList.remove('drop-target');
});

main.addEventListener('drop', function (e) {
  var ziel = planDropZiel(e.target);
  if (!ziel || !e.dataTransfer) return;
  e.preventDefault();
  var payload = null;
  try { payload = JSON.parse(e.dataTransfer.getData('text/plain') || 'null'); } catch (err) {}
  planMarkiereDrop(null);
  if (!payload) return;
  if (planVerschiebe(payload, ziel.getAttribute('data-tag'), ziel.getAttribute('data-stunde'))) {
    ui.planKursId = '';
    render();
  }
});

var planPointer = null;

function planPointerAufraeumen() {
  if (!planPointer) return;
  clearTimeout(planPointer.timer);
  if (planPointer.src) planPointer.src.classList.remove('dragging');
  if (planPointer.ghost && planPointer.ghost.parentNode) planPointer.ghost.parentNode.removeChild(planPointer.ghost);
  planMarkiereDrop(null);
  planPointer = null;
}

main.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' || e.button !== 0) return;
  var src = e.target.closest('[data-drag-kurs]');
  var payload = planDragPayloadVon(src);
  if (!payload) return;

  planPointerAufraeumen();
  planPointer = {
    id: e.pointerId, src: src, payload: payload, startX: e.clientX, startY: e.clientY,
    x: e.clientX, y: e.clientY, dragging: false, ghost: null, ziel: null, timer: null
  };

  planPointer.timer = setTimeout(function () {
    if (!planPointer || planPointer.id !== e.pointerId) return;
    planPointer.dragging = true;
    src.classList.add('dragging');
    try { src.setPointerCapture(e.pointerId); } catch (err) {}
    var kurs = A.byId('Kurse', payload.kursId);
    var ghost = document.createElement('div');
    ghost.className = 'plan-drag-ghost';
    ghost.textContent = kurs ? A.kursLabel(kurs) : 'Kurs';
    document.body.appendChild(ghost);
    planPointer.ghost = ghost;
    ghost.style.transform = 'translate(' + (planPointer.x + 12) + 'px,' + (planPointer.y + 12) + 'px)';
    var unter = document.elementFromPoint(planPointer.x, planPointer.y);
    planPointer.ziel = planDropZiel(unter);
    planMarkiereDrop(planPointer.ziel);
    if (navigator.vibrate) navigator.vibrate(20);
  }, 260);
}, { passive: true });

main.addEventListener('pointermove', function (e) {
  if (!planPointer || planPointer.id !== e.pointerId) return;
  planPointer.x = e.clientX;
  planPointer.y = e.clientY;

  if (!planPointer.dragging) {
    var dx = e.clientX - planPointer.startX;
    var dy = e.clientY - planPointer.startY;
    if (Math.sqrt(dx * dx + dy * dy) > 9) planPointerAufraeumen();
    return;
  }

  e.preventDefault();
  if (planPointer.ghost) planPointer.ghost.style.transform = 'translate(' + (e.clientX + 12) + 'px,' + (e.clientY + 12) + 'px)';
  var unter = document.elementFromPoint(e.clientX, e.clientY);
  planPointer.ziel = planDropZiel(unter);
  planMarkiereDrop(planPointer.ziel);
}, { passive: false });

function planPointerEnde(e) {
  if (!planPointer || planPointer.id !== e.pointerId) return;
  var warDrag = planPointer.dragging;
  var payload = planPointer.payload;
  var ziel = planPointer.ziel;
  if (warDrag) {
    e.preventDefault();
    planDragClickBlock = Date.now() + 550;
    if (ziel && planVerschiebe(payload, ziel.getAttribute('data-tag'), ziel.getAttribute('data-stunde'))) {
      ui.planKursId = '';
    }
  }
  planPointerAufraeumen();
  if (warDrag) render();
}

main.addEventListener('pointerup', planPointerEnde, { passive: false });
main.addEventListener('pointercancel', planPointerEnde, { passive: false });

/* Sitzplan: Schüler:innen sowie im Layoutmodus ganze Tischreihen mit Maus
   oder langem Fingerdruck verschieben. Antippen bleibt als Fallback erhalten. */
function sitzDropMarkieren(ziel) {
  main.querySelectorAll('.sitzplatz.drop-target, .sitz-tisch-edit.drop-target, .sitz-tisch-slot.drop-target').forEach(function (x) {
    x.classList.remove('drop-target');
  });
  if (ziel) ziel.classList.add('drop-target');
}

function sitzVerschiebeStudent(vonKey, nachKey) {
  var von = sitzKeyLesen(vonKey), nach = sitzKeyLesen(nachKey);
  if (!von || !nach) return false;
  var klasseId = currentView().p.id;
  var plan = sitzPlanFlex(klasseId);
  var a = plan.items[von.tisch], b = plan.items[nach.tisch];
  if (!a || a.type !== 'table' || !b || b.type !== 'table') return false;
  if (von.platz >= a.size || nach.platz >= b.size) return false;
  var tmp = a.seats[von.platz] || '';
  a.seats[von.platz] = b.seats[nach.platz] || '';
  b.seats[nach.platz] = tmp;
  setSitzPlanFlex(klasseId, plan);
  ui.sitzAuswahl = null;
  return true;
}

function sitzVerschiebeTisch(von, nach) {
  var klasseId = currentView().p.id;
  var plan = sitzPlanFlex(klasseId);
  while (plan.items.length <= Math.max(von, nach)) plan.items.push({ type: 'gap' });
  if (!plan.items[von] || plan.items[von].type !== 'table') return false;
  var tmp = plan.items[von];
  plan.items[von] = plan.items[nach] || { type: 'gap' };
  plan.items[nach] = tmp;
  setSitzPlanFlex(klasseId, plan);
  return true;
}

function sitzDragInfo(el) {
  if (!el) return null;
  if (ui.sitzLayout && el.hasAttribute('data-tisch-drag')) {
    var ti = A.num(el.getAttribute('data-tisch-drag'), -1);
    return ti >= 0 ? { mode: 'tisch', value: ti } : null;
  }
  if (!ui.sitzLayout && el.hasAttribute('data-sitz-drag')) {
    var key = el.getAttribute('data-sitz-drag') || '';
    return sitzKeyLesen(key) ? { mode: 'student', value: key } : null;
  }
  return null;
}

function sitzDropZiel(el, mode) {
  if (!el || !el.closest) return null;
  return mode === 'tisch' ? el.closest('[data-tisch-drop]') : el.closest('[data-sitz-drop]');
}

main.addEventListener('dragstart', function (e) {
  var src = e.target.closest('[data-sitz-drag], [data-tisch-drag]');
  var info = sitzDragInfo(src);
  if (!info || !e.dataTransfer) return;
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('application/x-schulapp-sitz', JSON.stringify(info));
  e.dataTransfer.setData('text/plain', JSON.stringify(info));
  src.classList.add('dragging');
});

main.addEventListener('dragend', function (e) {
  var src = e.target.closest('[data-sitz-drag], [data-tisch-drag]');
  if (src) src.classList.remove('dragging');
  sitzDropMarkieren(null);
});

main.addEventListener('dragover', function (e) {
  var mode = ui.sitzLayout ? 'tisch' : 'student';
  var ziel = sitzDropZiel(e.target, mode);
  if (!ziel) return;
  e.preventDefault();
  sitzDropMarkieren(ziel);
});

main.addEventListener('drop', function (e) {
  var raw = '';
  if (e.dataTransfer) raw = e.dataTransfer.getData('application/x-schulapp-sitz') || '';
  if (!raw) return; /* Stundenplan-Drops weiterhin dem anderen Handler überlassen. */
  e.preventDefault();
  var info = null;
  try { info = JSON.parse(raw); } catch (err) {}
  if (!info) return;
  var ziel = sitzDropZiel(e.target, info.mode);
  sitzDropMarkieren(null);
  if (!ziel) return;
  if (info.mode === 'tisch') {
    var nachTisch = A.num(ziel.getAttribute('data-tisch-drop'), -1);
    if (nachTisch < 0 || nachTisch === info.value) return;
    if (sitzVerschiebeTisch(info.value, nachTisch)) render();
  } else {
    var nachSitz = ziel.getAttribute('data-sitz-drop') || '';
    if (!nachSitz || nachSitz === info.value) return;
    if (sitzVerschiebeStudent(info.value, nachSitz)) render();
  }
});

var sitzPointer = null;
function sitzPointerAufraeumen() {
  if (!sitzPointer) return;
  clearTimeout(sitzPointer.timer);
  if (sitzPointer.src) sitzPointer.src.classList.remove('dragging');
  if (sitzPointer.ghost && sitzPointer.ghost.parentNode) sitzPointer.ghost.parentNode.removeChild(sitzPointer.ghost);
  sitzDropMarkieren(null);
  sitzPointer = null;
}

main.addEventListener('pointerdown', function (e) {
  if (e.pointerType === 'mouse' || e.button !== 0) return;
  var src = e.target.closest('[data-sitz-drag], [data-tisch-drag]');
  var info = sitzDragInfo(src);
  if (!info) return;

  sitzPointerAufraeumen();
  sitzPointer = {
    id: e.pointerId, src: src, info: info,
    startX: e.clientX, startY: e.clientY, x: e.clientX, y: e.clientY,
    dragging: false, ziel: null, ghost: null, timer: null
  };
  sitzPointer.timer = setTimeout(function () {
    if (!sitzPointer || sitzPointer.id !== e.pointerId) return;
    sitzPointer.dragging = true;
    src.classList.add('dragging');
    try { src.setPointerCapture(e.pointerId); } catch (err) {}
    var ghost = document.createElement('div');
    ghost.className = 'sitz-drag-ghost';
    ghost.textContent = src.getAttribute('data-label') || src.textContent.trim() || (info.mode === 'tisch' ? 'Tisch' : 'Platz');
    document.body.appendChild(ghost);
    sitzPointer.ghost = ghost;
    ghost.style.transform = 'translate(' + (sitzPointer.x + 12) + 'px,' + (sitzPointer.y + 12) + 'px)';
    var unter = document.elementFromPoint(sitzPointer.x, sitzPointer.y);
    sitzPointer.ziel = sitzDropZiel(unter, info.mode);
    sitzDropMarkieren(sitzPointer.ziel);
    if (navigator.vibrate) navigator.vibrate(18);
  }, 230);
}, { passive: true });

main.addEventListener('pointermove', function (e) {
  if (!sitzPointer || sitzPointer.id !== e.pointerId) return;
  sitzPointer.x = e.clientX; sitzPointer.y = e.clientY;
  if (!sitzPointer.dragging) {
    var dx = e.clientX - sitzPointer.startX, dy = e.clientY - sitzPointer.startY;
    if (Math.sqrt(dx * dx + dy * dy) > 9) sitzPointerAufraeumen();
    return;
  }
  e.preventDefault();
  if (sitzPointer.ghost) sitzPointer.ghost.style.transform = 'translate(' + (e.clientX + 12) + 'px,' + (e.clientY + 12) + 'px)';
  var unter = document.elementFromPoint(e.clientX, e.clientY);
  sitzPointer.ziel = sitzDropZiel(unter, sitzPointer.info.mode);
  sitzDropMarkieren(sitzPointer.ziel);
}, { passive: false });

function sitzPointerEnde(e) {
  if (!sitzPointer || sitzPointer.id !== e.pointerId) return;
  var warDrag = sitzPointer.dragging;
  var info = sitzPointer.info;
  var ziel = sitzPointer.ziel;
  var ok = false;
  if (warDrag) {
    e.preventDefault();
    sitzDragClickBlock = Date.now() + 550;
    if (ziel) {
      if (info.mode === 'tisch') {
        var nachTisch = A.num(ziel.getAttribute('data-tisch-drop'), -1);
        if (nachTisch >= 0 && nachTisch !== info.value) ok = sitzVerschiebeTisch(info.value, nachTisch);
      } else {
        var nachSitz = ziel.getAttribute('data-sitz-drop') || '';
        if (nachSitz && nachSitz !== info.value) ok = sitzVerschiebeStudent(info.value, nachSitz);
      }
    }
  }
  sitzPointerAufraeumen();
  if (warDrag && ok) render();
}

main.addEventListener('pointerup', sitzPointerEnde, { passive: false });
main.addEventListener('pointercancel', sitzPointerEnde, { passive: false });

/* Noteneingabe automatisch sichern */
function verzoegert(el, ms, fn) {
  clearTimeout(el._saveTimer);
  el._saveTimer = setTimeout(fn, ms);
}

main.addEventListener('input', function (e) {
  var ni = e.target.closest('[data-note-input]');
  if (ni) verzoegert(ni, 500, function () { speichereNote(ni); });
});

main.addEventListener('change', function (e) {
  var ni = e.target.closest('[data-note-input]');
  if (ni) { clearTimeout(ni._saveTimer); speichereNote(ni); }
});

main.addEventListener('keydown', function (e) {
  var ni = e.target.closest('[data-note-input]');
  if (ni && e.key === 'Enter') {
    e.preventDefault();
    clearTimeout(ni._saveTimer);
    speichereNote(ni);
    var alle = Array.prototype.slice.call(main.querySelectorAll('[data-note-input]'));
    var i = alle.indexOf(ni);
    if (alle[i + 1]) { alle[i + 1].focus(); alle[i + 1].select(); }
    else ni.blur();
  }
});

function speichereNote(input) {
  var p = currentView().p;
  var l = A.byId('Leistungen', p.id);
  if (!l) return;
  var kurs = A.byId('Kurse', l.kursId);
  var susId = input.getAttribute('data-sus');
  var mitPunkten = !!A.num(l.maxPunkte, 0);
  var roh = String(input.value).trim().replace(',', '.');

  var rec = A.list('Noten', function (x) { return x.leistungId === l.id && x.susId === susId; })[0];
  if (!rec) rec = { id: A.uid('no'), leistungId: l.id, susId: susId, punkte: '', note: '', bemerkung: '' };

  if (roh === '') {
    rec.punkte = ''; rec.note = '';
  } else if (mitPunkten) {
    rec.punkte = roh; rec.note = '';
  } else {
    var n = A.normNote(roh);
    rec.note = (n === null) ? '' : String(n);
    rec.punkte = '';
  }
  rec.deleted = '';
  A.put('Noten', rec);

  var note = A.noteFuer(l, susId, kurs);
  var zeile = input.closest('.mit-row');
  var out = zeile.querySelector('.nums');
  out.textContent = A.fmtNote(note, 1);
  out.className = 'nums ' + noteKlasse(note);
}


/* ------------------------------------------------------------- PIN-Sperre */

function pinSetup() {
  var pin = A.cfg('pin');
  var lock = $('#lock');
  if (!pin) { lock.classList.add('hidden'); return; }
  if (sessionStorage.getItem('schulapp.unlocked') === '1') { lock.classList.add('hidden'); return; }

  lock.classList.remove('hidden');
  var eingabe = '';
  var dots = $('#pinDots');
  var pad = $('#pinPad');
  var err = $('#pinErr');

  function zeichne() {
    dots.innerHTML = [0, 1, 2, 3].map(function (i) {
      return '<i class="' + (eingabe.length > i ? 'on' : '') + '"></i>';
    }).join('');
  }
  pad.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(function (n) { return '<button data-n="' + n + '">' + n + '</button>'; })
    .join('') + '<button class="blank"></button><button data-n="0">0</button><button data-del>⌫</button>';

  pad.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.hasAttribute('data-del')) { eingabe = eingabe.slice(0, -1); zeichne(); return; }
    if (!b.hasAttribute('data-n')) return;
    eingabe += b.getAttribute('data-n');
    zeichne();
    if (eingabe.length === 4) {
      if (eingabe === String(pin)) {
        sessionStorage.setItem('schulapp.unlocked', '1');
        lock.classList.add('hidden');
      } else {
        err.textContent = 'Falsche PIN';
        eingabe = '';
        setTimeout(function () { zeichne(); err.textContent = ''; }, 700);
      }
    }
  });
  zeichne();
}
