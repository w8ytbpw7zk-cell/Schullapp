<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a44" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6fa" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schulapp">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<title>Schulapp</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
/* =====================================================================
   Schulapp – Stylesheet
   Mobile first, optimiert für iPhone und iPad (Safari / Home-Bildschirm)
   ===================================================================== */

:root {
  --bg:        #f2f3f7;
  --surface:   #ffffff;
  --surface-2: #f7f8fb;
  --line:      #dfe2ea;
  --line-soft: #ebedf3;
  --ink:       #171a21;
  --ink-2:     #5a6170;
  --ink-3:     #8b91a0;
  --accent:    #3f5bd9;
  --accent-ink:#ffffff;
  --accent-soft:#e7ebfd;
  --good:      #1f8a53;
  --warn:      #b06a06;
  --bad:       #c0392f;
  --radius:    14px;
  --radius-sm: 10px;
  --tap:       44px;
  --sat: env(safe-area-inset-top, 0px);
  --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px);
  --sar: env(safe-area-inset-right, 0px);
  --topbar-h: 52px;
  --tabbar-h: 56px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg:        #14171e;
    --surface:   #1c2029;
    --surface-2: #232834;
    --line:      #2f3542;
    --line-soft: #262c38;
    --ink:       #eef0f5;
    --ink-2:     #a8aebd;
    --ink-3:     #7b8293;
    --accent:    #7f95ff;
    --accent-ink:#11151f;
    --accent-soft:#242b45;
    --good:      #4cc487;
    --warn:      #e0a244;
    --bad:       #ef7b70;
  }
}

/* Farbdesign: nur die Akzentwelt ändert sich; Lesbarkeit und Dark Mode bleiben erhalten. */
:root[data-theme="orange"] { --accent:#c86f2d; --accent-soft:#f7e9df; }
:root[data-theme="salbei"] { --accent:#4f816d; --accent-soft:#e3eee9; }
:root[data-theme="flieder"] { --accent:#7867b7; --accent-soft:#ece8f8; }
:root[data-theme="beere"]  { --accent:#ad5570; --accent-soft:#f5e4e9; }
:root[data-theme="petrol"] { --accent:#347c83; --accent-soft:#e0eff0; }

@media (prefers-color-scheme: dark) {
  :root[data-theme="orange"] { --accent:#efa05f; --accent-soft:#443126; }
  :root[data-theme="salbei"] { --accent:#7fc1a5; --accent-soft:#263b34; }
  :root[data-theme="flieder"] { --accent:#aa9ae9; --accent-soft:#312d48; }
  :root[data-theme="beere"]  { --accent:#e28ca6; --accent-soft:#432b34; }
  :root[data-theme="petrol"] { --accent:#72bdc3; --accent-soft:#263c3e; }
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

[hidden] { display: none !important; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--bg);
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

/* Verhindert das automatische Hineinzoomen von iOS bei Eingabefeldern */
input, select, textarea { font-size: 16px; }

/* ---------------------------------------------------------------- Topbar */

.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 4px;
  height: calc(var(--topbar-h) + var(--sat));
  padding: var(--sat) calc(8px + var(--sar)) 0 calc(8px + var(--sal));
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line-soft);
}

.topbar-title {
  flex: 1;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding-left: 4px;
}

.topbar-actions { display: flex; gap: 2px; }

.icon-btn {
  min-width: var(--tap);
  height: var(--tap);
  padding: 0 10px;
  border: 0;
  background: transparent;
  color: var(--accent);
  font-size: 17px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.icon-btn:active { background: var(--line-soft); }
#btnBack { font-size: 30px; line-height: 1; padding: 0 6px; min-width: 36px; }

.icon-btn.sync { position: relative; font-size: 19px; }
.icon-btn.sync.busy { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.dot {
  position: absolute;
  top: 8px; right: 7px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--ink-3);
}
.dot.ok      { background: var(--good); }
.dot.pending { background: var(--warn); }
.dot.err     { background: var(--bad); }
.dot.off     { background: var(--ink-3); }

/* ------------------------------------------------------------------ Main */

.main {
  padding: calc(var(--topbar-h) + var(--sat) + 10px) calc(12px + var(--sar))
           calc(var(--tabbar-h) + var(--sab) + 24px) calc(12px + var(--sal));
  max-width: 900px;
  margin: 0 auto;
}

@media (min-width: 720px) {
  .main { padding-left: 20px; padding-right: 20px; }
}

/* ---------------------------------------------------------------- Tabbar */

.tabbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 40;
  display: flex;
  height: calc(var(--tabbar-h) + var(--sab));
  padding-bottom: var(--sab);
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line-soft);
}

.tab {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink-3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  cursor: pointer;
  padding: 0;
}
.tab-ico { font-size: 19px; line-height: 1.1; filter: grayscale(1) opacity(.65); }
.tab-lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; }
.tab.active { color: var(--accent); }
.tab.active .tab-ico { filter: none; }

/* ----------------------------------------------------------- Bausteine */

.card {
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: var(--radius);
  margin-bottom: 12px;
  overflow: hidden;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 14px 0;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.card-body { padding: 12px 14px; }
.card-body.tight { padding: 4px 0; }

.section-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin: 18px 4px 8px;
}
.section-title:first-child { margin-top: 2px; }

.row {
  display: flex;
  align-items: center;
  gap: 12px;
  min-height: var(--tap);
  padding: 10px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
  width: 100%;
  border-left: 0; border-right: 0; border-top: 0;
  text-align: left;
  cursor: pointer;
  color: inherit;
}
.row:last-child { border-bottom: 0; }
.row:active { background: var(--surface-2); }
.row.static { cursor: default; }
.row.static:active { background: var(--surface); }

.row-main { flex: 1; min-width: 0; }
.row-title { font-weight: 600; letter-spacing: -.01em; }
.row-sub { font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.row-val { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.chev { color: var(--ink-3); font-size: 20px; line-height: 1; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11.5px;
  font-weight: 650;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  border: 1px solid var(--line-soft);
}
.badge.accent { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.good { color: var(--good); }
.badge.warn { color: var(--warn); }
.badge.bad  { color: var(--bad); }

.pill {
  width: 10px; height: 34px;
  border-radius: 999px;
  flex: none;
  background: var(--accent);
}

.empty {
  text-align: center;
  color: var(--ink-3);
  padding: 34px 20px;
  font-size: 15px;
}
.empty .big { font-size: 34px; display: block; margin-bottom: 8px; filter: grayscale(.4); }

.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.nums { font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------------- Buttons */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: var(--tap);
  padding: 0 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  cursor: pointer;
}
.btn:active { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.danger  { color: var(--bad); }
.btn.block   { display: flex; width: 100%; }
.btn.small   { min-height: 34px; padding: 0 12px; font-size: 14px; }

.btn-row { display: flex; gap: 8px; margin: 12px 0; }
.btn-row .btn { flex: 1; }

/* --------------------------------------------------------------- Formular */

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: 12.5px;
  font-weight: 650;
  color: var(--ink-2);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  min-height: var(--tap);
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  appearance: none;
  -webkit-appearance: none;
}
.field textarea { min-height: 92px; resize: vertical; line-height: 1.45; }
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--accent);
  outline-offset: -1px;
  border-color: var(--accent);
}
.field .hint { font-size: 12.5px; color: var(--ink-3); margin-top: 5px; }
.field.check { display: flex; align-items: center; gap: 10px; }
.field.check input { width: 22px; min-height: 22px; height: 22px; accent-color: var(--accent); }
.field.check label { margin: 0; font-size: 15px; color: var(--ink); font-weight: 500; }
.field-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* ----------------------------------------------------------------- Modal */

.modal-bg {
  position: fixed; inset: 0; z-index: 60;
  background: rgba(10,12,18,.42);
  display: flex; align-items: flex-end; justify-content: center;
  animation: fade .15s ease;
}
@keyframes fade { from { opacity: 0; } }
@media (min-width: 640px) { .modal-bg { align-items: center; } }

.modal {
  background: var(--bg);
  width: 100%;
  max-width: 560px;
  max-height: 92vh;
  border-radius: 18px 18px 0 0;
  display: flex;
  flex-direction: column;
  animation: rise .2s cubic-bezier(.2,.8,.3,1);
}
@media (min-width: 640px) { .modal { border-radius: 18px; max-height: 84vh; } }
@keyframes rise { from { transform: translateY(24px); } }

.modal-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 8px 10px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
  border-radius: 18px 18px 0 0;
}
.modal-head .t { flex: 1; font-weight: 650; }
.modal-body {
  padding: 14px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(14px + var(--sab));
}
.modal-foot {
  display: flex; gap: 8px;
  padding: 10px 14px calc(10px + var(--sab));
  border-top: 1px solid var(--line-soft);
  background: var(--surface);
}
.modal-foot .btn { flex: 1; }

/* ----------------------------------------------------------------- Toast */

.toast-host {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(var(--tabbar-h) + var(--sab) + 10px);
  z-index: 70;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  pointer-events: none;
}
.toast {
  background: #1d2230;
  color: #fff;
  padding: 9px 15px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 550;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  animation: fade .15s ease;
  max-width: 88vw;
}
.toast.err { background: var(--bad); }

/* -------------------------------------------------------------- Datumsleiste */

.datebar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.datebar .d-main { flex: 1; text-align: center; }
.datebar .d-day { font-weight: 700; font-size: 17px; letter-spacing: -.01em; }
.datebar .d-date { font-size: 12.5px; color: var(--ink-2); }
.datebar button {
  width: var(--tap); height: var(--tap);
  border-radius: 50%;
  border: 1px solid var(--line-soft);
  background: var(--surface);
  color: var(--accent);
  font-size: 20px;
  cursor: pointer;
}

/* --------------------------------------------------------------- Stundenkarte */

.lesson {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 12px 14px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
  cursor: pointer;
  width: 100%;
  border-left: 0; border-right: 0; border-top: 0;
  text-align: left;
  color: inherit;
}
.lesson:last-child { border-bottom: 0; }
.lesson:active { background: var(--surface-2); }
.lesson.free { opacity: .55; }
.lesson .hour {
  width: 42px; flex: none; text-align: center;
}
.lesson .hour .nr { font-weight: 750; font-size: 17px; }
.lesson .hour .tm { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lesson .meta { flex: 1; min-width: 0; }
.lesson .meta .l1 { font-weight: 640; letter-spacing: -.01em; }
.lesson .meta .l2 { font-size: 13px; color: var(--ink-2); }
.lesson .flags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
.lesson.task-warn { background: color-mix(in srgb, var(--warn) 6%, var(--surface)); }
.lesson.task-bad { background: color-mix(in srgb, var(--bad) 7%, var(--surface)); }
.badge.warn { background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border-color: transparent; }
.badge.bad { background: color-mix(in srgb, var(--bad) 11%, var(--surface)); border-color: transparent; }

/* ------------------------------------------------------------ Stundenplan-Raster */

.grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; }
.plan-grid {
  display: grid;
  grid-template-columns: 26px repeat(5, minmax(60px, 1fr));
  gap: 3px;
  min-width: 340px;
}
@media (min-width: 640px) {
  .plan-grid { grid-template-columns: 34px repeat(5, minmax(96px, 1fr)); gap: 5px; }
}
.plan-grid .gh {
  font-size: 11.5px; font-weight: 700; color: var(--ink-3);
  text-align: center; padding: 4px 0; text-transform: uppercase; letter-spacing: .05em;
}
.plan-grid .gn {
  font-size: 12px; font-weight: 700; color: var(--ink-3);
  display: flex; align-items: center; justify-content: center;
}
.cell {
  min-height: 54px;
  border-radius: 9px;
  border: 1px dashed var(--line);
  background: var(--surface);
  padding: 5px 6px;
  cursor: pointer;
  display: flex; flex-direction: column; justify-content: center;
  overflow: hidden;
  color: inherit;
  text-align: left;
}
.cell.filled { border-style: solid; border-color: transparent; }
.cell .c1 { font-size: 12.5px; font-weight: 700; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.cell .c2 { font-size: 10.5px; opacity: .85; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.cell.empty-cell { color: var(--ink-3); font-size: 18px; align-items: center; }
.cell .plan-alert {
  display: inline-flex;
  align-items: center;
  align-self: flex-start;
  margin-top: 4px;
  padding: 1px 5px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 800;
  line-height: 1.35;
  white-space: nowrap;
}
.cell .plan-alert.warn { color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, var(--surface)); }
.cell .plan-alert.bad { color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
.plan-kurs-chip .plan-chip-alert {
  display: inline-flex;
  margin-left: 5px;
  padding: 1px 5px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 800;
  background: color-mix(in srgb, var(--warn) 14%, var(--surface));
  color: var(--warn);
}
.plan-kurs-chip .plan-chip-alert.bad {
  background: color-mix(in srgb, var(--bad) 14%, var(--surface));
  color: var(--bad);
}

/* ----------------------------------------------- Stundenplan: Kursablage */

.plan-kurswahl { overflow: visible; }
.plan-kurswahl .card-body { padding-top: 10px; }
.plan-kursgruppe + .plan-kursgruppe { margin-top: 12px; }
.plan-kursgruppe-title {
  margin-bottom: 6px;
  font-size: 12px;
  font-weight: 750;
  color: var(--ink-2);
}
.plan-kurschips { display: flex; flex-wrap: wrap; gap: 7px; }
.plan-kurs-chip {
  min-height: 38px;
  padding: 7px 11px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  font-weight: 650;
  cursor: grab;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.plan-kurs-chip:active { transform: scale(.98); }
.plan-kurs-chip.selected {
  box-shadow: 0 0 0 2px var(--accent);
  border-color: transparent;
}
.plan-kurs-chip.dragging, .cell.dragging { opacity: .42; }
.cell.drop-target {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  transform: scale(1.02);
}
.plan-drag-ghost {
  position: fixed;
  z-index: 9999;
  left: 0; top: 0;
  pointer-events: none;
  padding: 8px 11px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--accent);
  box-shadow: 0 8px 28px rgba(0,0,0,.22);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  max-width: 190px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* -------------------------------------------------------------- Mitarbeit */

.mit-row {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
}
.mit-row:last-child { border-bottom: 0; }
.mit-name { flex: 1; min-width: 0; font-size: 15px; }
.mit-name .nn { font-weight: 600; }
.mit-name .avg { font-size: 11.5px; color: var(--ink-3); }
.smileys { display: flex; gap: 3px; flex: none; }
.sm {
  width: 40px; height: 40px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: var(--surface-2);
  font-size: 20px;
  line-height: 1;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  filter: grayscale(1) opacity(.45);
  transition: filter .1s, transform .1s;
}
.sm:active { transform: scale(.92); }
.sm.on { filter: none; background: var(--accent-soft); border-color: var(--accent); }
@media (max-width: 380px) { .sm { width: 36px; height: 36px; font-size: 18px; } }

/* -------------------------------------------------------------- Abhakliste */

.kachel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(158px, 1fr));
  gap: 8px;
  padding: 10px 12px;
}

.kachel {
  background: var(--surface-2);
  border: 1px solid var(--line-soft);
  border-radius: 11px;
  padding: 7px 8px 8px;
  min-width: 0;
}

.kachel-name {
  font-size: 12.5px;
  font-weight: 650;
  letter-spacing: -.01em;
  margin-bottom: 6px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.kachel-felder { display: flex; gap: 5px; }

.chk {
  flex: 1;
  min-width: 0;
  height: 40px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  padding: 0 2px;
  transition: transform .1s;
}
.chk:active { transform: scale(.93); }
.chk-k {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
  opacity: .75;
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chk-z { font-size: 15px; font-weight: 700; line-height: 1; }

.chk.ok { color: var(--ink-3); }
.chk.e {
  background: color-mix(in srgb, var(--warn) 20%, var(--surface));
  border-color: transparent;
  color: var(--warn);
}
.chk.f {
  background: color-mix(in srgb, var(--bad) 18%, var(--surface));
  border-color: transparent;
  color: var(--bad);
}

.chk-fuss {
  padding: 10px 12px;
  font-size: 12.5px;
  color: var(--ink-2);
  background: var(--surface-2);
  border-top: 1px solid var(--line-soft);
  line-height: 1.5;
}

@media (max-width: 360px) {
  .kachel-grid { grid-template-columns: 1fr 1fr; gap: 6px; }
}

/* ------------------------------------------------ Vergessen / Strafarbeit */

.chk-kachel .kachel-name { display: flex; align-items: baseline; gap: 6px; }
.chk-kachel .nn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.verg {
  flex: none;
  display: inline-block;
  padding: 1px 6px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: 10.5px;
  font-weight: 750;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
  vertical-align: 1px;
}
.chk-kachel .verg { background: var(--surface); }
.verg.voll {
  background: color-mix(in srgb, var(--bad) 16%, var(--surface));
  border-color: transparent;
  color: var(--bad);
}
.verg[hidden] { display: none; }

.straf-leiste {
  margin-top: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: 12.5px;
  color: var(--ink-2);
  line-height: 1.45;
}
.straf-leiste.voll {
  background: color-mix(in srgb, var(--bad) 13%, var(--surface));
  color: var(--bad);
}

.straf-box {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--bad) 12%, var(--surface));
  margin-bottom: 12px;
}
.straf-zahl {
  flex: none;
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  color: var(--bad);
  font-variant-numeric: tabular-nums;
}
.straf-text { font-size: 15px; line-height: 1.45; }

.kv.gross .k { font-weight: 650; color: var(--ink); }
.kv.gross .v { font-size: 17px; font-weight: 750; }
.kv .v.schlecht { color: var(--bad); }

/* --------------------------------------------------- Mitarbeit als Kacheln */

.mit-grid { grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }

.mit-kachel .kachel-name {
  display: flex;
  align-items: baseline;
  gap: 6px;
  white-space: normal;
}
.mit-kachel .nn {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mit-kachel .avg {
  flex: none;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.mit-kachel .smileys { gap: 4px; justify-content: space-between; }
.mit-kachel .sm { flex: 1; min-width: 0; max-width: 52px; width: auto; height: 40px; font-size: 18px; }

/* Auf dem iPhone passen nebeneinander keine zwei Kacheln mit fünf gut
   treffbaren Smileys – dort stehen Name und Smileys deshalb nebeneinander.
   Auf dem iPad bleibt es ein echtes Raster. */
@media (max-width: 559px) {
  .mit-grid { grid-template-columns: 1fr; gap: 6px; }
  .mit-kachel { display: flex; align-items: center; gap: 8px; padding: 6px 8px; }
  .mit-kachel .kachel-name {
    flex: 1; min-width: 0;
    display: block;
    margin-bottom: 0;
  }
  .mit-kachel .nn { display: block; font-size: 13px; }
  .mit-kachel .avg { display: block; }
  .mit-kachel .smileys { flex: none; }
  .mit-kachel .sm { flex: none; width: 36px; }
}
@media (max-width: 380px) {
  .mit-kachel .sm { width: 33px; height: 36px; font-size: 16px; }
}

/* ------------------------------------------------------------ Farbauswahl */

.farb-wahl { display: flex; flex-wrap: wrap; gap: 7px; }
.farb-opt {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 38px;
  padding: 0 12px 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--surface);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
}
.farb-punkt {
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--fc);
  flex: none;
}
.farb-opt.on {
  border-color: var(--fc);
  color: var(--fc);
  background: color-mix(in srgb, var(--fc) 12%, var(--surface));
  box-shadow: inset 0 0 0 1px var(--fc);
}

/* ------------------------------------------------ Notenvorschlag (Smileys) */

.vorschlag {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  flex: none;
  min-width: 62px;
  min-height: 38px;
  padding: 3px 8px;
  border: 1px dashed var(--line);
  border-radius: 9px;
  background: var(--surface-2);
  cursor: pointer;
  color: var(--ink-2);
}
.vorschlag:active { transform: scale(.94); }
.vorschlag .vs-k {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: .05em;
  text-transform: uppercase;
  opacity: .7;
}
.vorschlag .vs-n { font-size: 15px; font-weight: 750; font-variant-numeric: tabular-nums; line-height: 1; }
.vorschlag.leer { opacity: .45; cursor: default; }
button.vorschlag { border-color: var(--accent); color: var(--accent); }

@media (max-width: 400px) {
  .eingabe { gap: 7px; }
  .vorschlag { min-width: 52px; padding: 3px 5px; }
  input.pkt { width: 58px; }
  .eingabe .nums { width: 34px; }
}

/* ------------------------------------------------------- Weitere Bausteine */

.row.sub {
  padding-left: 22px;
  background: var(--surface-2);
}
.row.sub .row-title { font-weight: 550; font-size: 15px; }
.accent-text { color: var(--accent); }

.eingabe { display: flex; align-items: center; gap: 10px; flex: none; }
input.pkt {
  width: 68px;
  text-align: center;
  min-height: 38px;
  padding: 4px 6px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
}
.eingabe .nums { width: 42px; text-align: right; font-weight: 700; }

.cell.fortsetzung {
  border-top-style: dashed;
  border-top-color: transparent;
  opacity: .82;
}

/* ---------------------------------------------------------------- Notenspiegel */

.spiegel {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  align-items: end;
  height: 128px;
  padding: 6px 2px 0;
}
.spiegel .col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; gap: 4px; }
.spiegel .cnt { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.spiegel .bar {
  background: var(--accent);
  border-radius: 4px 4px 0 0;
  min-height: 2px;
}
.spiegel .bar.zero { background: var(--line); }
.spiegel-x {
  display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px;
  border-top: 1px solid var(--line);
  padding-top: 5px;
}
.spiegel-x div { text-align: center; font-size: 12px; font-weight: 650; color: var(--ink-2); }

.stat-row { display: flex; gap: 8px; margin-top: 10px; }
.stat {
  flex: 1;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  text-align: center;
}
.stat .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat .k { font-size: 11px; color: var(--ink-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }

/* --------------------------------------------------------------- Notentabelle */

.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.grades {
  border-collapse: collapse;
  width: 100%;
  font-size: 14px;
}
table.grades th, table.grades td {
  padding: 7px 8px;
  border-bottom: 1px solid var(--line-soft);
  text-align: center;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
table.grades th {
  font-size: 11px; font-weight: 700; color: var(--ink-3);
  text-transform: uppercase; letter-spacing: .04em;
  position: sticky; top: 0; background: var(--surface);
}
table.grades td.name, table.grades th.name {
  text-align: left; white-space: nowrap;
  position: sticky; left: 0;
  background: var(--surface);
  font-weight: 600;
  z-index: 1;
}
table.grades tr:last-child td { border-bottom: 0; }
table.grades td.gesamt { font-weight: 750; }

.g1 { color: var(--good); }
.g5 { color: var(--bad); }


/* --------------------------------------------------------------- Anmeldung */

.auth-gate {
  position: fixed; inset: 0; z-index: 120;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  padding: max(22px, var(--sat)) 18px max(22px, var(--sab));
  overflow-y: auto;
}
.auth-gate.hidden { display: none; }
.auth-card {
  width: 100%; max-width: 430px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 16px 45px rgba(0,0,0,.08);
}
.auth-mark {
  width: 66px; height: 66px; margin: 0 auto 14px;
  border-radius: 19px; display: flex; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent); font-size: 34px;
}
.auth-title { text-align: center; font-size: 28px; font-weight: 800; letter-spacing: -.03em; }
.auth-sub { text-align: center; color: var(--ink-2); font-size: 14px; margin: 5px 0 24px; }
.auth-card .field { margin-bottom: 14px; }
.auth-check {
  display: flex; align-items: center; gap: 9px; margin: 2px 0 16px;
  color: var(--ink-2); font-size: 14px;
}
.auth-check input { width: 18px; height: 18px; accent-color: var(--accent); }
.auth-switch { text-align: center; margin-top: 17px; color: var(--ink-2); font-size: 13.5px; }
.auth-switch button { border: 0; background: transparent; color: var(--accent); font: inherit; font-weight: 700; cursor: pointer; }
.auth-error { color: var(--bad); font-size: 13.5px; min-height: 20px; margin: 10px 0 0; text-align: center; }
.auth-error.working { color: var(--ink-2); }
.auth-loading { display: inline-flex; align-items: center; justify-content: center; gap: 7px; }
.btn-gear, .auth-gear { display: inline-block; animation: spin .9s linear infinite; transform-origin: 50% 50%; }
.btn-gear { margin-right: 7px; }
@media (prefers-reduced-motion: reduce) { .btn-gear, .auth-gear { animation: none; } }
.auth-server {
  margin-top: 18px; border-top: 1px solid var(--line-soft); padding-top: 12px;
}
.auth-server summary { cursor: pointer; color: var(--ink-3); font-size: 12.5px; font-weight: 650; }
.auth-server .field { margin-top: 12px; margin-bottom: 0; }
.account-box { display: flex; align-items: center; gap: 12px; }
.account-avatar {
  width: 42px; height: 42px; flex: none; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 800;
}
.account-main { flex: 1; min-width: 0; }
.account-name { font-weight: 750; }
.account-mail { color: var(--ink-2); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* --------------------------------------------------------------- PIN-Sperre */

.lock {
  position: fixed; inset: 0; z-index: 90;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
}
.lock.hidden { display: none; }
.lock-box { width: 300px; max-width: 86vw; text-align: center; }
.lock-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.lock-sub { color: var(--ink-2); margin: 4px 0 22px; font-size: 14px; }
.pin-dots { display: flex; gap: 14px; justify-content: center; margin-bottom: 26px; }
.pin-dots i {
  width: 13px; height: 13px; border-radius: 50%;
  border: 1.5px solid var(--ink-3); display: block;
}
.pin-dots i.on { background: var(--accent); border-color: var(--accent); }
.pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.pin-pad button {
  height: 64px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 23px; font-weight: 500;
  cursor: pointer;
}
.pin-pad button:active { background: var(--accent-soft); }
.pin-pad button.blank { border: 0; background: transparent; }
.lock-err { color: var(--bad); font-size: 13.5px; min-height: 20px; margin-top: 14px; }

/* ----------------------------------------------------------------- Diverses */

.hidden { display: none !important; }

.hint-box {
  background: var(--accent-soft);
  color: var(--ink);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  font-size: 13.5px;
  margin-bottom: 12px;
  line-height: 1.5;
}
.hint-box b { font-weight: 700; }

.warn-box {
  background: color-mix(in srgb, var(--warn) 14%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent);
  border-radius: var(--radius-sm);
  padding: 11px 13px;
  font-size: 13.5px;
  margin-bottom: 12px;
  line-height: 1.5;
}

.chiplist { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  padding: 6px 11px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--surface);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

.kv { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 14.5px; }
.kv + .kv { border-top: 1px solid var(--line-soft); }
.kv .k { color: var(--ink-2); }
.kv .v { font-weight: 650; font-variant-numeric: tabular-nums; }

.fab-space { height: 8px; }


/* ---------------------------------------------------- Mitarbeit-Vorschlag */

.ma-note-btn {
  width: 100%;
  min-width: 66px;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 5px 3px;
  border-radius: 8px;
  cursor: pointer;
  line-height: 1.15;
}
.ma-note-btn:active { background: var(--surface-2); }
.ma-note-btn .ma-wert { display: block; font-weight: 700; font-variant-numeric: tabular-nums; }
.ma-note-btn .ma-meta {
  display: block;
  margin-top: 2px;
  color: var(--ink-3);
  font-size: 9.5px;
  font-weight: 650;
  text-transform: uppercase;
  letter-spacing: .035em;
  white-space: nowrap;
}
.ma-note-btn.manuell .ma-meta { color: var(--accent); }
th .th-hint {
  display: block;
  margin-top: 2px;
  color: var(--accent);
  font-size: 9px;
  font-weight: 650;
  letter-spacing: .02em;
  text-transform: none;
}

/* ----------------------------------------------------- Offene Strafarbeiten */

.straf-offen {
  border-color: color-mix(in srgb, var(--bad) 30%, var(--line-soft));
}
.straf-offen-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border-bottom: 1px solid var(--line-soft);
}
.straf-offen-row:last-child { border-bottom: 0; }
.straf-offen-main { flex: 1; min-width: 0; }
.straf-offen-name { font-weight: 700; }
.straf-offen-sub { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }


/* ---------------------------------------------------------- Listen & To-dos */

.aufgaben-card { border-color: color-mix(in srgb, var(--accent) 20%, var(--line-soft)); }
.aufgaben-card.ueberfaellig {
  border: 2px solid var(--bad);
  background: color-mix(in srgb, var(--bad) 10%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 10%, transparent),
              0 8px 24px color-mix(in srgb, var(--bad) 16%, transparent);
}
.aufgaben-card.ueberfaellig .card-head {
  color: var(--bad);
  background: color-mix(in srgb, var(--bad) 16%, var(--surface));
  padding-bottom: 10px;
}
.aufgaben-card.ueberfaellig .aufgabe-row {
  background: color-mix(in srgb, var(--bad) 10%, var(--surface));
}
.aufgaben-card.ueberfaellig .aufgabe-row + .aufgabe-row {
  border-top-color: color-mix(in srgb, var(--bad) 24%, var(--line-soft));
}
.aufgaben-card.ueberfaellig .aufgabe-ico {
  background: color-mix(in srgb, var(--bad) 18%, var(--surface));
}
.aufgaben-card.ueberfaellig .aufgabe-title,
.aufgaben-card.ueberfaellig .aufgabe-frist.ueberfaellig {
  color: var(--bad);
}
.aufgaben-card.bald-faellig {
  border: 2px solid var(--warn);
  background: color-mix(in srgb, var(--warn) 8%, var(--surface));
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 7%, transparent);
}
.aufgaben-card.bald-faellig .card-head {
  color: var(--warn);
  background: color-mix(in srgb, var(--warn) 12%, var(--surface));
  padding-bottom: 10px;
}
.aufgaben-card.bald-faellig .aufgabe-row {
  background: color-mix(in srgb, var(--warn) 6%, var(--surface));
}
.aufgabe-row.bald .aufgabe-title,
.aufgabe-frist.bald,
.aufgabe-frist.heute { color: var(--warn); }
.aufgabe-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 12px;
  border-bottom: 1px solid var(--line-soft);
  background: var(--surface);
}
.aufgabe-row:last-child { border-bottom: 0; }
button.aufgabe-row {
  width: 100%;
  border-left: 0; border-right: 0; border-top: 0;
  color: inherit; text-align: left; cursor: pointer;
}
.aufgabe-row:active { background: var(--surface-2); }
.aufgabe-ico {
  flex: none;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 10px;
  background: var(--accent-soft);
  font-size: 18px;
}
.aufgabe-main { flex: 1; min-width: 0; }
.aufgabe-title { font-weight: 700; line-height: 1.25; }
.aufgabe-sub { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; line-height: 1.35; }
.aufgabe-frist {
  flex: none;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink-3);
  padding: 3px 7px;
  border-radius: 999px;
  background: var(--surface-2);
  white-space: nowrap;
}
.aufgabe-frist.heute { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.aufgabe-frist.bald { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, var(--surface)); }
.aufgabe-frist.ueberfaellig { color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--surface)); }
.aufgabe-progress {
  margin-top: 6px;
  height: 5px;
  border-radius: 999px;
  background: var(--line-soft);
  overflow: hidden;
}
.aufgabe-progress > i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--accent);
}
.aufgabe-neu-zeile { padding: 10px 12px; }

.listen-kopf { margin-bottom: 10px; }
.listen-meta { color: var(--ink-2); font-size: 13px; line-height: 1.5; }
.listen-fortschritt {
  display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  margin: 12px 0 8px;
}
.listen-fortschritt b { font-size: 18px; }
.listen-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
}
.listen-sus {
  min-height: 48px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  color: inherit;
  padding: 8px 10px;
  text-align: left;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 650;
}
.listen-sus .check {
  flex: none;
  width: 22px; height: 22px;
  border: 1px solid var(--line);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  color: transparent;
  background: var(--surface-2);
  font-weight: 800;
}
.listen-sus.on {
  border-color: color-mix(in srgb, var(--good) 45%, var(--line));
  background: color-mix(in srgb, var(--good) 8%, var(--surface));
}
.listen-sus.on .check { background: var(--good); border-color: var(--good); color: white; }
.listen-actions { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }

@media (max-width: 420px) {
  .listen-grid { grid-template-columns: 1fr; }
  .aufgabe-frist { display: none; }
}

/* ---------------------------------------------------------- Unterrichtstools */

.mitarbeit-actions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  padding: 10px 12px 12px;
  border-top: 1px solid var(--line-soft);
  background: var(--surface-2);
}
.mitarbeit-actions .btn { margin: 0; }
@media (max-width: 430px) {
  .mitarbeit-actions { grid-template-columns: 1fr; }
}

.stunden-tools {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-bottom: 12px;
}
.stunden-tools .btn {
  min-width: 0;
  padding-left: 8px;
  padding-right: 8px;
  white-space: normal;
  line-height: 1.15;
}

.klasse-sitzplan-card { margin-top: 8px; }
.tool-result {
  padding: 12px 0 2px;
}
.tool-result-name {
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -.03em;
  text-align: center;
  padding: 14px 8px 18px;
}
.gruppen-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.gruppe-box {
  padding: 10px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
}
.gruppe-box b { display:block; margin-bottom:5px; }
.gruppe-box div { font-size: 13px; line-height: 1.45; }

/* --------------------------------------------------------------- Sitzplan */

.sitz-raum {
  overflow: hidden;
}
.sitz-tafel-wrap {
  display: flex;
  justify-content: center;
  margin: 0 0 16px;
}
.sitz-tafel {
  width: min(360px, 48%);
  min-width: 150px;
  padding: 7px 12px 6px;
  border-radius: 4px 4px 9px 9px;
  border-top: 5px solid var(--ink-3);
  text-align: center;
  color: var(--ink-3);
  font-size: 10.5px;
  font-weight: 750;
  letter-spacing: .1em;
  text-transform: uppercase;
}
.sitz-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  padding: 2px 1px 7px;
}
.sitz-tisch-grid {
  display: grid;
  grid-template-columns: repeat(var(--tische-pro-reihe), minmax(0, 1fr));
  gap: 18px 20px;
  touch-action: pan-y;
}
.sitz-tisch {
  position: relative;
  min-width: 0;
  padding: 8px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: var(--surface-2);
  box-shadow: 0 1px 0 rgba(20, 28, 45, .03);
}
.sitz-tisch::before {
  content: '';
  display: block;
  height: 3px;
  width: 54%;
  margin: -3px auto 7px;
  border-radius: 99px;
  background: var(--line);
}
.sitz-tisch-sitze {
  display: grid;
  grid-template-columns: repeat(var(--sitzanzahl, 2), minmax(58px, 1fr));
  gap: 6px;
}
.sitzplatz {
  min-width: 0;
  min-height: 60px;
  padding: 7px 5px;
  border-radius: 9px;
  border: 1px solid var(--line-soft);
  background: var(--surface);
  color: var(--ink);
  cursor: grab;
  text-align: center;
  font-size: 12.5px;
  font-weight: 650;
  line-height: 1.22;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  overflow-wrap: anywhere;
}
.sitzplatz:active { cursor: grabbing; }
.sitzplatz.frei {
  color: var(--ink-3);
  border-style: dashed;
  font-weight: 500;
  background: color-mix(in srgb, var(--surface) 72%, transparent);
}
.sitzplatz.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
  background: var(--accent-soft);
}
.sitzplatz.dragging { opacity: .38; }
.sitzplatz.drop-target,
.sitz-tisch-edit.drop-target,
.sitz-tisch-slot.drop-target {
  border-color: var(--accent) !important;
  box-shadow: inset 0 0 0 2px var(--accent);
  background: var(--accent-soft) !important;
}

/* Eine echte Lücke im Raum bleibt optisch wirklich leer. */
.sitz-tisch-luecke {
  min-height: 84px;
  border: 0;
  background: transparent;
  pointer-events: none;
}

/* Layoutmodus: ganze Doppeltische statt einzelner Sitzplätze verschieben. */
.sitz-tisch-edit,
.sitz-tisch-slot {
  position: relative;
  min-width: 0;
  min-height: 84px;
  border-radius: 13px;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.sitz-tisch-edit {
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  cursor: grab;
  padding: 22px 10px 10px;
  text-align: center;
}
.sitz-tisch-edit:active { cursor: grabbing; }
.sitz-tisch-edit.dragging { opacity: .38; }
.sitz-tisch-edit::before {
  content: '';
  position: absolute;
  top: 9px;
  left: 18%;
  right: 18%;
  height: 3px;
  border-radius: 99px;
  background: var(--line);
}
.sitz-tisch-griff {
  position: absolute;
  top: 4px;
  right: 7px;
  color: var(--ink-3);
  font-size: 15px;
  line-height: 1;
  letter-spacing: -2px;
  opacity: .78;
}
.sitz-tisch-namen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  font-size: 12.5px;
  font-weight: 650;
  line-height: 1.3;
}
.sitz-tisch-namen .leer {
  color: var(--ink-3);
  font-weight: 550;
}
.sitz-tisch-groesse {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-top: 4px;
  padding: 2px 7px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line-soft);
  color: var(--ink-3);
  font-size: 10.5px;
  font-weight: 700;
  line-height: 1.2;
}
.sitz-tisch-slot {
  border: 1px dashed var(--line);
  background: transparent;
  color: var(--ink-3);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  font-size: 11px;
  font-weight: 650;
}
.sitz-tisch-slot .plus {
  font-size: 23px;
  line-height: 1;
  font-weight: 350;
}
.sitz-layout-hinweis {
  margin: 2px 0 12px;
  color: var(--ink-3);
  font-size: 12.5px;
  line-height: 1.45;
  text-align: center;
}
.sitz-mode-on {
  background: var(--accent-soft) !important;
  border-color: var(--accent) !important;
  color: var(--accent) !important;
}
.sitz-drag-ghost {
  position: fixed;
  z-index: 9999;
  left: 0; top: 0;
  pointer-events: none;
  padding: 8px 11px;
  border-radius: 10px;
  background: var(--surface);
  border: 1px solid var(--accent);
  box-shadow: 0 7px 25px rgba(0,0,0,.18);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
  max-width: 180px;
}

@media (max-width: 520px) {
  .sitz-tisch-grid { gap: 13px 14px; }
  .sitzplatz { min-height: 55px; font-size: 11.5px; }
  .sitz-tisch-edit, .sitz-tisch-slot, .sitz-tisch-luecke { min-height: 76px; }
}

/* Schüler:innen in einer Klasse: auf größeren Displays kompakt zweispaltig. */
.sus-grid { display: grid; grid-template-columns: 1fr; }
@media (min-width: 700px) {
  .sus-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sus-grid .row { border-bottom: 1px solid var(--line-soft); }
  .sus-grid .row:nth-child(odd) { border-right: 1px solid var(--line-soft); }
}

@media (max-width: 700px) {
  .stunden-tools { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 420px) {
  .stunden-tools { grid-template-columns: 1fr; }
  .sitzplatz { min-height: 52px; font-size: 11.5px; }
}
